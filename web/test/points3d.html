<!doctype html>
<meta charset="utf-8">
<title>3-D points</title>
<!-- One <caliper-view> of the producer's embedding per renderer named in ?r=
     (ts, wasm), for test/points3d.spec.ts; the stream comes from this page's
     own origin and ?token=. -->
<body style="margin:0;background:#181715">
<script type="module">
  import '/caliper-view.js';
  const q = new URLSearchParams(location.search);
  const src = `ws://${location.host}/v3/stream?token=${q.get('token')}`;
  const [w, h] = (q.get('size') ?? '560x440').split('x');
  for (const r of (q.get('r') ?? 'ts').split(',')) {
    const el = document.createElement('caliper-view');
    el.id = r;
    el.setAttribute('src', src);
    el.setAttribute('view', 'embedding');
    el.setAttribute('renderer', r);
    el.style.cssText = `display:block;width:${w}px;height:${h}px;margin:8px`;
    document.body.append(el);
  }
</script>
</body>
