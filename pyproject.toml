[build-system]
requires = ["scikit-build-core>=1.1.2", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "caliper"
version = "0.1.0"
description = "Live tensor views for PyTorch: caliper.show/points/series/histogram stream GPU snapshots to the Caliper app or an in-process window, zero-copy for MPS tensors"
requires-python = ">=3.12"
dependencies = ["numpy", "websockets", "Pillow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
torch = ["torch"]
test = [
    "pytest",
    "jsonschema",
    "anywidget",
    "pyyaml",
    "torch>=2.15.0",
    "safetensors",
    "psutil",
    "datasets",
    "transformers>=5.24.0,<5.25.0",
    "transformer-lens==4.4.0",
    "sae-lens==6.56.3",
    "nnsight==0.8.4",
    "circuit-tracer @ git+https://github.com/decoderesearch/circuit-tracer.git@82996f144b3371ae858ea5713590d004c218f0c2",
]
notebook = ["anywidget"]
interp = [
    "torch>=2.15.0",
    "safetensors",
    "psutil",
    "datasets",
    "transformers>=5.24.0,<5.25.0",
    "transformer-lens==4.4.0",
    "sae-lens==6.56.3",
    "nnsight==0.8.4",
    "circuit-tracer @ git+https://github.com/decoderesearch/circuit-tracer.git@82996f144b3371ae858ea5713590d004c218f0c2",
]

[tool.scikit-build]
minimum-version = "0.10"
# Incremental rebuilds: the root CMake builds DuckDB from source, so keep one
# persistent build tree per wheel tag instead of a throwaway temp dir.
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
# Source dir is the repo root (the root CMake uses ${CMAKE_SOURCE_DIR}); only the
# module and its transitive deps are built, and only the "python" install
# component (the root's SDK install rules stay out of the wheel).
build.targets = ["_native", "_live", "_netio", "_producer", "caliper_viewer"]
install.components = ["python"]
wheel.packages = ["python/caliper"]
# The browser's WebAssembly views (python/caliper/_web/caliper-views*) are git-ignored
# build outputs; naming them includes them in the sdist and the wheel whenever they are
# there (python/check_web_views.cmake warns, or fails in CI, when a wheel lacks them).
sdist.include = ["python", "pyproject.toml", "python/caliper/_web/caliper-views*"]
sdist.exclude = ["build", "dist", ".venv", "cmake-build-*", "site", "dump"]

[tool.scikit-build.cmake.define]
CALIPER_BUILD_PYTHON = "ON"
CALIPER_WITH_TORCH = "OFF"
CALIPER_BUILD_APPLETS = "OFF"
CALIPER_BUILD_EXAMPLES = "OFF"
BUILD_TESTS = "OFF"
USE_CUDA = "OFF"
# Drop the chrome-only deps (slang) from the wheel configure.
CALIPER_WITH_SLANG = "OFF"
# macOS 14.0 (Sonoma) or later, as cmake/CaliperMacOSTarget.cmake explains:
# scikit-build-core also takes the wheel's platform tag from this define, so
# the tag is macosx_14_0_arm64 on any build machine (it is ignored elsewhere).
CMAKE_OSX_DEPLOYMENT_TARGET = "14.0"
# The builder (src/builder) is not part of Caliper LIB; OFF keeps its targets,
# its nlohmann/json download and DuckDB's json extension out of the wheel.
CALIPER_WITH_BUILDER = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests", "tests/demos", "tests/interp"]
markers = [
    "local_model: requires a downloaded model and never runs in CI",
    "gpu: requires an explicit accelerator test run",
    "window: requires a macOS window server and Metal GPU",
    "notebook: requires JupyterLab, ipykernel, Playwright Chromium, and WebGPU",
    "timing: wall-clock timing or stress check sensitive to hosted-runner contention",
]
