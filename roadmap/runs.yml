# yaml-language-server: $schema=schema.json
prefix: RUN
title: Runs and Comparison
order: 6
summary: This pillar covers how Caliper keeps the history of runs on the machine and compares them, from the metrics and artifacts stores that exist today to a run database, a history browser and side-by-side views of several runs.
features:
  - id: RUN-01
    title: Metrics Stores Grouped by Run
    status: shipped
    scope: peripheral
    summary: The metrics service logs scalars, histograms, images and hyperparameters under an experiment, a run, a tag and a step, and stores them so that each run's curves can be read back in order.
    depends_on: []
    docs: docs/applets/services/caliper-metrics-v1.md
    issue: null

  - id: RUN-02
    title: Artifacts
    status: shipped
    scope: peripheral
    summary: The artifacts service is a content-addressed store of checkpoints and exports, deduplicated on disk by their sha256 digest and linked to the run that produced them.
    depends_on: []
    docs: docs/applets/services/caliper-artifacts-v1.md
    issue: null

  - id: RUN-03
    title: Run Database
    status: planned
    scope: peripheral
    summary: A local database keeps the runs that the metrics and artifacts stores record as a history that outlives each session.
    depends_on: [RUN-01, RUN-02]
    sprint: 5
    issue: null

  - id: RUN-04
    title: History Browser
    status: planned
    scope: peripheral
    summary: A browser in the app lists the stored runs and opens any of them.
    depends_on: [RUN-03]
    sprint: 5
    issue: null

  - id: RUN-05
    title: Run Comparison
    status: planned
    scope: peripheral
    summary: One page holds two or more runs, each live or recorded, and shows their views side by side.
    depends_on: [RUN-03, STR-13]
    sprint: 5
    issue: null

  - id: RUN-06
    title: Shared Cursor Across Runs
    status: planned
    scope: peripheral
    summary: One cursor moves every run on the page together, aligning runs by step or by time and showing the latest earlier item, with its distance, for a run that has none at the cursor.
    depends_on: [RUN-05]
    sprint: 5
    issue: null

  - id: RUN-07
    title: Linked Cameras and Selections
    status: planned
    scope: peripheral
    summary: Runs compared on one page share their cameras and their selections, so that moving or selecting in one run does the same in the others.
    depends_on: [REN-12, RUN-05]
    sprint: 5
    issue: null

  - id: RUN-08
    title: Difference Views
    status: planned
    scope: peripheral
    summary: A difference view shows one run minus another as a heatmap for tensors of the same shape, with loss curves overlaid on one axis and histograms on shared bins.
    depends_on: [RUN-05]
    sprint: 5
    issue: null

  - id: RUN-09
    title: Error Bands
    status: planned
    scope: peripheral
    summary: Error bands draw the uncertainty of a series as a shaded range around its line.
    depends_on: [RUN-05]
    sprint: 5
    issue: null

  - id: RUN-10
    title: Checkpoint Browser
    status: idea
    scope: peripheral
    summary: A checkpoint browser would list stored checkpoints with previews and might resume training from one.
    depends_on: [RUN-02]
    design: design/roadmap.md#undecided
    issue: null

  - id: RUN-11
    title: Learning-Rate Comparison Demo
    status: planned
    scope: peripheral
    summary: A demo compares two learning rates and shows which one separates the Fashion-MNIST classes first.
    depends_on: [RUN-08]
    sprint: 5
    issue: null

  - id: RUN-12
    title: Import of Other Trackers' Logs
    status: idea
    scope: peripheral
    summary: Logs from other experiment trackers, such as TensorBoard, could be imported into the run database.
    depends_on: [RUN-03]
    issue: null

  - id: RUN-13
    title: Hyperparameter Sweep Views
    status: idea
    scope: peripheral
    summary: Views could show the runs of a hyperparameter sweep together.
    depends_on: [RUN-05]
    issue: null

  - id: RUN-14
    title: Managed Runs
    status: shipped
    scope: core
    summary: The model runner of the app starts a script of the workspace as a managed run, and the commands run.start, run.stop, run.list and run.logs control it, with a review card before every start.
    depends_on: [AGT-17, SPC-06, STR-55]
    docs: docs/agents/managed-runs.md#tools
    issue: null

  - id: RUN-15
    title: Run Fork
    status: shipped
    scope: core
    summary: The command run.fork starts a new run from a checkpoint of a running or paused run with changed parameters, so that the fork keeps the model and optimizer state and records its parent.
    depends_on: [RUN-14]
    docs: docs/agents/managed-runs.md#fork
    issue: null

  - id: RUN-16
    title: Run Sources of Managed Runs
    status: shipped
    scope: peripheral
    summary: The catalog source run:<id>/<view> draws the series of a managed run that the app does not show, so that two loss curves, such as a run and its fork, share one panel.
    depends_on: [RUN-14]
    docs: docs/agents/managed-runs.md#two-runs-in-one-panel
    issue: null
