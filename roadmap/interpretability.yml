# yaml-language-server: $schema=schema.json
prefix: INT
title: Interpretability and Interventions
order: 7
summary: This pillar covers the tools for looking inside a model while it runs and the interventions that change a model's computation during a run.
features:
  - id: INT-04
    title: Controls for Experiments
    status: shipped
    scope: core
    summary: Protocol 3.1 controls let a viewer pause, step and resume a running script, change its registered parameters and run its registered actions, which an interpretability run uses to repeat an experiment.
    depends_on: [STR-03]
    docs: docs/python/script-control.md
    issue: null

  - id: INT-05
    title: Inspector
    status: built
    scope: peripheral
    summary: The inspector is an instrument that attaches to a running script and shows its model in docked panes for inference, the list of tensors, a single tensor and the J-space trace.
    depends_on: [INT-08]
    branches: [inspector]
    issue: null

  - id: INT-06
    title: Inspector Tensor View
    status: built
    scope: peripheral
    summary: The tensor view draws a tensor at its true shape, zooms down to single cells by sampling the visible region, and lets a person read and edit cells, rows and columns.
    depends_on: [INT-05]
    branches: [inspector]
    issue: null

  - id: INT-07
    title: Inspector 3-D Model View
    status: built
    scope: peripheral
    summary: The 3-D model view draws every tensor of a model as a panel sized to its shape and textured with its heatmap, grouped and stacked by layer.
    depends_on: [INT-05]
    branches: [inspector]
    issue: null

  - id: INT-08
    title: App-to-Script Requests
    status: built
    scope: core
    summary: A script serves requests over a socket next to its session, so the app can ask it to run a task, stream events back, cancel it and fetch tensor values in binary chunks.
    depends_on: [STR-04]
    branches: [inspector]
    issue: null

  - id: INT-09
    title: Language Models Run from the App
    status: built
    scope: peripheral
    summary: An example script loads a small language model with MLX and serves the inspector's requests, with generation, a tensor list, sampled views and in-memory weight edits.
    depends_on: [INT-08]
    branches: [inspector]
    issue: null

  - id: INT-10
    title: Intervention API
    status: planned
    scope: core
    summary: Intervention points declared on a PyTorch model in Caliper LIB let the viewer ablate, scale, steer and patch at step boundaries, with each intervention recorded with the run and compared with the original.
    depends_on: [INT-20, INT-32, RUN-05]
    sprint: 6
    design: design/roadmap.md#streaming-and-embedding
    issue: null

  - id: INT-11
    title: Ablate
    status: shipped
    scope: core
    summary: Ablate sets the output of a module, or the slice of one attention head, to zero at a step boundary while the run trains, from a command or from a toggle control bound to an intervention point.
    depends_on: [INT-34]
    design: design/roadmap.md#streaming-and-embedding
    docs: docs/agents/run-control-and-events.md#toggle-control
    issue: null

  - id: INT-12
    title: Scale
    status: planned
    scope: core
    summary: Scale multiplies a chosen activation or direction by a factor during a run.
    depends_on: [INT-10]
    sprint: 6
    issue: null

  - id: INT-13
    title: Steer
    status: planned
    scope: core
    summary: Steer adds a chosen direction to the residual stream at selected layers and positions during a run.
    depends_on: [INT-10]
    sprint: 6
    design: design/roadmap.md#streaming-and-embedding
    issue: null

  - id: INT-14
    title: Patch
    status: planned
    scope: core
    summary: Patch replaces an activation in one run with the matching activation from another run.
    depends_on: [INT-10]
    sprint: 6
    issue: null

  - id: INT-15
    title: J-Space Trace Pane
    status: built
    scope: peripheral
    summary: The Trace pane reads a model through a Jacobian lens as it generates, showing the J-space grid and the attention patterns token by token, with a playback clock and the whole run as a tape.
    depends_on: [INT-05, INT-32]
    branches: [inspector]
    issue: null

  - id: INT-18
    title: MLX Support
    status: planned
    scope: peripheral
    summary: Support for MLX lets the interpretability tools read activations and apply interventions on models written in MLX.
    depends_on: [INT-10, STR-49]
    issue: null

  - id: INT-19
    title: JAX Support
    status: planned
    scope: peripheral
    summary: Support for JAX lets the interpretability tools read activations and apply interventions on models written in JAX.
    depends_on: [INT-10, STR-50]
    issue: null

  - id: INT-20
    title: Interventions and the Inspector
    status: decision
    scope: peripheral
    summary: This decision sets when the inspector branch, which already holds a J-space Trace pane and J-space interventions, merges, and how those interventions become the general intervention API of sprint 6.
    depends_on: []
    issue: null

  - id: INT-21
    title: Interventions from the Viewer
    status: planned
    scope: core
    summary: A person picks a head in the attention view and ablates it, or turns a selection in an embedding into a steering direction, from the viewer.
    depends_on: [INT-10]
    sprint: 6
    issue: null

  - id: INT-22
    title: nnsight and TransformerLens Adapters
    status: planned
    scope: peripheral
    summary: A model wrapped in nnsight or TransformerLens offers its intervention points to Caliper through an adapter.
    depends_on: [INT-10]
    sprint: 6
    issue: null

  - id: INT-24
    title: OpenGLlama Instrument
    status: idea
    scope: peripheral
    summary: OpenGLlama could return as an instrument of its own beside the inspector.
    depends_on: [INT-05]
    issue: null

  - id: INT-28
    title: Vocabulary Embedding View
    status: built
    scope: peripheral
    summary: A 3-D view draws every row of a model's embedding table as a point, grouped by token kind, so that a person can orbit the vocabulary and read a token by hovering its point.
    depends_on: [INT-05, INT-09]
    branches: [inspector]
    issue: null

  - id: INT-29
    title: Token Trajectories
    status: built
    scope: peripheral
    summary: A 3-D view draws each token of a run as a path up the model's layers and marks the layer from which the lens settles on the next token.
    depends_on: [INT-15]
    branches: [inspector]
    issue: null

  - id: INT-30
    title: GrokScope
    status: built
    scope: peripheral
    summary: GrokScope is an instrument in which a small network learns modular addition, memorising first and generalising thousands of steps later, shown as a tower of rings of its token embedding.
    depends_on: [COR-04]
    branches: [inspector]
    issue: null

  - id: INT-31
    title: Interpretability Example Scripts
    status: built
    scope: peripheral
    summary: Two example scripts reproduce published interpretability measurements live in Caliper, finding induction heads in one small language model and a truth direction in another.
    depends_on: [STR-01]
    branches: [inspector]
    issue: null

  - id: INT-32
    title: J-Space Interventions
    status: built
    scope: peripheral
    summary: The inspector reads a running language model through a Jacobian lens and intervenes in its J-space across a band of layers, by ablating, removing or swapping lens directions or injecting a scaled direction, with intact and intervened runs sampled alike.
    depends_on: [INT-09]
    branches: [inspector]
    issue: null

  - id: INT-33
    title: Interventions in the Trace Pane
    status: planned
    scope: peripheral
    summary: The Trace pane drives the intervention API, so that a person intervenes from the trace view on any model that the API supports and compares the run before and after.
    depends_on: [INT-10, INT-15]
    sprint: 6
    issue: null

  - id: INT-34
    title: Intervention Commands
    status: shipped
    scope: core
    summary: The commands intervene.points, intervene.set, intervene.clear and intervene.list make each module and each attention head of the attached script an intervention point, and apply an ablation at the next step.
    depends_on: [AGT-31, STR-55]
    docs: docs/agents/run-control-and-events.md#intervention-commands
    issue: null

  - id: INT-35
    title: Model Probes
    status: shipped
    scope: core
    summary: Model probes expose residual streams, MLP inputs and outputs, and attention patterns on PyTorch and HookedTransformer models without a CPU copy.
    depends_on: [INT-34]
    docs: docs/python/interpretability.md#model-probes
    issue: null

  - id: INT-36
    title: Feature Dictionaries
    status: shipped
    scope: core
    summary: Dictionary adapters connect SAELens sparse autoencoders and circuit-tracer transcoders to Caliper with staged device loads and lazy decoder lookups.
    depends_on: [INT-35]
    docs: docs/python/interpretability.md#feature-dictionaries
    issue: null

  - id: INT-37
    title: Example Index
    status: shipped
    scope: core
    summary: Live and disk indexes retrieve top activating 33-token windows from Neuronpedia or local prompts and publish ranked windows to token strips.
    depends_on: [INT-36]
    docs: docs/python/interpretability.md#example-index
    issue: null

  - id: INT-38
    title: Attribution Graphs
    status: shipped
    scope: core
    summary: Circuit attribution runs circuit-tracer over ReplacementModel transcoders, prunes on CPU, and publishes up to 8,192 nodes and 262,144 edges.
    depends_on: [INT-35, INT-36]
    docs: docs/python/interpretability.md#attribution-graphs
    issue: null

  - id: INT-39
    title: Graph Pieces
    status: shipped
    scope: core
    summary: Library pieces draw attribution graphs, feature examples, activation heatmaps, and paired output probabilities in the native app and browser viewer.
    depends_on: [INT-38]
    docs: docs/python/interpretability.md#graph-pieces
    issue: null

  - id: INT-40
    title: Feature Steering
    status: shipped
    scope: core
    summary: Feature interventions clamp or scale transcoder and SAE features or add vectors at selected positions, with live baseline-versus-steered bars.
    depends_on: [INT-34, INT-36]
    docs: docs/python/interpretability.md#feature-steering
    issue: null

  - id: INT-41
    title: Activation Patching
    status: shipped
    scope: core
    summary: Activation patches substitute clean prompt activations, and patch.sweep measures normalized recovery across all layers and token positions.
    depends_on: [INT-35, INT-40]
    docs: docs/python/interpretability.md#activation-patching
    issue: null

  - id: INT-42
    title: Inference Runs
    status: shipped
    scope: core
    summary: Hosted inference runs expose prompt controls, traced features, one-click circuit interventions, fork checkpoints, and paired greedy generation.
    depends_on: [INT-38, INT-39, INT-40, INT-41]
    docs: docs/agents/interpretation.md#inference-runs
    issue: null
