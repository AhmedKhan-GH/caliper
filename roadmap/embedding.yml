# yaml-language-server: $schema=schema.json
prefix: EMB
title: Web and embedding
order: 8
summary: "This pillar covers how Caliper reaches a browser or another program: the web viewer, its views and elements, the embedding package, and the planned steps to the whole interface in a browser and to other languages."
features:
  - id: EMB-01
    title: The web viewer
    status: shipped
    summary: The web viewer shows live views from a Caliper stream in a browser, as the viewer page that caliper.serve() serves and as the notebook widget.
    depends_on: [EMB-05, STR-05]
    docs: docs/references/browser-elements.md#the-viewer-page-and-the-widgets
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null

  - id: EMB-02
    title: Points in the browser
    status: shipped
    summary: Points draw in the browser through the WebGPU renderer, as instanced quads with the native colour rule and depth test, because WebGPU draws a point one pixel wide.
    depends_on: [EMB-04]
    docs: docs/explanations/rendering.md#the-webgpu-backend
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null

  - id: EMB-03
    title: TypeScript views
    status: shipped
    summary: Views written in TypeScript draw every live view kind in the browser, with Canvas 2D where needed, when WebGPU gives no adapter.
    depends_on: [EMB-05]
    docs: docs/references/browser-elements.md#caliper-view
    issue: null

  - id: EMB-04
    title: WebAssembly views
    status: shipped
    summary: Caliper's own view layer, compiled to WebAssembly and drawn through WebGPU, draws every live view kind in the browser behind the caliper-view element.
    depends_on: [EMB-05]
    docs: docs/explanations/network-streaming.md#one-set-of-calls-three-transports
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null

  - id: EMB-05
    title: Browser elements
    status: shipped
    summary: The web package defines the custom elements caliper-view and caliper-controls, which read a wire protocol v3 stream and share one WebSocket per source.
    depends_on: [STR-02]
    docs: docs/references/browser-elements.md
    issue: null

  - id: EMB-06
    title: The spec page
    status: shipped
    summary: A saved spec applet opens in a browser tab at the page that Caliper API serves at /v0/spec, drawn with the spec page's layout and look from the app's panel data.
    depends_on: [SPC-08, AGT-01]
    docs: docs/references/api.md#get-v0spec
    design: design/streaming-and-embedding.md#spec-applets
    issue: null

  - id: EMB-07
    title: Caliper Embed 1.4.0
    status: shipped
    summary: Caliper Embed 1.4.0 is the framework core behind a small C ABI, installed as one shared library with headers and a CMake package, with a version call and typed live views.
    depends_on: [COR-01]
    docs: docs/references/embedding.md#versions
    design: design/streaming-and-embedding.md#the-embedding-package
    issue: null

  - id: EMB-08
    title: The geometry path in the browser
    status: planned
    summary: The geometry path, with its meshes, lines and primitives, draws in the browser through a WebGPU geometry pipeline that works within the limit on storage buffers of a vertex stage.
    depends_on: [EMB-02, REN-07]
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null
    draft: true

  - id: EMB-09
    title: ImPlot3D in the browser
    status: planned
    summary: ImPlot3D, which five applets use for 3-D plots, is part of the browser module so that its views draw in a browser.
    depends_on: [EMB-02]
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null

  - id: EMB-10
    title: The whole interface in a browser
    status: planned
    summary: The whole Caliper interface runs in a browser, with the landing screen, docking and the panes, using the browser's file system, DuckDB's WebAssembly build and cross-origin isolation.
    depends_on: [EMB-04]
    design: design/streaming-and-embedding.md#the-web-viewer
    issue: null

  - id: EMB-11
    title: Applets in a browser
    status: planned
    summary: Applets run in a browser by splitting each into a native computation and a WebAssembly interface that draws from the data stream.
    depends_on: [SPC-21, EMB-10]
    design: design/streaming-and-embedding.md#applets-in-the-browser
    issue: null

  - id: EMB-12
    title: Several canvases per core
    status: planned
    summary: One embedded core hosts several canvases, where it now refuses a second canvas after the first.
    depends_on: [EMB-07]
    design: design/streaming-and-embedding.md#the-embedding-package
    issue: null

  - id: EMB-13
    title: Embedding in web pages
    status: planned
    summary: Caliper's browser views are embedded in web pages beyond the viewer page and the notebook widgets.
    depends_on: [EMB-05]
    issue: null
    draft: true

  - id: EMB-14
    title: Rust bindings
    status: planned
    summary: Rust bindings let a Rust program embed Caliper through the embed ABI.
    depends_on: [EMB-07]
    design: design/streaming-and-embedding.md#the-order-of-surfaces
    issue: null

  - id: EMB-15
    title: Swift bindings
    status: planned
    summary: Swift bindings let a Swift program embed Caliper through the embed ABI.
    depends_on: [EMB-07]
    design: design/streaming-and-embedding.md#the-order-of-surfaces
    issue: null
