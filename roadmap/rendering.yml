# yaml-language-server: $schema=schema.json
prefix: REN
title: Rendering and 3-D
order: 2
summary: "This pillar covers how Caliper turns tensors and 3-D data into pixels: the Metal and Vulkan renderers, the graphics layer and scene core, and the scene features planned on them."
features:
  - id: REN-01
    title: Metal Renderer
    status: shipped
    scope: supporting
    summary: The Metal renderer is the default on macOS and reads PyTorch's MPS buffers in place with a compute pass or a blit, so a tensor reaches a texture without a CPU copy.
    depends_on: []
    docs: docs/applets/rendering.md#backends
    issue: null

  - id: REN-02
    title: Vulkan Renderer with CUDA
    status: shipped
    scope: supporting
    summary: The Vulkan renderer with CUDA interop is the default on Windows and writes the Vulkan image directly from a CUDA kernel, with timeline semaphores for synchronization.
    depends_on: []
    docs: docs/development/vulkan-and-cuda.md
    issue: null

  - id: REN-03
    title: OpenGL Fallback
    status: shipped
    scope: supporting
    summary: The OpenGL fallback draws where neither Metal nor Vulkan is available and stages tensors through the CPU, so it is the slow path and says so.
    depends_on: []
    docs: docs/python/zero-copy-tensors.md#cpu-tensors
    issue: null

  - id: REN-04
    title: geometry.v1
    status: built
    scope: peripheral
    summary: Removed in ABI epoch 3. caliper.geometry.v1 drew instanced points from imported device memory into an offscreen view texture.
    depends_on: [REN-08]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-05
    title: geometry.v1_1
    status: built
    scope: peripheral
    summary: Removed in ABI epoch 3. caliper.geometry.v1_1 added general primitives, depth views and one atomic gated frame.
    depends_on: [REN-04]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-06
    title: geometry.v1_2
    status: built
    scope: peripheral
    summary: Removed in ABI epoch 3. caliper.geometry.v1_2 added textures on meshes.
    depends_on: [REN-05]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-07
    title: geometry.v1_3
    status: built
    scope: peripheral
    summary: Removed in ABI epoch 3. caliper.geometry.v1_3 added instanced transforms.
    depends_on: [REN-06]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-08
    title: Zero-Copy from Torch
    status: shipped
    scope: core
    summary: "A PyTorch tensor on MPS or CUDA reaches the screen without a host copy: the renderer reads or imports its device memory, and a ladder of synchronization modes orders the work."
    depends_on: [REN-01, REN-02]
    docs: docs/python/zero-copy-tensors.md#tensor-texture-paths
    issue: null

  - id: REN-09
    title: Graphics Layer
    status: shipped
    scope: core
    summary: The graphics layer, an internal C++ layer shaped like WebGPU, holds buffers, textures, pipelines, draw lists and a uniform arena, validates every frame, and has a Metal backend.
    depends_on: [REN-01]
    docs: docs/applets/graphics-layer.md#backends
    issue: null

  - id: REN-10
    title: WGSL Shaders Through Naga
    status: shipped
    scope: core
    summary: Scene shaders are written once in WGSL, and a generator with a pinned Naga translates them into the programs that each backend of the graphics layer loads.
    depends_on: [REN-09]
    docs: docs/applets/shader-authoring.md#translator
    issue: null

  - id: REN-11
    title: Scene Core
    status: shipped
    scope: core
    summary: "The scene core is the one camera and scene model of the views: an entity tree with cameras, bounds and fitting, which it compiles into a draw list of the graphics layer, with a pick pass."
    depends_on: [REN-10]
    docs: docs/applets/scene-rendering.md#scene-core
    issue: null

  - id: REN-12
    title: Scene View
    status: shipped
    scope: core
    summary: The scene view is a live view of kind scene that draws the points, lines and meshes of a protocol 3.2 scene through the scene core, in the app and in the browser, with an orbit camera.
    depends_on: [REN-11, REN-14, STR-09]
    docs: docs/applets/scene-rendering.md#scene-view
    issue: null

  - id: REN-13
    title: WebGPU Backend of the Graphics Layer
    status: shipped
    scope: core
    summary: The WebGPU backend of the graphics layer runs in the browser, so the WebAssembly views draw scenes through the same layer as the native renderers.
    depends_on: [EMB-04, REN-10]
    docs: docs/applets/rendering.md#webgpu-backend
    issue: null

  - id: REN-14
    title: Colormap by Keys
    status: shipped
    scope: core
    summary: A colormap is decided by integer comparisons against keys derived once from the CPU reference, so every shader and adapter gives the same colours as the reference.
    depends_on: [REN-13]
    docs: docs/applets/graphics-layer.md#colormap-by-keys
    issue: null

  - id: REN-15
    title: Picking
    status: shipped
    scope: core
    summary: Picking finds the entity, item and row under the pointer through a pick pass of the scene core on the graphics layer, natively and in a browser.
    depends_on: [REN-11]
    docs: docs/applets/scene-rendering.md#scene-core
    issue: null

  - id: REN-16
    title: Applets on the Scene Service
    status: planned
    scope: supporting
    summary: EmbedScope and GPTScope draw through the scene service, so that every 3-D applet of the repository draws through one scene model.
    depends_on: [REN-35]
    sprint: 4
    design: design/roadmap.md#renderers
    issue: null

  - id: REN-17
    title: End of OpenGL
    status: built
    scope: supporting
    summary: The GLEW OpenGL fallback is removed, and where neither Metal nor Vulkan starts, the app says so and exits instead of drawing through the CPU.
    depends_on: [REN-03]
    sprint: 4
    branches: [sprint4-integ3, sprint4-pr2]
    issue: null

  - id: REN-18
    title: Mesh Files
    status: planned
    scope: core
    summary: Mesh files in glTF, OBJ and STL format load through the loaders into mesh sources of a scene, instead of each script reading them by hand.
    depends_on: [REN-11, SPC-03]
    sprint: 5
    issue: null

  - id: REN-19
    title: URDF
    status: planned
    scope: peripheral
    summary: One call in Caliper LIB turns a URDF robot description into scene entities, with a link per entity and its meshes and joint transforms.
    depends_on: [REN-18]
    sprint: 5
    issue: null

  - id: REN-20
    title: Trails
    status: planned
    scope: core
    summary: A trail view shows the last N steps of an entity's positions, such as a path or a gripper, in place of only the latest.
    depends_on: [REN-11, STR-12]
    sprint: 5
    issue: null

  - id: REN-21
    title: More Shapes
    status: planned
    scope: core
    summary: Capsules, cylinders, planes and ellipsoids join the scene's boxes, each drawn from its parameters.
    depends_on: [REN-37]
    sprint: 5
    issue: null

  - id: REN-22
    title: More Colormaps
    status: planned
    scope: core
    summary: About twelve scientific colormaps from matplotlib and Crameri's tables join the built-in ones, checked by the exact colour tests.
    depends_on: [REN-14]
    sprint: 5
    issue: null

  - id: REN-23
    title: Saved Viewpoints
    status: planned
    scope: core
    summary: Saved viewpoints keep a view's camera in views, recordings and spec applets, so that a person returns to the same angle.
    depends_on: [REN-45]
    sprint: 5
    issue: null

  - id: REN-24
    title: Scale Pass
    status: planned
    scope: supporting
    summary: A scale pass measures and tunes scenes with millions of points, long recordings and many entities in Chromium, WebKit and Firefox, against the budgets and level of detail.
    depends_on: [EMB-18, STR-12]
    sprint: 5
    issue: null

  - id: REN-25
    title: Dawn Fallback
    status: planned
    scope: supporting
    summary: The WebGPU backend also serves as the native fallback through Dawn, chosen only when Metal or Vulkan is unavailable, and draws through Direct3D, OpenGL ES or SwiftShader.
    depends_on: [REN-13]
    design: design/roadmap.md#renderers
    issue: null

  - id: REN-26
    title: Slice Planes
    status: planned
    scope: core
    summary: A slice plane cuts a 3-D field along an axis and is dragged within the scene; the slice is computed on the device and drawn on a textured quad.
    depends_on: [REN-11, STR-25]
    sprint: 6
    issue: null

  - id: REN-27
    title: Isosurfaces
    status: planned
    scope: core
    summary: An isosurface is the surface where a field equals a chosen value; a marching-cubes kernel on the device sends it as a mesh that the scene draws.
    depends_on: [REN-26]
    sprint: 6
    issue: null

  - id: REN-28
    title: Volumes
    status: idea
    scope: core
    summary: Volume rendering would ray-march 3-D fields, and it is left out so far because it needs a transfer function and sampling choices on every backend.
    depends_on: [REN-26]
    design: design/roadmap.md#undecided
    issue: null

  - id: REN-29
    title: MSAA
    status: idea
    scope: supporting
    summary: Multisample anti-aliasing would smooth the edges of the scene view's drawing, and it is not yet decided.
    depends_on: [REN-09]
    design: design/roadmap.md#undecided
    issue: null

  - id: REN-30
    title: Thick Lines and Ribbons
    status: idea
    scope: core
    summary: Thick lines and ribbons would draw with a width in pixels, which WebGPU does not offer natively, and they are not yet decided.
    depends_on: [REN-11]
    design: design/roadmap.md#undecided
    issue: null

  - id: REN-31
    title: Renderer Baseline and Counters
    status: shipped
    scope: supporting
    summary: Copy counters, frame-time statistics on Metal and benchmark rows record a baseline before the renderer core's migration, so that every later step is measured against it.
    depends_on: [REN-01, REN-02]
    docs: docs/applets/rendering.md#copy-counters-and-frame-statistics
    issue: null

  - id: REN-32
    title: Points View on the Scene Core
    status: shipped
    scope: core
    summary: The points live view draws as a scene of one entity through the scene core, with its pixels checked against references from the old path, which is deleted.
    depends_on: [REN-11, REN-31]
    docs: docs/applets/scene-rendering.md#points-view
    issue: null

  - id: REN-33
    title: Texture Path on the Graphics Layer
    status: planned
    scope: core
    summary: Heatmaps, images, the tensor bridge's textures and the embed views update their textures through the graphics layer with the colormap decided by keys, and the Vulkan renderer is reduced to the window, the canvas and ImGui.
    depends_on: [REN-14, REN-31]
    sprint: 4
    branches: [sprint4-tex]
    issue: null

  - id: REN-34
    title: Scene Model Additions
    status: planned
    scope: core
    summary: The scene model gains additive points and lines, meshes drawn many times from instance poses, and a depth offset that lets edges win over the surface they lie on, natively and in a browser.
    depends_on: [REN-11, STR-10]
    sprint: 4
    issue: null

  - id: REN-35
    title: Scene Service for Applets
    status: planned
    scope: supporting
    summary: The scene service offers the scene model to applets through the ABI, with the shared camera, the up-axis switch, the scale bar and picks returned as events.
    depends_on: [REN-15, REN-34]
    sprint: 4
    issue: null

  - id: REN-36
    title: Final Renderer Seam
    status: planned
    scope: supporting
    summary: HostRenderer is reduced to the window, the frame loop, the canvas, window capture and the graphics layer, once every applet draws through the scene service.
    depends_on: [REN-16]
    sprint: 4
    issue: null

  - id: REN-37
    title: Arrows and Boxes in Scenes
    status: built
    scope: core
    summary: Scenes draw arrows and boxes, with rotations, colours or values through a colormap, class ids, labels, optional fill and a corner form in 2-D.
    depends_on: [REN-11, STR-10]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-38
    title: Images in Scenes
    status: built
    scope: core
    summary: A scene shows colour, depth and segmentation images on a camera's image plane and draws a depth image as a point cloud projected back through the camera; encoded images are not drawn yet.
    depends_on: [REN-39]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-39
    title: Pinhole Cameras in Scenes
    status: built
    scope: core
    summary: A scene holds pinhole cameras drawn as frustums, with 2-D items in each camera's pixel space, and a person can look through a camera.
    depends_on: [REN-40]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-40
    title: Entity Transforms
    status: built
    scope: core
    summary: Each entity of a scene carries a transform, as translation, rotation and scale or as a matrix, that composes down its path in 2-D and 3-D scenes.
    depends_on: [REN-11, STR-10]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-41
    title: Class Table and Labels
    status: built
    scope: core
    summary: A scene's class table gives each class id a label and a colour for points, boxes and segmentation, and items may carry labels of their own.
    depends_on: [REN-11, STR-10]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-42
    title: Index-Pair Edges
    status: built
    scope: core
    summary: Lines can be given as pairs of indices into a positions array, so that graph edges, bonds and skeletons reuse their points instead of repeating them.
    depends_on: [REN-11, STR-10]
    sprint: 4
    branches: [sprint4-draws, sprint4-integ3]
    issue: null

  - id: REN-43
    title: Up-Axis Switch
    status: built
    scope: core
    summary: Every 3-D view has a switch between Y up and Z up that changes only the camera's basis, never the data, and is remembered with the view.
    depends_on: [REN-12]
    sprint: 4
    branches: [sprint4-integ3, sprint4-pr2]
    issue: null

  - id: REN-44
    title: Scale Bar
    status: built
    scope: core
    summary: A scene view shows a scale bar in the scene's units, measured at the orbit target in 3-D and exact in 2-D.
    depends_on: [REN-12]
    sprint: 4
    branches: [sprint4-integ3, sprint4-pr2]
    issue: null

  - id: REN-45
    title: Starting Camera of a Scene
    status: shipped
    scope: core
    summary: A script sets the camera a scene view opens on with view_camera, by a target, a distance and angles or by a camera entity.
    depends_on: [REN-12, STR-10]
    docs: docs/python/scene-calls.md#scene
    issue: null

  - id: REN-46
    title: Scene Selection and Events
    status: built
    scope: core
    summary: Hover, click, rectangle and lasso work in a scene, natively and in a browser, picks and selections reach the script through caliper.serve() and the widget's selection, and a selection links to the other views.
    depends_on: [REN-15, STR-03]
    sprint: 4
    branches: [sprint4-draws]
    in_progress: true
    issue: null

  - id: REN-47
    title: Following an Entity
    status: planned
    scope: core
    summary: The camera of a scene view follows a chosen entity, such as a gripper, as it moves, while the person orbits around it.
    depends_on: [REN-12, REN-40]
    sprint: 5
    issue: null

  - id: REN-48
    title: Keypoint Skeletons
    status: planned
    scope: core
    summary: The class table of a scene holds keypoints and their connections, so that skeletons draw with names and colours.
    depends_on: [REN-41, REN-42]
    sprint: 5
    issue: null

  - id: REN-49
    title: Line Widths in World Units
    status: planned
    scope: core
    summary: Lines in a scene take a width in world units as well as in pixels.
    depends_on: [REN-12]
    sprint: 5
    issue: null

  - id: REN-50
    title: Orthographic Projection and Preset Views
    status: planned
    scope: core
    summary: A 3-D view switches between perspective and orthographic projection and takes top, front, side and three-quarter presets, for measuring shapes without perspective.
    depends_on: [REN-43]
    sprint: 5
    issue: null

  - id: REN-51
    title: Text Log View
    status: planned
    scope: core
    summary: A text log view lists logged lines with their levels, drawn natively and, in a browser, in the page itself.
    depends_on: [REN-12]
    sprint: 5
    issue: null

  - id: REN-52
    title: Bar Chart View
    status: planned
    scope: core
    summary: A bar chart view draws a labelled array of bars, natively and, in a browser, in Canvas 2D.
    depends_on: [REN-12]
    sprint: 5
    issue: null

  - id: REN-53
    title: Vulkan Backend of the Graphics Layer
    status: planned
    scope: core
    summary: The graphics layer gains a Vulkan backend with the CUDA path, so that bridge textures and scenes, which Windows refuses until then, draw on Windows through the same layer as on macOS.
    depends_on: [PLT-05, REN-10]
    issue: null

  - id: REN-54
    title: Structure from Motion Demo
    status: planned
    scope: peripheral
    summary: A demo reconstructs a scene from the frames of a short film and shows the cameras, their images and the point cloud, with the shot chosen to suit it.
    depends_on: [REN-38, STR-13]
    sprint: 5
    issue: null

  - id: REN-55
    title: Robot Arm Demo
    status: planned
    scope: peripheral
    summary: A demo loads a robot arm from its URDF and shows it following a target, with the gripper followed and trailed.
    depends_on: [REN-19, REN-20, REN-47]
    sprint: 5
    issue: null

  - id: REN-56
    title: Detection Boxes Demo
    status: planned
    scope: peripheral
    summary: A demo shows a detection model's boxes, classes and scores over the images they were found in.
    depends_on: [REN-37, REN-38, REN-51]
    sprint: 5
    issue: null

  - id: REN-57
    title: Flow Field Demo
    status: planned
    scope: peripheral
    summary: A demo shows where a neural surrogate's error concentrates inside a 3-D flow, with slice planes and isosurfaces.
    depends_on: [REN-27]
    sprint: 6
    issue: null

  - id: REN-58
    title: Culling Flag
    status: idea
    scope: supporting
    summary: Geometry draws could take a flag that turns face culling on or off.
    depends_on: [REN-11]
    issue: null

  - id: REN-59
    title: Exportable Vulkan Image Pool
    status: idea
    scope: supporting
    summary: The Vulkan renderer could keep a pool of exportable images for zero-copy sharing.
    depends_on: [REN-02]
    issue: null

  - id: REN-60
    title: Device-Backed Shared Allocation on Metal
    status: idea
    scope: supporting
    summary: The alloc_shared call could be backed by device memory on Metal.
    depends_on: [REN-01]
    issue: null

  - id: REN-61
    title: Camera Paths and Fly Mode
    status: idea
    scope: core
    summary: A scene view could play its camera along a recorded path and offer a fly mode for moving through a scene.
    depends_on: [REN-12]
    issue: null

  - id: REN-62
    title: Gizmos and Scene Editing
    status: idea
    scope: core
    summary: Gizmos could let a person move and edit the entities of a scene in its view.
    depends_on: [REN-12]
    issue: null

  - id: REN-63
    title: Lights and Materials
    status: idea
    scope: core
    summary: Scenes could carry lights and materials beyond the fixed shading they have today.
    depends_on: [REN-11]
    issue: null

  - id: REN-64
    title: Tensor Bridge Service
    status: shipped
    scope: peripheral
    summary: caliper.tensor_bridge.v1 to v1_2 turn a CaliperTensor into a live texture in the same frame, with a handoff ordered on the stream and imported device allocations.
    depends_on: [COR-49, REN-08]
    docs: docs/applets/services/caliper-tensor-bridge-v1.md
    issue: null

  - id: REN-65
    title: Export Service
    status: built
    scope: peripheral
    summary: Removed in ABI epoch 3. caliper.export.v1 drew a geometry draw list offscreen into a PNG with a JSON provenance sidecar.
    depends_on: [REN-05]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-66
    title: Torch Adapter
    status: shipped
    scope: core
    summary: torch.hpp turns a torch tensor into a CaliperTensor, refuses a tensor it cannot share rather than copying it, and applies the rules of MPS and CUDA.
    depends_on: [COR-49, REN-08]
    docs: docs/applets/adapters.md#torchhpp
    issue: null

  - id: REN-67
    title: Exportable Pool
    status: shipped
    scope: core
    summary: ExportablePool allocates the tensors that the renderer draws in place, and an allocation registry tracks the allocations the host can import.
    depends_on: [REN-08]
    docs: docs/applets/adapters.md#exportable_poolhpp
    issue: null

  - id: REN-68
    title: OBJ Loader and Orbit Camera
    status: shipped
    scope: supporting
    summary: Two adapters give an applet an OBJ mesh loader and an orbit camera with picking under the cursor.
    depends_on: [COR-04]
    docs: docs/applets/adapters.md#objhpp
    issue: null

  - id: REN-69
    title: WebGPU Renderer for Browser Views
    status: shipped
    scope: core
    summary: The WebGPU renderer draws the browser views of the WebAssembly module, with a colormap pass whose thresholds come from the CPU reference and instanced quads for points.
    depends_on: [EMB-04]
    docs: docs/applets/rendering.md#webgpu-backend
    issue: null

  - id: REN-70
    title: FieldScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Simulated charged particles in electromagnetic fields on a GPU.
    depends_on: [REN-04]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-71
    title: FlowScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Drove a flow field of one million particles on a GPU.
    depends_on: [REN-04]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-72
    title: InstanceScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Drew a field of procedural gems with one instanced draw call.
    depends_on: [REN-07]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-73
    title: MeshScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Trained a small network on a 2-D surface drawn as lit triangles with a wireframe.
    depends_on: [REN-65]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-74
    title: SculptScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Trained a small network mapping latent codes to a 3-D point cloud.
    depends_on: [REN-04]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-75
    title: TwinScope
    status: built
    scope: peripheral
    summary: Deleted demo applet (removed in epoch 3). Ran a synthetic heat twin of a textured housing.
    depends_on: [REN-06, REN-65]
    branches: [playground-m6]
    issue: null
    docs: docs/development/compatibility-and-epochs.md#host-abi-epoch-and-service-revisions

  - id: REN-76
    title: Program Sandbox
    status: shipped
    scope: core
    summary: The sandbox checks each program in the editor, the script and the viewer, keeps model tensors read-only, translates the WGSL with a bounds check on every access, and stops a program at its time limit and memory budget.
    depends_on: [SPC-14]
    docs: docs/agents/gpu-programs.md#sandbox-rules
    issue: null

  - id: REN-77
    title: Programmable Graphics
    status: shipped
    scope: core
    summary: An agent writes the graphics of an instrument as pieces with its own buffers, textures, state between frames and WGSL passes, which read live tensors without a copy, draw into a scene panel with the camera given, keep picking and run inside the sandbox.
    depends_on: [REN-76, SPC-50]
    docs: docs/agents/pieces.md
    issue: null

