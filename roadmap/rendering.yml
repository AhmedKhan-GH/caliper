    status: shipped
    scope: core
    summary: The derive half runs compute passes in the training script at the shared cadence, over live tensors that it reads without a copy, and publishes named typed resources that keep their contents from one run to the next.
    depends_on: [REN-77, STR-54]
    docs: docs/agents/pieces.md#derive-half
    issue: null

