- heading: Builder overview
  item: 'The map of the builder: drop data, make loaders, build visuals by hand, with the side chat, the
    widget agent or an outside agent; everything built is data.'
  ids:
  - SPC-07
  - AGT-03
  - AGT-05
  - AGT-02
- heading: The parts
  item: 'Parts diagram and table: spec format, loaders, catalog, command layer, session, caliper-mcp,
    side chat, widget agent, caliper-agent.'
  ids:
  - SPC-01
  - SPC-03
  - SPC-04
  - SPC-05
  - SPC-06
  - AGT-02
  - AGT-03
  - AGT-05
- heading: The parts
  item: The side chat and widget agent are two roles over one AcpClient, and Ask in chat hands a widget
    request to the side chat.
  ids:
  - AGT-03
  - AGT-05
- heading: What is built
  item: The libraries and tools under src/builder/ build with the host when CALIPER_WITH_BUILDER is on,
    default off on Windows.
  ids:
  - SPC-06
  - PLT-13
- heading: What is built
  item: Spec library parses, validates, writes and merge-patches specs.
  ids:
  - SPC-01
  - SPC-02
- heading: What is built
  item: Loaders read CSV, TSV, Parquet, JSON, JSONL, npy, npz, safetensors, PNG, JPEG, WAV; refuse pickle;
    run a Python loader out of process.
  ids:
  - SPC-03
- heading: What is built
  item: Command layer with registry, validator, undo groups, journal replay, approvals, queue and 40 commands.
  ids:
  - SPC-05
- heading: What is built
  item: Session binds every command that needs no window; a headless test builds a three-panel dashboard.
  ids:
  - SPC-06
- heading: What is built
  item: 'Review of spec edits for every agent: with review on, agent and mcp edits wait for approval with
    a diff and warnings.'
  ids:
  - AGT-06
  - SPC-05
- heading: What is built
  item: Stacked previews, applied to a copy of the spec and committed as one undo step.
  ids:
  - AGT-05
  - SPC-05
- heading: What is built
  item: AcpClient::new_session() takes an optional _meta for widget sessions.
  ids:
  - AGT-05
- heading: What is built
  item: caliper-mcp against Caliper API v0 and the command endpoints.
  ids:
  - AGT-02
  - AGT-01
- heading: What is built
  item: The loader knows the spec-based instrument kind.
  ids:
  - SPC-08
- heading: What is built
  item: The API server serves the command endpoints through a CommandGateway with approvals held.
  ids:
  - AGT-01
  - SPC-05
- heading: What is built
  item: The app, caliper dev and caliper shot own a session for their workspace.
  ids:
  - SPC-06
- heading: What is built
  item: The session reads sources through registered data sources and catalog providers; the app does
    not call the providers yet.
  ids:
  - SPC-04
- heading: What is built
  item: The ACP client drives a session against a stub agent; caliper-acp-harness runs one headless.
  ids:
  - AGT-03
- heading: What is built
  item: 'The spec runtime first slice: seven primitives, layout rectangles with text-scale minimums, a
    colour key, an offscreen canvas and caliper-spec-shot.'
  ids:
  - SPC-08
  - SPC-17
- heading: What is built
  item: caliper-agent runs on Pydantic AI with Claude native and other models over an OpenAI-compatible
    API, and widget sessions with a tool scope, budget and handoff.
  ids:
  - AGT-05
- heading: What is built
  item: 'The widget agent''s inline surface: Cmd-K on the spec page, preview in place, accept as one undo
