# yaml-language-server: $schema=schema.json
title: Programmable Graphics plan page
kind: page
source: design/programmable-graphics.md
summary: The plan page design/programmable-graphics.md, read heading by heading; each plan heading has an entry
  or is listed as holding no feature.
not_features:
- Status
- Work Items
- Decisions
- Left Out
- Open Points
entries:
- heading: Pieces
  item: A piece is a reusable module of graphics with a derive half in the script and a draw half in the viewer.
  ids:
  - SPC-14
- heading: Piece Files
  item: A piece is a folder of piece.toml and up to three WGSL files, inside the workspace's pieces folder.
  ids:
  - SPC-14
- heading: Piece Manifest
  item: The manifest names the piece, its version, inputs, params, resources, imports, dependencies, halves, sample and hash.
  ids:
  - SPC-14
- heading: Input and Parameter Keys
  item: Inputs bind tensors or other programs' buffers, and params become controls.
  ids:
  - SPC-14
- heading: Resource Keys
  item: A resource is a buffer of a layout or an rgba8unorm texture with a count, a publish flag and a kept depth.
  ids:
  - SPC-14
- heading: Derive Keys
  item: The derive half runs several compute passes in order in one submit at a pass of the shared cadence.
  ids:
  - SPC-14
- heading: Draw Keys
  item: The draw half has a camera, draw buffers, offscreen targets, passes, an item map, text and limits.
  ids:
  - SPC-14
- heading: Pass Keys
  item: A pass is compute or render, with entries, instances, vertices, topology, blend, depth and pick.
  ids:
  - SPC-14
- heading: Lib Modules
  item: Versioned WGSL modules of helpers that pieces import by name.
  ids:
  - SPC-14
- heading: Imports
  item: Imports resolve before the compiler with a rewrite that keeps every line and column.
  ids:
  - SPC-14
- heading: Piece Hash
  item: The hash covers the canonical manifest and the resolved WGSL, the same on every platform.
  ids:
  - SPC-14
  - SPC-23
- heading: Piece Sources
  item: Library, workspace and inline pieces share one format.
  ids:
  - SPC-14
- heading: Versions and Pins
  item: A program pins a piece by name, version and hash, and a missing or changed piece refuses the program.
  ids:
  - SPC-14
- heading: Program Instances
  item: A program of a spec is an instance of a piece with bindings, params and a panel.
  ids:
  - SPC-14
- heading: Piece Graph
  item: A buffer input that binds another program's resource makes the programs a graph.
  ids:
  - SPC-14
  - SPC-10
- heading: Field Example
  item: A worked fragment-only piece over a live tensor.
  reason: docs
- heading: Arc Example
  item: A worked piece with compute into a buffer and an instanced draw with a glow.
  reason: docs
- heading: Resources
  item: Named, typed resources replace the output shapes of one-pass programs.
  ids:
  - SPC-14
- heading: Resource Kinds
  item: Buffers and packed textures, with counted buffers.
  ids:
  - SPC-14
- heading: Allocation and Lifetime
  item: The script and the viewer allocate resources inside their budgets and keep them until removal.
  ids:
  - SPC-14
- heading: Resource Message
  item: RESOURCE carries one version of one resource, and PROGRAM carries a piece's instance and its draw half.
  ids:
  - SPC-14
- heading: Kept Versions
  item: The step history keeps resource versions thinned evenly over the run.
  ids:
  - SPC-14
- heading: Reopened Instrument
  item: A reopened instrument derives its resources again from the attached run.
  ids:
  - SPC-14
- heading: Prelude
  item: One fixed WGSL prelude of group 0 for every draw pass in the app and the browser.
  ids:
  - SPC-14
- heading: Prelude Text
  item: The prelude file that the app and the browser module embed.
  ids:
  - SPC-14
- heading: Generated Header
  item: The composer writes every binding of both halves from the manifest.
  ids:
  - SPC-14
- heading: Params
  item: Params come from the manifest and follow controls, selections and state.
  ids:
  - SPC-14
- heading: Linked Selection
  item: The host gives every draw half the selection as a buffer.
  ids:
  - SPC-14
- heading: Render Graph
  item: The declared passes of a draw half, which the host orders and allocates.
  ids:
  - SPC-14
- heading: Pass Order
  item: Passes run in order after the scene's draws, with full-screen triangles by default.
  ids:
  - SPC-14
- heading: Targets
  item: The host target and rgba8unorm offscreen targets, never read by the pass that writes them.
  ids:
  - SPC-14
- heading: Pass Values
  item: The allowed topology, blend and depth values and their defaults.
  ids:
  - SPC-14
- heading: Graph Cuts
  item: What the render graph leaves out.
  reason: docs
- heading: Draw State
  item: Draw buffers keep state between frames and reset by declared rules.
  ids:
  - SPC-14
- heading: Sandbox
  item: The sandbox checks each piece in the editor, the script and the viewer.
  ids:
  - SPC-14
  - SPC-21
- heading: Check Order
  item: The checks of both halves, in order, before anything runs.
  ids:
  - SPC-14
- heading: Check Codes
  item: The codes of the piece and program checks.
  ids:
  - SPC-14
- heading: Browser Checks
  item: The browser runs the checks without the compiler, verifies the hash and lets WebGPU validate.
  ids:
  - SPC-14
- heading: Safety of Draws
  item: A draw over its budget is removed and reported by name.
  ids:
  - SPC-14
- heading: Picking
  item: A pick pass writes the ID in every frame, and the item map gives the pick event's fields.
  ids:
  - SPC-14
- heading: Text
  item: Pieces publish label anchors and strings, and the host places and draws them.
  ids:
  - SPC-14
- heading: Camera
  item: The host owns the camera, and a piece selects orbit, pan-zoom or none.
  ids:
  - SPC-14
- heading: Commands
  item: The piece commands and the program commands as MCP tools.
  ids:
  - SPC-05
  - AGT-02
- heading: Piece Commands
  item: Seven commands list, show, check, save, copy, update and remove pieces.
  ids:
  - SPC-05
  - AGT-02
- heading: Program Commands
  item: program.create and program.patch take instances, and program.read reads resources.
  ids:
  - SPC-05
  - AGT-02
- heading: Stage Commands
  item: Stages stay unchanged until Graphics Consolidation removes them.
  ids:
  - SPC-14
- heading: Status and Events
  item: Program status and events gain the draw half, the pass and the pick fields.
  ids:
  - SPC-14
  - SPC-05
- heading: Library Pieces
  item: The built-in library holds the lib modules and points@1, which matches the built-in draw.
  ids:
  - SPC-14
- heading: Pixel Comparison
  item: A test compares the app's frame with the browser module's frame.
  reason: test
- heading: Attention Arc Tower
  item: The demo that an agent builds through caliper-mcp alone.
  reason: test
- heading: Training Script
  item: A small transformer whose induction heads form at a loss bump.
  reason: test
- heading: Agent Steps
  item: The steps of the agent and the person in the demo.
  reason: test
- heading: Demo Gaps
  item: The gaps of the demo and the work that closes each.
  reason: test
- heading: Run Budget
  item: The derive halves keep to the shared cadence's budget.
  reason: test
- heading: Second Graphic
  item: A fragment-only field on the same contract.
  reason: test
- heading: Acceptance Test
  item: A test through caliper-mcp builds the tower on a managed run.
  reason: test
