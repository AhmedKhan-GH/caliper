- heading: Platform candidates
  item: Phase 2 settles the split into native computation and WebAssembly interface; drawing pieces belong
    to the interface, computing pieces stay native.
  ids:
  - SPC-21
  - EMB-11
- heading: Candidates
  item: 'Python sidecar over pipes: starts a Python process with a version handshake, a cache version
    and a synthetic-data mode; a sidecar service.'
  ids:
  - SPC-19
- heading: Candidates
  item: 'Layout grid: panes as shares of the window with minimums tied to the text scale, as plain rectangles.'
  ids:
  - SPC-17
- heading: Candidates
  item: 'Tour overlay: steps through regions from a data file; a host tour service where instruments register
    regions and ship a tour file.'
  ids:
  - SPC-18
- heading: Candidates
  item: '3-D annotation scene: arrows, rings, labels, layers and legends on geometry records, in caliper::viz.'
  ids:
  - SPC-20
- heading: Candidates
  item: 'Colour by value: colours points by a chosen value with a scale and key, in caliper::viz.'
  ids:
  - SPC-20
- heading: Candidates
  item: 'Catalog tree: a taxonomy tree with values inline that opens to the selected item, in caliper::viz.'
  ids:
  - SPC-20
- heading: Candidates
  item: 'Scripted runs and capture: screenshots, a timed demo timeline and screen recording driven by
    environment variables; a host automation and capture service.'
