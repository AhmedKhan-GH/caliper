  - AGT-03
- heading: One client for both roles
  item: One AcpClient drives both the person's own agent in the side chat and the widget agent's sidecar,
    with the key only in the environment.
  ids:
  - AGT-03
  - AGT-05
- heading: Processes and threads
  item: AcpClient runs one agent in its own process group with reader, writer and stderr threads, and
    chat events reach the UI through the client's queue.
  ids:
  - AGT-03
- heading: Turns, permission prompts and spec diffs
  item: 'Two kinds of approval show a change the same way: the agent''s own permission requests as cards
    in the chat, and command approvals from the command layer.'
  ids:
  - AGT-03
  - AGT-06
- heading: Turns, permission prompts and spec diffs
  item: A spec change is shown as a diff of the canonical TOML before it is applied; commands are preferred
    to file edits.
  ids:
  - AGT-03
- heading: Approvals and diffs for every agent
  item: Approval of destructive commands from the agent, mcp and api origins, held for up to 120 seconds,
    with no self-approval.
  ids:
  - AGT-06
  - SPC-05
- heading: Approvals and diffs for every agent
  item: 'The origin comes from the token: api.json holds the mcp token and each agent session gets its
    own agent token, with stream access limited to watching.'
  ids:
  - AGT-01
  - AGT-02
- heading: Approvals and diffs for every agent
  item: Agent permissions Ask, Accept edits, Read only and, for the chat's session only, Allow all, with
    card answers that allow a command for the session or always.
  ids:
  - AGT-06
- heading: Approvals and diffs for every agent
  item: Diff previews and review of spec edits in the command layer, with conflict handling, on by default
    for agent and mcp.
  ids:
  - SPC-05
  - AGT-06
- heading: Approvals and diffs for every agent
  item: 'One card for one change: caliper-agent reads review.status once per turn and asks through ACP
    only for what Caliper does not review itself.'
  ids:
  - AGT-03
  - AGT-05
- heading: Approvals and diffs for every agent
  item: The approval cards strip at the window's bottom edge on every page, showing origin, command, compact
    diff, loss, time left, Approve and Deny, and a REVIEW mark on the panel.
  ids:
  - AGT-17
- heading: Approvals and diffs for every agent
  item: The test decisions file CALIPER_TEST_APPROVALS in a hidden app, and no Approve all for a turn.
  ids:
  - AGT-17
- heading: Approvals and diffs for every agent
  item: 'What remains: the side chat''s own cards for the permission requests of an agent''s tools, beside
    the strip, and the review setting per origin in its settings.'
  ids:
  - AGT-23
- heading: Cancellation
  item: Cancel sends session/cancel, withdraws open permission cards, and offers Restart after 10 seconds
    without an end.
  ids:
  - AGT-03
- heading: Crashes and hangs
  item: 'Crash and hang handling: exit status, STALLED after two minutes of silence, a FAULTS chip for
    bad messages, bounded limits and ordered shutdown.'
  ids:
  - AGT-03
- heading: The working folder and the declined capabilities
  item: The agent starts in the workspace folder, and Caliper declines the file system, terminal, auth
    and elicitation capabilities.
  ids:
  - AGT-03
- heading: Configuring an agent
  item: Four detected agents by their own commands on PATH and a custom agent by command line, kept in
    the app's settings and never in a workspace.
  ids:
  - AGT-03
- heading: Configuring an agent
  item: 'Planned: read the agent registry at runtime instead of the fixed presets.'
  ids:
  - AGT-26
- heading: Local models in the side chat
  item: The side chat runs any ACP agent on any model, local models included, with no Caliper code; opencode
    on Ollama is the worked example, with a Local model mark per agent.
  ids:
  - AGT-04
- heading: Local models in the side chat
  item: A measured run of caliper-agent in its general role on the Ollama preset in the hidden app, 7
    model requests in about 80 seconds.
  ids:
  - AGT-04
  - AGT-05
- heading: Local models in the side chat
  item: 'Not verified: whether opencode passes a stdio MCP server''s env as Caliper sends it, whether
    a small local model uses 35 tools well, and the whole path on Windows.'
