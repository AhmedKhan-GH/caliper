entries:
- heading: Instrument builder
  item: 'Earlier proposal: an agent builds instruments as data, a declarative panel spec drawn by one host
    runtime, edited through a command layer; library instruments remain for panels that outgrow the spec.'
  ids:
  - SPC-01
  - SPC-05
  - SPC-08
- heading: What already exists
  item: 'Table of existing pieces: service registry, data.v1 SQL, feed.v1, metrics.v1, live views, guarded
    loader, frame watchdog.'
  ids:
  - COR-03
  - STR-01
- heading: What stands in the way
  item: Instruments are compiled C++ and never unload; in-process code is trusted code; no command layer,
    catalog, capture; layout only by role.
  ids:
  - SPC-05
  - SPC-04
  - SPC-16
- heading: Three ways an agent could build an instrument
  item: Declarative spec first, embedded script (Lua or WASM) for custom logic, generated native instrument
    as an eject to C++ step.
  ids:
  - SPC-01
  - SPC-21
- heading: Three ways an agent could build an instrument
  item: Embedded script runtime (Lua, WASM or a Python sidecar) for custom logic.
  ids:
  - SPC-21
  - SPC-19
  - SPC-26
- heading: Three ways an agent could build an instrument
  item: 'Eject to C++: a panel that needs raw performance becomes a native instrument built outside the app.'
  ids:
  - SPC-27
- heading: Three ways an agent could build an instrument
  item: 'Tabular transforms use DuckDB SQL; tensors get a small fixed set of GPU operations: slice, reduce
    and normalise.'
  ids:
  - SPC-01
  - STR-08
- heading: Proposed design
  item: 'Architecture diagram: builder pane, agent loop, command layer, MCP, spec files, spec runtime
    and data services.'
  ids:
  - SPC-05
  - SPC-07
  - AGT-02
- heading: Proposed design
  item: The command layer, the spec, the spec runtime, the saved instrument as manifest plus spec, and the
    browser.
  ids:
  - SPC-05
  - SPC-01
  - SPC-08
  - EMB-06
- heading: Proposed design
  item: An illustrative TOML spec for an attention-entropy dashboard.
  ids:
  - SPC-01
- heading: What would need to change
  item: 1. A command layer in the host.
  ids:
  - SPC-05
- heading: What would need to change
  item: 2. A catalog service.
  ids:
  - SPC-04
- heading: What would need to change
  item: '3. A primitive library: drawing moves into caliper::viz with declared input slots.'
  ids:
  - SPC-20
  - SPC-01
- heading: What would need to change
  item: 4. A data-driven dock layout so that panels can be placed by command.
  ids:
  - SPC-07
- heading: What would need to change
  item: 5. A capture service that renders a panel offscreen to an image.
  ids:
  - SPC-16
- heading: What would need to change
  item: '6. The agent: command layer over MCP first, then ACP, then a built-in agent only if needed.'
  ids:
  - AGT-02
  - AGT-03
  - AGT-05
- heading: What would need to change
  item: '7. A second instrument kind in the loader: a manifest that points to a spec.'
  ids:
  - SPC-08
- heading: What would need to change
  item: '8. Limits: read-only SQL with row and time limits, the frame watchdog, scripts sandboxed, native
    generation outside the process.'
  ids:
  - SPC-05
- heading: How a session would feel
  item: 'Five-step walk-through: ask, catalog search, spec and preview, adjust, save as an instrument.'
  ids:
  - SPC-07
  - AGT-03
- heading: A first slice
  item: Command layer and catalog, a spec runtime with four primitives (series, heatmap, scatter, table),
    bindings to data.v1 and live views, the capture service, all over MCP.
  ids:
  - SPC-05
  - SPC-04
  - SPC-01
  - AGT-02
  - SPC-16
- heading: Agent integration
  item: MCP, ACP and BYOK answer three questions; the builder needs MCP in every case.
  ids:
  - AGT-02
  - AGT-03
  - AGT-05
- heading: The options
  item: 'Comparison table: MCP only, ACP client in Caliper, built-in agent (BYOK).'
  ids:
  - AGT-02
  - AGT-03
  - AGT-05
- heading: How the ACP client would work
  item: Caliper spawns the chosen agent, calls initialize and session/new with caliper mcp --connect <port>;
    the pane shows messages, tool calls and permission requests; the agent keeps its own login.
  ids:
  - AGT-03
  - AGT-06
- heading: Caveats
  item: Adapter maturity varies, MCP passing in session/new is uneven, the protocol is changing (v2),
    agents expect file and terminal access, MCP over ACP may remove the bridge.
  ids:
  - AGT-03
- heading: Order
  item: 'Order: MCP first, ACP second as the main in-app path, a built-in BYOK agent only if needed.'
  ids:
  - AGT-02
  - AGT-03
  - AGT-05
- heading: Safety in every option
  item: Control port on localhost with a session token, read-only SQL, approvals for deleting or overwriting
    commands.
  ids:
  - AGT-06
  - AGT-01
- heading: Open decisions
  item: 'Which agents to support first through ACP: decided, Claude Code, Codex, Gemini CLI and opencode
    detected.'
  ids:
  - AGT-03
- heading: Open decisions
  item: 'Sharing: whether spec-based instruments are shared and installed like compiled ones, through which
    registry.'
  ids:
  - COR-18
- heading: Open decisions
  item: 'The first primitives: which visuals and controls the spec supports first.'
  ids:
  - SPC-01
  - SPC-12
- heading: Open decisions
  item: 'Scripting: Lua, WASM or a Python sidecar, or wait until specs prove limited.'
