- heading: Decisions
  item: 'Windows and Vulkan wait for the Windows machine: from step 8, Windows draws ImGui pages and refuses
    bridge textures, geometry views, applet scenes, exports and embedding views with a reason until the
    Vulkan backend lands with Windows parity.'
