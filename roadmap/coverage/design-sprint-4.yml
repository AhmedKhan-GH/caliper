  - PLT-11
  - PLT-02
- heading: Decisions
  item: Increments in order, the whole minimum cut first, then the loss landscape, then every remaining
    migration step; the subset of increment 1 is what demo 0 draws; the network route only in increment
    1; the box and floor grid as ordinary line draws; step 6 in two halves.
  ids:
  - REN-14
- heading: Decisions
  item: The graphics change with no backwards compatibility, a scene service for applets replacing the
    geometry service, and the trim of the sprint, each decided by the user.
  ids:
  - REN-16
  - REN-35
  - COR-25
- heading: Decisions
  item: 'Wire and demo decisions: strip break masks built by the viewer from strip_lengths, the key static
    travelling with scenes alone, the path''s principal-component plane as demo 0''s default, demo 0''s
    defaults and cost budget, MCAP and recording only when started.'
  ids:
  - STR-09
  - STR-12
- heading: Risks
  item: 'Risks: the cost of the landscape''s surface, its changing plane, a slower fast path with no switch
    back, Windows and GPU-less machines, applets outside the repository, applet pictures that change,
    ids under review and one browser, MCAP with no size margin, scope of 162 days.'
  ids:
  - REN-17
