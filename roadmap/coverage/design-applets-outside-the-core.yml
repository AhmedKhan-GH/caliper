entries:
- heading: Applets outside the core
  item: The host ships with no applets and names none; applets are built, stored and installed outside
    the core repository; this page holds the unbuilt parts.
  ids:
  - COR-01
  - COR-16
- heading: Moving the applets out
  item: First-party applets move to one caliper-applets repository, extracted with git filter-repo to
    keep history.
  ids:
  - COR-16
- heading: Moving the applets out
  item: CALIPER_BUILD_APPLETS goes away.
  ids:
  - COR-16
- heading: Moving the applets out
  item: examples/hello and examples/sine_scope stay because tutorials embed them and tests load them.
  reason: superseded
- heading: Shipping the SDK
  item: The SDK ships as a release asset beside the app; a separate SDK repository can wait until outside
    contributors exist.
  ids:
  - COR-29
- heading: Hot reload
  item: caliper dev does not reload a rebuilt applet; reloading is proposed for later.
  ids:
  - COR-20
  - COR-09
- heading: Installing from a URL
  item: caliper install <url> would download a .caliperapp bundle, check its sha256, place it and handle
    the quarantine flag.
  ids:
  - COR-19
  - COR-28
- heading: Installing from a URL
  item: A Browse tab reading the registry comes later.
  ids:
  - COR-18
- heading: Where applets are stored
  item: 'Table of storage places: source, releases as <id>-<version>-<platform>.caliperapp.zip, shipped
    PlugIns, user folder, applet data, caches, shared runtimes, development folders.'
  ids:
  - COR-16
  - COR-17
  - COR-19
- heading: Where applets are stored
  item: Shipped applets move from Contents/MacOS/applets to Contents/PlugIns/ and the bundle is never
    written after it ships.
  ids:
  - COR-17
- heading: Where applets are stored
  item: Shared runtimes folder if runtime packs are adopted.
  ids:
  - COR-33
- heading: Signing on macOS
  item: 'Two options for third-party applets under a notarized host: the disable-library-validation entitlement
    or same-team signing only; quarantine flag handling; decide before the first third-party applet.'
  ids:
  - COR-23
  - COR-24
- heading: The empty-state check
  item: CI starts the host headless with an empty applets folder and checks that the launcher shows its
    empty state.
  ids:
  - COR-01
