# yaml-language-server: $schema=schema.json
prefix: SPC
title: Builder and Specs
order: 4
summary: This pillar covers building dashboards from data inside the app, with specs, loaders, a catalog of sources, a command layer and a builder pane. It also covers the later work on custom views and on promoting proven instrument features into the core.
features:
  - id: SPC-01
    title: Spec Format
    status: shipped
    scope: core
    summary: The spec format describes a dashboard as text, with sources, panels built from seven primitives, bindings and a layout, in a TOML form and a canonical JSON form.
    depends_on: []
    docs: docs/instruments/manifest.md#spec-based-instruments
    design: design/spec-format.md
    issue: null

  - id: SPC-02
    title: Spec Validator
    status: shipped
    scope: core
    summary: The spec validator checks a spec against the format and reports each error and warning with a stable code, a line and a column.
    depends_on: [SPC-01]
    docs: docs/reference/instrument-commands.md#caliper-check
    design: design/spec-format.md#validation
    issue: null

  - id: SPC-03
    title: Loaders
    status: shipped
    scope: core
    summary: Loaders turn dropped files into sources, reading CSV, Parquet, JSON, NumPy, safetensors, image and WAV files, refusing pickle, Arrow IPC and HDF5 files, and running a Python loader in its own process for other formats.
    depends_on: []
    docs: docs/builder/builder-pane.md#sources
    design: design/loaders.md
    issue: null

  - id: SPC-04
    title: Catalog
    status: shipped
    scope: core
    summary: The catalog lists every source a spec can use, from loader outputs, live views, feed channels and metrics, and describes and samples each one.
    depends_on: [RUN-01, SPC-03, STR-05]
    docs: docs/builder/builder-pane.md#sources
    design: design/catalog.md
    issue: null

  - id: SPC-05
    title: Command Layer
    status: shipped
    scope: core
    summary: The command layer is a table of typed commands with undo, a journal, approvals and previews, served to programs through Caliper API.
    depends_on: []
    docs: docs/agents/http-api.md#get-v0commands
    design: design/command-layer.md
    issue: null

  - id: SPC-06
    title: Builder Sessions
    status: shipped
    scope: core
    summary: A builder session binds the spec, loaders, catalog and commands for one workspace folder, which the app, caliper dev and caliper shot each hold.
    depends_on: [SPC-01, SPC-04, SPC-05]
    docs: docs/reference/cli.md#workspace
    design: design/builder-session.md
    issue: null

  - id: SPC-07
    title: Builder Pane
    status: shipped
    scope: core
    summary: The builder pane lets a person build a spec by hand on the app's spec page, with source and primitive palettes, a canvas, properties and the spec text.
    depends_on: [SPC-06, SPC-08]
    docs: docs/builder/builder-pane.md
    design: design/builder-pane.md
    issue: null

  - id: SPC-08
    title: Spec-Based Instruments
    status: shipped
    scope: core
    summary: A spec-based instrument is a folder with a manifest and a spec and no library, which the loader lists, validates and the app draws as a page without running instrument code.
    depends_on: [COR-05, SPC-02]
    docs: docs/instruments/manifest.md#spec-based-instruments
    design: design/spec-format.md#the-manifest-of-a-spec-based-instrument
    issue: null

  - id: SPC-09
    title: Removing Panels
    status: shipped
    scope: core
    summary: A panel is removed from a dashboard with the cross on its title strip, a menu entry or the delete key, as one undoable step.
    depends_on: [SPC-07]
    docs: docs/builder/builder-pane.md#canvas
    design: design/builder-pane.md#gestures-and-commands
    issue: null

  - id: SPC-10
    title: Data View
    status: planned
    scope: core
    summary: The Data view is a node graph in build mode of sources, derived sources with their transforms and each panel's slots, where dragging binds a source to a slot as a command.
    depends_on: [SPC-07]
    sprint: "3.2"
    design: design/builder-overview.md#next
    issue: null

  - id: SPC-11
    title: Spec Version 1 with Scenes
    status: shipped
    scope: core
    summary: Spec version 1 adds the scene panel, which draws the entities of a scene that Caliper builds from live tensors, with a camera and picking, and the top-level arrays and keys that an instrument needs.
    depends_on: [REN-12, SPC-05]
    docs: docs/builder/spec-format.md#scene-panel
    issue: null

  - id: SPC-12
    title: Custom Controls
    status: shipped
    scope: core
    summary: Spec version 1 declares nine control kinds, among them slider, range, toggle, button, picker, text, segmented groups and a transport, bound without native code to script parameters and actions, state variables, intervention points and values.
    depends_on: [SPC-11]
    docs: docs/builder/controls.md#control-kinds
    issue: null

  - id: SPC-13
    title: Reshape Step
    status: planned
    scope: core
    summary: The reshape step adds a tensor transform for reshaping and stacking, to be built only if real use needs it, since a stream carries at most three dimensions per heatmap view.
    depends_on: [SPC-10, SPC-28]
    sprint: 5
    design: design/spec-format.md#tensor-transforms
    issue: null

  - id: SPC-14
    title: Custom WGSL Views
    status: shipped
    scope: core
    summary: A spec carries WGSL programs over live tensors, with sandbox checks and limits on GPU time and memory.
    depends_on: [SPC-11]
    design: design/roadmap.md#open-questions
    docs: docs/agents/gpu-programs.md#programs
    issue: null

  - id: SPC-15
    title: Custom WebAssembly Views
    status: planned
    scope: core
    summary: A spec carries a WebAssembly module with a fixed host interface that reads its bound sources, draws into a scene or a 2-D canvas and emits selections, without files or the network and under memory and time limits, in the app and in a browser.
    depends_on: [COR-24, SPC-12, SPC-21]
    sprint: 7
    design: design/streaming-and-embedding.md#instruments-in-the-browser
    issue: null

  - id: SPC-16
    title: Capture Service
    status: planned
    scope: supporting
    summary: The capture service gives every instrument screenshots, scripted runs and recordings through one host interface, starting from what caliper shot already does.
    depends_on: [COR-08]
    design: design/platform-candidates.md#findings-about-existing-services
    issue: null

  - id: SPC-17
    title: Layout Grid
    status: planned
    scope: core
    summary: The layout grid sizes panes as shares of the window with minimums tied to the text scale, as plain rectangles that tests check without a window.
    depends_on: []
    design: design/platform-candidates.md#candidates
    issue: null

  - id: SPC-18
    title: Tours
    status: planned
    scope: peripheral
    summary: A host tour service steps through the regions of an instrument from a data file, outlining each region as it goes.
    depends_on: []
    design: design/platform-candidates.md#candidates
    issue: null

  - id: SPC-19
    title: Python Sidecar
    status: planned
    scope: core
    summary: A sidecar service starts a Python process beside an instrument, with a version handshake, a cache version that triggers a rebuild and a synthetic-data mode.
    depends_on: []
    design: design/platform-candidates.md#candidates
    issue: null

  - id: SPC-20
    title: Viz Components
    status: planned
    scope: supporting
    summary: The caliper viz components add an annotation scene for geometry, colour by value with a key, and a catalog tree, promoted from instrument code into the SDK.
    depends_on: []
    design: design/platform-candidates.md#candidates
    issue: null

  - id: SPC-21
    title: WebAssembly and Third-Party Instruments
    status: decision
    scope: core
    summary: This decision sets how sprint 7's sandboxed custom views relate to the roadmap's Not now list, which names WebAssembly and third-party instruments, and to Phase 2's split of instruments into a native computation and a WebAssembly interface.
    depends_on: []
    design: design/roadmap.md#not-now
    issue: null

  - id: SPC-22
    title: Recording Bindings in Spec Panels
    status: planned
    scope: peripheral
    summary: A spec panel binds to a recording as it binds to a live source, so that a spec-based instrument replays what was recorded.
    depends_on: [SPC-11, STR-12]
    sprint: 5
    issue: null

  - id: SPC-23
    title: Review of Custom Views
    status: planned
    scope: core
    summary: A custom view written by an agent waits for the person's review like any other spec change, with its source, its limits and a capture of what it draws.
    depends_on: [SPC-14, SPC-15]
    sprint: 7
    issue: null

  - id: SPC-24
    title: Custom View Starter Kit
    status: planned
    scope: core
    summary: A starter kit, a guide and examples in Rust, C and AssemblyScript help people and agents write custom views, with an agent guide for writing them through MCP.
    depends_on: [SPC-14, SPC-15]
    sprint: 7
    issue: null

  - id: SPC-25
    title: Agent-Written View Demo
    status: planned
    scope: core
    summary: A demo shows a custom view written entirely by an outside agent through MCP, built and reviewed in one session.
    depends_on: [AGT-02, SPC-23]
    sprint: 7
    issue: null

  - id: SPC-26
    title: Script Runtime for Specs
    status: idea
    scope: core
    summary: A sandboxed script runtime could carry custom logic that the fixed spec primitives cannot express.
    depends_on: [SPC-01, SPC-21]
    issue: null

  - id: SPC-27
    title: Panel Ejected to a Native Instrument
    status: idea
    scope: supporting
    summary: A spec panel that needs more speed could be turned into a native instrument built outside the app and loaded like any other.
    depends_on: [COR-10, SPC-08]
    issue: null

  - id: SPC-28
    title: Source Transforms
    status: shipped
    scope: core
    summary: A tensor source of a spec carries slice, reduce and normalise steps, edited in the builder pane with the shape after each step.
    depends_on: [SPC-01]
    docs: docs/builder/builder-pane.md#properties
    issue: null

  - id: SPC-29
    title: Command Script
    status: shipped
    scope: core
    summary: CALIPER_COMMAND_SCRIPT runs a file of commands, one JSON line each, through the command queue of the hidden app or of caliper shot, and writes each result to a file, for tests, demos and screenshots.
    depends_on: [SPC-06]
    docs: docs/reference/cli.md#workspace
    issue: null

  - id: SPC-30
    title: Builder Pane on the Live Page
    status: planned
    scope: core
    summary: The builder pane is available on the live page, beside an attached session.
    depends_on: [SPC-07, STR-43]
    issue: null

  - id: SPC-31
    title: Arrow IPC Reader
    status: planned
    scope: core
    summary: A native reader decodes Arrow IPC and Feather files into a table, which the loaders refuse today.
    depends_on: [SPC-03]
    issue: null

  - id: SPC-32
    title: HDF5 Reader
    status: planned
    scope: core
    summary: A native reader reads one dataset or every dataset of an HDF5 file when the build finds the HDF5 library, where today the loader points to the Python loader.
    depends_on: [SPC-03]
    issue: null

  - id: SPC-33
    title: Image Stacks
    status: planned
    scope: core
    summary: A loader over a set of images stacks them into one tensor, where today each image becomes a tensor of its own.
    depends_on: [SPC-03]
    issue: null

  - id: SPC-34
    title: Python Loader over Many Files
    status: planned
    scope: core
    summary: A Python loader reads a set of files with one run per file, where today it reads exactly one file.
    depends_on: [SPC-03]
    issue: null

  - id: SPC-35
    title: Transforms on the GPU
    status: idea
    scope: core
    summary: The tensor transforms of loaders and specs could run on the GPU with the same results as the CPU reference.
    depends_on: [SPC-28]
    issue: null

  - id: SPC-36
    title: Time Budget for Live Panels
    status: idea
    scope: core
    summary: The spec runtime could recompute a slow live panel only a few times a second, or on a worker thread, and draw its last result.
    depends_on: [SPC-08]
    issue: null

  - id: SPC-37
    title: SQL Column Checks
    status: idea
    scope: supporting
    summary: The validator could check a spec's bindings to the columns that a SQL source's query returns.
    depends_on: [SPC-02]
    issue: null

  - id: SPC-38
    title: Time Windows over Live Sources
    status: idea
    scope: core
    summary: A spec could limit a live source to a window of time.
    depends_on: [SPC-01, SPC-04]
    issue: null

  - id: SPC-39
    title: Series Labels and Colours
    status: idea
    scope: core
    summary: A series panel could give each line its own label and colour, where today each line is labelled by its binding.
    depends_on: [SPC-01]
    issue: null

  - id: SPC-40
    title: Rename Command
    status: idea
    scope: core
    summary: A command could rename a panel or a source and update every binding and layout that names it.
    depends_on: [SPC-05]
    issue: null

  - id: SPC-41
    title: Undo Across Restarts
    status: idea
    scope: supporting
    summary: The undo history, and with it stacked previews, could be saved with the workspace so that it survives a restart.
    depends_on: [SPC-05]
    issue: null

  - id: SPC-42
    title: Scene Entities
    status: shipped
    scope: core
    summary: A scene panel draws entities that a spec builds from its sources, with an entity table, draw kinds, pick fields and a data box, so that a live tensor becomes a visual with no scene call in the script.
    depends_on: [SPC-11]
    docs: docs/builder/scene-entities.md#entity-table
    issue: null

  - id: SPC-43
    title: Surface and Path Operators
    status: shipped
    scope: core
    summary: The operators surface and path are steps of a source that turn a tensor into geometry, a height surface or a polyline, for the slots of an entity.
    depends_on: [SPC-42]
    docs: docs/builder/operators.md#surface-operator
    issue: null

  - id: SPC-44
    title: State Variables and References
    status: shipped
    scope: core
    summary: State variables that controls and picks write, and binding references that panels read to filter, highlight, recolor or retarget, change what a panel shows at once, also while the run is paused.
    depends_on: [SPC-12]
    docs: docs/builder/state-and-references.md#state-table
    issue: null

  - id: SPC-45
    title: Layout Shares
    status: shipped
    scope: supporting
    summary: A split of the layout gives each child a share of the space, a leaf may state a minimum size in characters and lines, and a control is a leaf of the layout as a panel is.
    depends_on: [SPC-12]
    docs: docs/builder/spec-format.md#layout-shares
    issue: null

  - id: SPC-46
    title: Step History and Time Cursor
    status: shipped
    scope: core
    summary: The app keeps the recent steps of a source with the step of each stamped snapshot, and one time cursor, moved by commands or a transport control, shows every panel at a kept step while the run goes on.
    depends_on: [SPC-44, STR-45]
    docs: docs/builder/time-cursor.md#step-history
    issue: null

  - id: SPC-47
    title: Bound Text
    status: shipped
    scope: supporting
    summary: A bound text formats live values and state into a short text with named fields, number formats and units, for text panels, readouts and other labels.
    depends_on: [SPC-44]
    docs: docs/builder/bound-text.md#format-language
    issue: null

  - id: SPC-48
    title: Annotations and Label Placement
    status: shipped
    scope: supporting
    summary: An annotation marks a value of a panel with a label, a threshold line, a band or a marker, and one placement function keeps the labels of annotations and scene items apart.
    depends_on: [SPC-44, SPC-42]
    docs: docs/builder/annotations.md#annotation-table
    issue: null

  - id: SPC-49
    title: Saved Views
    status: shipped
    scope: supporting
    summary: A scene panel keeps up to 16 named camera views, lists them in a menu of its header, and opens on the view that view_camera names, and the commands camera.save and camera.set write and move them.
    depends_on: [REN-45, SPC-42]
    docs: docs/builder/scene-entities.md#camera-and-saved-views
    issue: null

  - id: SPC-50
    title: Pieces
    status: shipped
    scope: core
    summary: A piece is a folder of a manifest and WGSL files with a derive half and a draw half, identified by a SHA-256 hash that a program pins with its name and version, and read from the library, the workspace or the open spec.
    depends_on: [SPC-14]
    docs: docs/agents/pieces.md#piece-folder
    issue: null

  - id: SPC-51
    title: Piece Commands
    status: shipped
    scope: core
    summary: The commands piece.check, piece.list, piece.show, piece.save, piece.copy, piece.update and piece.remove, and program.read, let an agent write, check and version pieces and read published resources through MCP.
    depends_on: [AGT-02, SPC-50]
    docs: docs/agents/pieces.md#piece-commands
    issue: null

  - id: SPC-52
    title: Provenance Review State
    status: shipped
    scope: core
    summary: A program or piece instance from a foreign spec waits in the review state until the reviewed list contains its source hash.
    depends_on: [SPC-50]
    docs: docs/agents/pieces.md#foreign-specs
    issue: null

  - id: SPC-53
    title: Review Card for Foreign Pieces
    status: planned
    scope: core
    summary: A card shows the source, the limits and a capture of a piece from a foreign spec, and the person's approval writes the hash into the reviewed list, where today a person edits the spec file by hand.
    depends_on: [AGT-17, SPC-52]
    issue: null
