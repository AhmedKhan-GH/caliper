caliper_spec = 2

[instrument]
id = "mnist_parity"
title = "MNIST Probe Dashboard"

[[source]]
id = "loss"
catalog = "live:loss"
history = 4096

[[source]]
id = "loss_window"
from = "loss"
  [[source.transform]]
  op = "window"
  steps = 4096

[[source]]
id = "acc"
catalog = "live:accuracy"
history = 4096

[[source]]
id = "acc_window"
from = "acc"
  [[source.transform]]
  op = "window"
  steps = 4096

[[source]]
id = "digit_0_raw"
catalog = "live:probe.digit_0"
history = 4096

[[source]]
id = "digit_0"
from = "digit_0_raw"
  [[source.transform]]
  op = "window"
  steps = 4096

[[source]]
id = "digit_1_raw"
catalog = "live:probe.digit_1"
history = 4096

[[source]]
id = "digit_1"
from = "digit_1_raw"
  [[source.transform]]
  op = "window"
  steps = 4096

[[source]]
id = "digit_2_raw"
catalog = "live:probe.digit_2"
history = 4096

[[source]]
id = "digit_2"
from = "digit_2_raw"
  [[source.transform]]
  op = "window"
  steps = 4096

[[source]]
id = "digit_3_raw"
catalog = "live:probe.digit_3"
history = 4096

[[source]]
id = "digit_3"
from = "digit_3_raw"
  [[source.transform]]
  op = "window"
  steps = 4096

[[state]]
id = "digit"
title = "Digit"
type = "integer"
default = 0
min = 0.0
max = 9.0

[[panel]]
id = "digits"
primitive = "scene"
title = "Digit Accuracy Ring"
options = { axes = false, select = { field = "digit", state = "digit" }, up = "+y" }

[[panel]]
id = "samples"
primitive = "scene"
title = "Probe Digits"
options = { axes = false }

[[panel]]
id = "loss_curve"
primitive = "series"
title = "Loss"
bind = { x = "loss_window.step", y = "loss_window.value" }
options = { x_label = "Step", y_label = "Loss" }

[[panel]]
id = "acc_curve"
primitive = "series"
title = "Accuracy"
bind = { x = "acc_window.step", y = "acc_window.value" }
options = { x_label = "Step", y_label = "Accuracy" }

[[panel]]
id = "class_scores"
primitive = "series"
title = "Probe Accuracy by Digit"
bind = { x = "digit_0.step", y = ["digit_0.value", "digit_1.value", "digit_2.value", "digit_3.value"] }
options = { legend = true, x_label = "Step", y_label = "Accuracy" }

[[control]]
id = "ablate"
kind = "toggle"
title = "Ablate Filter conv1#3"
bind = "intervene:conv1#3"
options = { value = false }

[[program]]
id = "digit_bars"
title = "Digit Accuracy Ring"
piece = { from = "workspace", hash = "sha256:638d0d276a7a3b9f2fdf9a4d13de87f6f61494c87df37f1c9c1c69b4caf5cb70", name = "digit_ring", version = 1 }
panel = "digits"
bind = { logits = "live:probe.logits", targets = "live:probe.labels" }
params = { scale = 1.0 }

[[program]]
id = "probe_grid"
title = "Probe Digits"
piece = { from = "library", hash = "sha256:783c057468ae40ddbe38aa00f8d560b655670e6dcd6ed1183ebafc5e783cdba4", name = "image_grid", version = 1 }
panel = "samples"
bind = { images = "live:probe.images", logits = "live:probe.logits", targets = "live:probe.labels" }
params = { cols = 4.0, only_errors = { default = 0, field = "has_errors", selection = "digits" }, page = { state = "digit" }, rows = 4.0, scale = 1.0 }

[layout]
split = "vertical"
children = [{ split = "horizontal", ratio = 0.5, children = [{ split = "vertical", ratio = 0.45, children = ["digits", { split = "vertical", ratio = 0.55, children = ["class_scores", { tabs = ["loss_curve", "acc_curve"] }] }] }, "samples"] }, "ablate"]
