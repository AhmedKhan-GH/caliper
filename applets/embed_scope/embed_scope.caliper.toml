[applet]
id      = "dev.caliper.embed-scope"
name    = "EmbedScope"
version = "0.1.0"
summary = "3D embedding projector: a small MNIST net with a learned 3-D bottleneck whose test-set embeddings are drawn as a live ImPlot3D scatter (10 classes) that splits blob->lobes while training runs off the frame thread via caliper.jobs.v1. Hover a point for its digit via tensor_bridge.v1; Save/Load the model via artifacts.v1 (Load skips training); class centroids and misclassified counts via SQL over caliper.data.v1."
tag     = "ML"

[compat]
abi_epoch = 2
min_host  = "0.6.0"

[services]
required = ["caliper.ui.v1", "caliper.log.v1", "caliper.jobs.v1", "caliper.device.v1"]
optional = ["caliper.metrics.v1", "caliper.tensor_bridge.v1", "caliper.artifacts.v1", "caliper.data.v1"]
