[applet]
id      = "dev.ahmed.opengllama"
name    = "OpenGllama"
version = "0.1.0"
summary = "Load GGUF models via llama.cpp and visualize layer activations with OpenGL-rendered heatmaps on Metal/CUDA backends."
tag     = "LLM"

[compat]
abi_epoch = 2
min_host  = "0.6.0"

[services]
# tensor_bridge.v1 is REQUIRED since Phase 2D: the attention heatmaps upload
# through it (bridge-native, no raw GL) and cannot render without it.
required = ["caliper.ui.v1", "caliper.log.v1", "caliper.tensor_bridge.v1"]
