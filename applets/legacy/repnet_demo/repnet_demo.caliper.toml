[applet]
id      = "dev.ahmed.repnet-demo"
name    = "RepNet Demo"
version = "1.0.0"
summary = "Load and visualize the UCDH Senior Design dataset, run signal preprocessing, inspect raw data via DuckDB, and run model inference on ECG recordings."
tag     = "ECG"

[compat]
abi_epoch = 2
min_host  = "0.6.0"

# tensor_bridge.v1 required since Phase 2D: viz heatmaps upload through the
# bridge (raw GL removed) — it cannot render the activation/weight views without it.
[services]
required = ["caliper.ui.v1", "caliper.log.v1", "caliper.tensor_bridge.v1"]
