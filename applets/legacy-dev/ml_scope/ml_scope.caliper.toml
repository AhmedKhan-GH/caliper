[applet]
id      = "dev.caliper.ml-scope"
name    = "MLScope"
version = "0.1.0"
summary = "ML exemplar: trains a small CNN on MNIST off the frame thread via caliper.jobs.v1, device-negotiated, with live loss and test accuracy — and a live conv1 kernel grid via tensor_bridge.v1, GPU-resident (zero CPU staging) on the Metal backend."
tag     = "ML"

[compat]
abi_epoch = 2
min_host  = "0.6.0"

[services]
required = ["caliper.ui.v1", "caliper.log.v1", "caliper.jobs.v1", "caliper.device.v1"]
optional = ["caliper.metrics.v1", "caliper.tensor_bridge.v1"]
