site_name: Caliper Documentation
site_url: https://ahmedkhan-gh.github.io/caliper/docs/
docs_dir: docs
site_dir: build/wiki-site
# In the repository, not on the site: the cookbook is written around the applets, which are
# not shipped.
exclude_docs: |
  applets/ml-applet-cookbook.md
# Broken anchors fail the strict build too, like broken links.
validation:
  anchors: warn
theme:
  name: material
  # Icons, fonts and the stylesheet live outside docs/, which holds documents only.
  custom_dir: docs-theme
  logo: assets/caliper-icon-minerals.svg
  favicon: assets/caliper-icon-minerals.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
extra:
  # The header logo opens the full docs tree (docs/contents.md, filled by docs-theme/hooks/contents.py).
  homepage: /caliper/docs/contents/
# The navigation follows the folders under docs/; a .nav.yml in a folder sets its order.
# Generates the roadmap's pages and data files from the registry in roadmap/.
hooks:
  - roadmap/build.py
  - docs-theme/hooks/contents.py
# A local `mkdocs serve` rebuilds when the registry, the Python package or the C headers change.
watch:
  - roadmap
  - candidates
  - python/caliper
  - sdk/include/caliper
  - include/caliper
plugins:
  - search
  - awesome-nav
  # The Python API reference: `::: caliper.<name>` in a page renders that object from its docstring
  # (Google style). The source is read statically, so the build imports neither caliper nor torch.
  - autorefs
  - mkdocstrings:
      default_handler: python
      # Template overrides (the section labels). The folder is hidden, so the theme does not copy it into the site.
      custom_templates: docs-theme/.mkdocstrings
      handlers:
        python:
          paths: [python]
          load_external_modules: false
          options:
            docstring_style: google
            docstring_options:
              returns_named_value: false
            docstring_section_style: table
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            line_length: 80
            show_source: false
            show_bases: false
            show_labels: false
            show_if_no_docstring: false
            show_docstring_attributes: true
            members_order: source
            merge_init_into_class: false
            filters: ["!^_"]
            extensions:
              - docs-theme/griffe/hide_private_parameters.py:HidePrivateParameters
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
