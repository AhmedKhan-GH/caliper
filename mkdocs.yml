site_name: Caliper Documentation
site_url: https://ahmedkhan-gh.github.io/caliper/docs/
docs_dir: docs/wiki
site_dir: build/wiki-site
# In the repository, not on the site: guides written around the applets, which are not shipped.
exclude_docs: |
  howto/ml-applet-cookbook.md
  howto/port-v1-applet.md
theme:
  name: material
  logo: assets/caliper-icon.svg
  favicon: assets/caliper-icon.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
extra:
  homepage: /caliper/
extra_css:
  - stylesheets/sternbild.css
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
nav:
  - Home: index.md
  - Tutorials:
      - Development basics: tutorials/development-basics.md
      - Your first applet: tutorials/first-applet.md
      - Your first ML applet: tutorials/first-ml-applet.md
      - Watch PyTorch training live: tutorials/live-pytorch.md
  - How-to:
      - Debug an applet: howto/debug-an-applet.md
      - Attach to a running script: howto/attach-to-a-running-script.md
  - Reference:
      - ABI (epoch 2): reference/abi.md
      - Manifest (caliper.toml): reference/manifest.md
      - Refusal messages: reference/refusals.md
      - Tensor (caliper/tensor.h): reference/tensor.md
      - Arrow C Data Interface: reference/arrow.md
      - Adapters (torch): reference/adapters.md
      - Torch objects on each platform: reference/torch-on-each-platform.md
      - Services:
          - caliper.ui.v1: reference/services/ui-v1.md
          - caliper.log.v1: reference/services/log-v1.md
          - caliper.jobs.v1: reference/services/jobs-v1.md
          - caliper.device.v1: reference/services/device-v1.md
          - caliper.metrics.v1: reference/services/metrics-v1.md
          - caliper.tensor_bridge.v1: reference/services/tensor-bridge-v1.md
          - caliper.geometry.v1 / v1_1 / v1_2 / v1_3: reference/services/geometry-v1.md
          - caliper.export.v1 / v1_1: reference/services/export-v1.md
          - caliper.artifacts.v1: reference/services/artifacts-v1.md
          - caliper.data.v1: reference/services/data-v1.md
          - caliper.feed.v1: reference/services/feed-v1.md
      - C++ sugar: reference/sugar.md
      - Embedding (libcaliper): reference/embedding.md
      - Python API (caliper): reference/python-api.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Rendering: explanation/rendering.md
      - Live streaming: explanation/live-streaming.md
      - Compatibility & epochs: explanation/compatibility.md
      - Trust model: explanation/trust-model.md
  - Decisions: decisions/index.md
