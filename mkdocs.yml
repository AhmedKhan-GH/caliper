site_name: Caliper Documentation
site_url: https://ahmedkhan-gh.github.io/caliper/docs/
docs_dir: docs
site_dir: build/wiki-site
# In the repository, not on the site: the cookbook is written around the applets, which are
# not shipped.
exclude_docs: |
  applets/ml-applet-cookbook.md
# Broken anchors fail the strict build too, like broken links.
validation:
  anchors: warn
theme:
  name: material
  # Icons, fonts and the stylesheet live outside docs/, which holds documents only.
  custom_dir: docs-theme
  logo: assets/caliper-icon-minerals.svg
  favicon: assets/caliper-icon-minerals.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
extra:
  homepage: /caliper/
# The navigation follows the folders under docs/; a .nav.yml in a folder sets its order.
# Generates the roadmap's pages and data files from the registry in roadmap/.
hooks:
  - roadmap/build.py
# A local `mkdocs serve` rebuilds when the registry changes.
watch:
  - roadmap
plugins:
  - search
  - awesome-nav
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
