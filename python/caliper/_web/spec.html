  /* The app's colours (src/host/ui/sternbild_theme.h), so a spec applet looks as it does in the app. */
  :root {
    --deep: #12110f;
    --ground: #181715;
    --plate: #201f1c;
    --rule: #4b4945;
    --parchment: #e8e0d0;
    --secondary: #c1baaa;
    --faint: #8f897c;
    --bronze: #b38b59;
    --text: "Plex Condensed", -apple-system, "Helvetica Neue", sans-serif;
    --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--ground); color: var(--parchment);
         font: 11.54px/1 var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; }
  /* The page bar and the status strip keep their places at the window's edges, as the app's do. */
  .bar { flex: 0 0 28px; display: flex; align-items: center; gap: 12px; padding: 0 8px;
         background: var(--ground); border-bottom: 1px solid var(--rule); }
