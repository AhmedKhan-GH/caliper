<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img"
     aria-label="Two data paths compared. The conventional round trip copies a GPU tensor down across the CPU boundary to a NumPy array, encodes it to a PNG or event file on disk, polls and decodes it into a CPU pixel buffer, then uploads it back up across the boundary to a GPU texture in a browser — crossing the PCIe boundary twice. Caliper instead blits the GPU tensor to a GPU texture and draws it with ImGui the same frame, entirely on the GPU.">
  <!-- ============================================================
       mech-roundtrip — signal-to-noise flow: only Caliper's on-GPU
       path glows in accent; the conventional round trip stays muted.
       Palette: graphite #191A20, surface #22242C, line #687180,
       muted #C1C6D0, text #F6F7F9, compute #8FC6FF, signal #FF937D.
       ============================================================ -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lane   { fill:#C1C6D0; font-size:15px; font-weight:600; letter-spacing:1.5px; }
    .boxlbl { fill:#F6F7F9; font-size:19px; font-weight:500; }
    .steplbl{ fill:#C1C6D0; font-size:15px; }
    .foot   { fill:#C1C6D0; font-size:15px; }
    .box       { fill:#22242C; stroke:#687180; stroke-width:1.25; }
    .box-glow  { fill:#22242C; stroke:#8FC6FF; stroke-width:1.5; }
    .p-muted   { fill:none; stroke:#8D96A5; stroke-width:1.5; }
    .p-glow    { fill:none; stroke:#8FC6FF; stroke-width:2.5; }
    .num-c { fill:#191A20; stroke:#FF937D; stroke-width:1.25; }
    .num-t { fill:#FF937D; font-size:15px; font-weight:600; }
  </style>
  <defs>
    <marker id="rt-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8D96A5"/>
    </marker>
    <marker id="rt-arrow-glow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FC6FF"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#191A20"/>

  <!-- ===================== LANE A — conventional ===================== -->
  <text class="lane" x="24" y="26">THE CONVENTIONAL ROUND TRIP (TENSORBOARD-STYLE)</text>

  <!-- GPU | CPU boundary band (PCIe) -->
  <rect x="24" y="124" width="1152" height="26" fill="#22242C" stroke="#687180" stroke-width="1"/>
  <line x1="24" y1="124" x2="1176" y2="124" stroke="#687180" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="24" y1="150" x2="1176" y2="150" stroke="#687180" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="steplbl" x="500" y="141" text-anchor="middle">GPU  |  CPU boundary (PCIe)</text>

  <!-- muted path: down (1), across (2,3), up (4) -->
  <path class="p-muted" d="M140,104 V164" marker-end="url(#rt-arrow-muted)"/>
  <path class="p-muted" d="M240,198 H322" marker-end="url(#rt-arrow-muted)"/>
  <path class="p-muted" d="M730,198 H872" marker-end="url(#rt-arrow-muted)"/>
  <path class="p-muted" d="M1000,170 V110" marker-end="url(#rt-arrow-muted)"/>

  <!-- both boundary crossings, marked with bright diamonds -->
  <path d="M140,127 l10,10 -10,10 -10,-10 z" fill="#191A20" stroke="#F6F7F9" stroke-width="1.5"/>
  <path d="M140,131 l6,6 -6,6 -6,-6 z" fill="#F6F7F9"/>
  <path d="M1000,127 l10,10 -10,10 -10,-10 z" fill="#191A20" stroke="#F6F7F9" stroke-width="1.5"/>
  <path d="M1000,131 l6,6 -6,6 -6,-6 z" fill="#F6F7F9"/>

  <!-- boxes -->
  <rect class="box" x="40"  y="48"  width="200" height="56" rx="0"/>
  <text class="boxlbl" x="140" y="76"  text-anchor="middle" dominant-baseline="central">GPU tensor</text>

  <rect class="box" x="40"  y="170" width="200" height="56" rx="0"/>
  <text class="boxlbl" x="140" y="198" text-anchor="middle" dominant-baseline="central">CPU numpy array</text>

  <rect class="box" x="330" y="170" width="400" height="56" rx="0"/>
  <text class="boxlbl" x="530" y="198" text-anchor="middle" dominant-baseline="central">PNG / event file on disk</text>

  <rect class="box" x="880" y="170" width="240" height="56" rx="0"/>
  <text class="boxlbl" x="1000" y="198" text-anchor="middle" dominant-baseline="central">CPU pixel buffer</text>

  <rect class="box" x="880" y="48"  width="240" height="56" rx="0"/>
  <text class="boxlbl" x="1000" y="68"  text-anchor="middle" dominant-baseline="central">GPU texture</text>
  <text class="boxlbl" x="1000" y="88"  text-anchor="middle" dominant-baseline="central">in a browser</text>

  <!-- step badges + labels -->
  <text class="steplbl" x="252" y="118" >device&#8594;host copy</text>
  <circle class="num-c" cx="140" cy="160" r="11"/>
  <text class="num-t" x="140" y="160" text-anchor="middle" dominant-baseline="central">1</text>

  <text class="steplbl" x="285" y="182" text-anchor="middle">encode</text>
  <circle class="num-c" cx="285" cy="198" r="11"/>
  <text class="num-t" x="285" y="198" text-anchor="middle" dominant-baseline="central">2</text>

  <text class="steplbl" x="805" y="182" text-anchor="middle">poll + decode</text>
  <circle class="num-c" cx="805" cy="198" r="11"/>
  <text class="num-t" x="805" y="198" text-anchor="middle" dominant-baseline="central">3</text>

  <text class="steplbl" x="888" y="118" text-anchor="end">host&#8594;device upload</text>
  <circle class="num-c" cx="1000" cy="160" r="11"/>
  <text class="num-t" x="1000" y="160" text-anchor="middle" dominant-baseline="central">4</text>

  <text class="foot" x="40" y="252">two bus transfers &#183; encode/decode &#183; filesystem &#183; seconds of latency</text>

  <!-- ===================== divider ===================== -->
  <line x1="24" y1="274" x2="1176" y2="274" stroke="#687180" stroke-width="1"/>

  <!-- ===================== LANE B — Caliper ===================== -->
  <text class="lane" x="24" y="300">CALIPER</text>

  <!-- GPU band: the whole path stays inside it -->
  <rect x="24" y="314" width="1152" height="118" rx="0" fill="#22242C" stroke="#687180" stroke-width="1"/>
  <text class="lane" x="46" y="338" style="letter-spacing:2px">ON THE GPU</text>

  <!-- accent path: the one thing that glows -->
  <path class="p-glow" d="M290,387 H462" marker-end="url(#rt-arrow-glow)"/>
  <path class="p-glow" d="M690,387 H862" marker-end="url(#rt-arrow-glow)"/>

  <rect class="box-glow" x="70"  y="358" width="220" height="58" rx="0"/>
  <text class="boxlbl" x="180" y="387" text-anchor="middle" dominant-baseline="central">GPU tensor</text>

  <rect class="box-glow" x="470" y="358" width="220" height="58" rx="0"/>
  <text class="boxlbl" x="580" y="387" text-anchor="middle" dominant-baseline="central">GPU texture</text>

  <rect class="box-glow" x="870" y="358" width="220" height="58" rx="0"/>
  <text class="boxlbl" x="980" y="387" text-anchor="middle" dominant-baseline="central">ImGui draw</text>

  <text class="steplbl" x="380" y="344" text-anchor="middle">GPU blit + colormap</text>
  <circle class="num-c" cx="380" cy="387" r="11"/>
  <text class="num-t" x="380" y="387" text-anchor="middle" dominant-baseline="central">1</text>

  <text class="steplbl" x="780" y="344" text-anchor="middle">same frame</text>
  <circle class="num-c" cx="780" cy="387" r="11"/>
  <text class="num-t" x="780" y="387" text-anchor="middle" dominant-baseline="central">2</text>

  <text class="foot" x="24" y="452">one on-GPU blit &#183; visible the same frame</text>
</svg>
