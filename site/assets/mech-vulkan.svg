<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img"
     aria-label="Windows NVIDIA zero-copy path. System RAM is never touched — no host staging, no PCIe round trip. Everything stays inside device-local VRAM: training kernels write a torch CUDA tensor; a shared buffer is exported by Vulkan and imported by CUDA; one cuMemcpyDtoD copies the tensor into the shared buffer inside VRAM; a compute colormap pass turns the buffer into a VkImage; and ImGui draws it as pixels the same frame. CUDA and Vulkan synchronize on a shared timeline semaphore with no CPU sync on the hot path.">
  <!-- ============================================================
       mech-vulkan — the data never leaves VRAM. System RAM is drawn
       deliberately inert (dashed, dimmed). Only the in-VRAM data path
       glows in accent. Left: schematic. Right: numbered steps.
       ============================================================ -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .plane-t { fill:#F6F7F9; font-size:15px; font-weight:600; letter-spacing:1.5px; }
    .ghost-t { fill:#C1C6D0; font-size:14px; font-weight:600; letter-spacing:1.5px; }
    .ghost-s { fill:#8D96A5; font-size:12px; }
    .boxlbl  { fill:#F6F7F9; font-size:16px; font-weight:500; }
    .boxlbl2 { fill:#C1C6D0; font-size:13px; }
    .steplbl { fill:#F6F7F9; font-size:13px; font-weight:500; }
    .stepsub { fill:#C1C6D0; font-size:12px; }
    .foot    { fill:#C1C6D0; font-size:12px; }
    .box      { fill:#22242C; stroke:#687180; stroke-width:1.25; }
    .box-glow { fill:#22242C; stroke:#8FC6FF; stroke-width:1.75; }
    .p-glow   { fill:none; stroke:#8FC6FF; stroke-width:2.5; }
    .num-c { fill:#191A20; stroke:#FF937D; stroke-width:1.25; }
    .num-t { fill:#FF937D; font-size:13px; font-weight:600; }
  </style>
  <defs>
    <marker id="v-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FC6FF"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#191A20"/>

  <!-- ================= ghosted plane: SYSTEM RAM — never touched ================= -->
  <rect x="20" y="40" width="380" height="58" rx="0" fill="none"
        stroke="#687180" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text class="ghost-t" x="40" y="66">SYSTEM RAM &#8212; NEVER TOUCHED</text>
  <text class="ghost-s" x="40" y="86">no host staging, no PCIe round trip</text>

  <!-- ================= active plane: VRAM (device-local) ================= -->
  <rect x="20" y="114" width="380" height="392" rx="0" fill="#22242C" stroke="#687180" stroke-width="1.25"/>
  <text class="plane-t" x="40" y="142">VRAM (device-local)</text>

  <!-- accent data path down the plane -->
  <path class="p-glow" d="M205,214 V248" marker-end="url(#v-arrow)"/>
  <path class="p-glow" d="M205,300 V334" marker-end="url(#v-arrow)"/>
  <path class="p-glow" d="M205,386 V420" marker-end="url(#v-arrow)"/>

  <rect class="box" x="70" y="160" width="270" height="54" rx="0"/>
  <text class="boxlbl" x="205" y="187" text-anchor="middle" dominant-baseline="central">torch CUDA tensor</text>

  <rect class="box-glow" x="70" y="248" width="270" height="52" rx="0"/>
  <text class="boxlbl" x="205" y="274" text-anchor="middle" dominant-baseline="central">shared buffer</text>

  <rect class="box" x="85" y="334" width="240" height="52" rx="0"/>
  <text class="boxlbl" x="205" y="360" text-anchor="middle" dominant-baseline="central">VkImage</text>

  <rect class="box" x="85" y="420" width="240" height="60" rx="0"/>
  <text class="boxlbl"  x="205" y="443" text-anchor="middle" dominant-baseline="central">ImGui::Image</text>
  <text class="boxlbl2" x="205" y="465" text-anchor="middle" dominant-baseline="central">pixels this frame</text>

  <!-- badges on the schematic -->
  <circle class="num-c" cx="70"  cy="160" r="12"/>
  <text class="num-t" x="70"  y="160" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="num-c" cx="70"  cy="248" r="12"/>
  <text class="num-t" x="70"  y="248" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="num-c" cx="205" cy="231" r="11"/>
  <text class="num-t" x="205" y="231" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="num-c" cx="205" cy="317" r="11"/>
  <text class="num-t" x="205" y="317" text-anchor="middle" dominant-baseline="central">4</text>
  <circle class="num-c" cx="205" cy="403" r="11"/>
  <text class="num-t" x="205" y="403" text-anchor="middle" dominant-baseline="central">5</text>

  <!-- ================= numbered steps (legend) ================= -->
  <!-- 1 -->
  <circle class="num-c" cx="432" cy="60" r="11"/>
  <text class="num-t" x="432" y="60" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="steplbl" x="454" y="56">training kernels write the</text>
  <text class="steplbl" x="454" y="74">CUDA tensor</text>

  <!-- 2 -->
  <circle class="num-c" cx="432" cy="112" r="11"/>
  <text class="num-t" x="432" y="112" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="steplbl" x="454" y="108">the shared buffer: Vulkan</text>
  <text class="steplbl" x="454" y="126">EXPORTS it, CUDA IMPORTS it</text>
  <text class="stepsub" x="454" y="145">VkExportMemoryAllocateInfo &#8594; opaque</text>
  <text class="stepsub" x="454" y="159">Win32 handle; cuImportExternalMemory</text>
  <text class="stepsub" x="454" y="177">direction is Vulkan&#8594;CUDA because torch's</text>
  <text class="stepsub" x="454" y="191">caching allocator can't export</text>

  <!-- 3 -->
  <circle class="num-c" cx="432" cy="224" r="11"/>
  <text class="num-t" x="432" y="224" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="steplbl" x="454" y="220">one cuMemcpyDtoD, tensor &#8594;</text>
  <text class="steplbl" x="454" y="238">shared buffer, inside VRAM</text>
  <text class="stepsub" x="454" y="257">the '1 in-VRAM copy' floor &#8212; 0 copies</text>
  <text class="stepsub" x="454" y="271">when the tensor is born in ExportablePool</text>
  <text class="stepsub" x="454" y="285">/ alloc_shared (kernels write</text>
  <text class="stepsub" x="454" y="299">texture-backed VRAM in place)</text>

  <!-- 4 -->
  <circle class="num-c" cx="432" cy="332" r="11"/>
  <text class="num-t" x="432" y="332" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="steplbl" x="454" y="328">compute colormap pass:</text>
  <text class="steplbl" x="454" y="346">buffer &#8594; VkImage</text>

  <!-- 5 -->
  <circle class="num-c" cx="432" cy="380" r="11"/>
  <text class="num-t" x="432" y="380" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="steplbl" x="454" y="376">ImTextureID via the same frozen</text>
  <text class="steplbl" x="454" y="394">bridge ABI &#8594; ImGui::Image &#8212;</text>
  <text class="steplbl" x="454" y="412">pixels this frame</text>

  <!-- sync relationship -->
  <line x1="432" y1="434" x2="742" y2="434" stroke="#687180" stroke-width="1"/>
  <text class="stepsub" x="432" y="452">sync: shared timeline semaphore</text>
  <text class="stepsub" x="432" y="466">(VK_KHR_timeline_semaphore &#8596;</text>
  <text class="stepsub" x="432" y="480">cuImportExternalSemaphore): CUDA signals</text>
  <text class="stepsub" x="432" y="494">after its stream-ordered copy, Vulkan</text>
  <text class="stepsub" x="432" y="508">GPU-waits &#8212; no CPU sync on the hot path.</text>

  <!-- ================= footnote (full width) ================= -->
  <line x1="20" y1="520" x2="740" y2="520" stroke="#687180" stroke-width="1"/>
  <text class="foot" x="20" y="540">Device pairing is UUID-driven; the whole path stays device-local &#8212; system RAM is never on it.</text>
</svg>
