<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img"
     aria-label="Apple Silicon unified memory zero-copy path. Inside one pool of physical RAM shared by CPU and GPU, a torch MPS tensor's storage is the same object as an id&lt;MTLBuffer&gt;. Training kernels write that buffer; the handoff to the renderer is a pointer cast moving zero bytes; a GPU blit encoder turns the buffer into an MTLTexture with a colormap applied on-GPU; and ImGui draws it as pixels the same frame.">
  <!-- ============================================================
       mech-metal — the identity IS the mechanism: tensor storage and
       MTLBuffer are one box, not two. Only the vertical data path
       glows in accent. Left: schematic. Right: numbered steps.
       ============================================================ -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .plane-t { fill:#E6EAF2; font-size:15px; font-weight:600; letter-spacing:1.5px; }
    .plane-s { fill:#8B94A7; font-size:13px; }
    .boxlbl  { fill:#E6EAF2; font-size:16px; font-weight:500; }
    .boxlbl2 { fill:#8B94A7; font-size:13px; }
    .steplbl { fill:#E6EAF2; font-size:14px; font-weight:500; }
    .stepsub { fill:#8B94A7; font-size:12px; }
    .foot    { fill:#8B94A7; font-size:12px; }
    .box      { fill:#131826; stroke:#2A3245; stroke-width:1.25; }
    .box-glow { fill:#131826; stroke:#5EEAD4; stroke-width:1.75; }
    .p-glow   { fill:none; stroke:#5EEAD4; stroke-width:2.5; }
    .num-c { fill:#0B0E14; stroke:#5EEAD4; stroke-width:1.25; }
    .num-t { fill:#5EEAD4; font-size:14px; font-weight:600; }
  </style>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EEAD4"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#0B0E14"/>

  <!-- ================= schematic: the unified-memory plane ================= -->
  <rect x="20" y="48" width="424" height="452" rx="12" fill="#0F131E" stroke="#2A3245" stroke-width="1.25"/>
  <text class="plane-t" x="40" y="80">UNIFIED MEMORY</text>
  <text class="plane-s" x="40" y="100">one pool of physical RAM (CPU + GPU)</text>

  <!-- accent data path down the plane -->
  <path class="p-glow" d="M232,208 V266" marker-end="url(#m-arrow)"/>
  <path class="p-glow" d="M232,326 V388" marker-end="url(#m-arrow)"/>

  <!-- the identity box: tensor storage == MTLBuffer (accent = on the path) -->
  <rect class="box-glow" x="64" y="120" width="336" height="88" rx="8"/>
  <text class="boxlbl"  x="232" y="147" text-anchor="middle" dominant-baseline="central">torch MPS tensor storage</text>
  <text class="boxlbl"  x="232" y="171" text-anchor="middle" dominant-baseline="central" fill="#5EEAD4">= id&lt;MTLBuffer&gt;</text>
  <text class="boxlbl2" x="232" y="191" text-anchor="middle" dominant-baseline="central">the same object</text>

  <rect class="box" x="102" y="266" width="260" height="56" rx="8"/>
  <text class="boxlbl" x="232" y="294" text-anchor="middle" dominant-baseline="central">MTLTexture</text>

  <rect class="box" x="102" y="388" width="260" height="72" rx="8"/>
  <text class="boxlbl"  x="232" y="414" text-anchor="middle" dominant-baseline="central">ImGui::Image</text>
  <text class="boxlbl2" x="232" y="436" text-anchor="middle" dominant-baseline="central">pixels this frame</text>

  <!-- badges on the schematic -->
  <circle class="num-c" cx="64"  cy="120" r="13"/>
  <text class="num-t" x="64"  y="120" text-anchor="middle" dominant-baseline="central">1</text>
  <circle class="num-c" cx="232" cy="224" r="12"/>
  <text class="num-t" x="232" y="224" text-anchor="middle" dominant-baseline="central">2</text>
  <circle class="num-c" cx="232" cy="252" r="12"/>
  <text class="num-t" x="232" y="252" text-anchor="middle" dominant-baseline="central">3</text>
  <circle class="num-c" cx="232" cy="356" r="12"/>
  <text class="num-t" x="232" y="356" text-anchor="middle" dominant-baseline="central">4</text>

  <!-- ================= numbered steps (legend) ================= -->
  <!-- 1 -->
  <circle class="num-c" cx="484" cy="122" r="12"/>
  <text class="num-t" x="484" y="122" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="steplbl" x="506" y="112">training kernels write the</text>
  <text class="steplbl" x="506" y="130">weight MTLBuffer (worker</text>
  <text class="steplbl" x="506" y="148">thread, torch MPS)</text>

  <!-- 2 -->
  <circle class="num-c" cx="484" cy="186" r="12"/>
  <text class="num-t" x="484" y="186" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="steplbl" x="506" y="176">handoff = pointer cast</text>
  <text class="steplbl" x="506" y="194">&#8212; 0 bytes moved</text>
  <text class="stepsub" x="506" y="214">adapter requires contiguous(),</text>
  <text class="stepsub" x="506" y="229">storage_offset()==0 &#8212; views are</text>
  <text class="stepsub" x="506" y="244">rejected, not guessed</text>

  <!-- 3 -->
  <circle class="num-c" cx="484" cy="286" r="12"/>
  <text class="num-t" x="484" y="286" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="steplbl" x="506" y="276">GPU blit encoder:</text>
  <text class="steplbl" x="506" y="294">buffer &#8594; MTLTexture,</text>
  <text class="stepsub" x="506" y="314">colormap LUT applied on-GPU</text>
  <text class="stepsub" x="506" y="329">(f32 heatmaps)</text>

  <!-- 4 -->
  <circle class="num-c" cx="484" cy="372" r="12"/>
  <text class="num-t" x="484" y="372" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="steplbl" x="506" y="362">ImTextureID &#8594; ImGui::Image</text>
  <text class="steplbl" x="506" y="380">&#8212; pixels this frame</text>

  <!-- ================= sync footnote ================= -->
  <line x1="20" y1="504" x2="740" y2="504" stroke="#2A3245" stroke-width="1"/>
  <text class="foot" x="20" y="524">handoff sync: v1 drain (torch::mps::synchronize) or per-texture MTLSharedEvent riding torch's own</text>
  <text class="foot" x="20" y="540">stream queue (bridge v1.1) &#8212; CPU never waits on the hot path.</text>
</svg>
