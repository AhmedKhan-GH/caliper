<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Placeholder: demo recording coming soon">
  <defs>
    <pattern id="grid-hero" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A3245" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- dark ground -->
  <rect width="1200" height="675" fill="#0B0E14"/>

  <!-- instrument screen: surface panel + 40px grid -->
  <rect x="24" y="24" width="1152" height="627" rx="10" fill="#131826"/>
  <rect x="24" y="24" width="1152" height="627" rx="10" fill="url(#grid-hero)"/>

  <!-- bezel frame -->
  <rect x="24.5" y="24.5" width="1151" height="626" rx="10" fill="none" stroke="#2A3245" stroke-width="1"/>

  <!-- corner ticks -->
  <g fill="none" stroke="#2A3245" stroke-width="2">
    <path d="M56 84V56H84"/>
    <path d="M1116 56h28v28"/>
    <path d="M56 591v28h28"/>
    <path d="M1144 591v28h-28"/>
  </g>

  <!-- standby caption with accent record dot -->
  <circle cx="60" cy="122" r="5" fill="#5EEAD4"/>
  <text x="78" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3" fill="#8B94A7">AWAITING SIGNAL</text>

  <!-- primary label -->
  <text x="600" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="600" letter-spacing="8" fill="#8B94A7">DEMO RECORDING — COMING SOON</text>

  <!-- accent scan line -->
  <rect x="540" y="352" width="120" height="2" fill="#5EEAD4"/>

  <!-- sub label -->
  <text x="600" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="1" fill="#8B94A7" opacity="0.8">zero-copy tensors → pixels, captured live</text>
</svg>
