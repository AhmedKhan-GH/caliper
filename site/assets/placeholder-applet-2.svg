<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Placeholder: instance_scope recording coming soon">
  <defs>
    <pattern id="grid-applet-2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A3245" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- dark ground -->
  <rect width="800" height="500" fill="#0B0E14"/>

  <!-- instrument screen: surface panel + 40px grid -->
  <rect x="16" y="16" width="768" height="468" rx="8" fill="#131826"/>
  <rect x="16" y="16" width="768" height="468" rx="8" fill="url(#grid-applet-2)"/>

  <!-- bezel frame -->
  <rect x="16.5" y="16.5" width="767" height="467" rx="8" fill="none" stroke="#2A3245" stroke-width="1"/>

  <!-- corner ticks -->
  <g fill="none" stroke="#2A3245" stroke-width="2">
    <path d="M44 72V44H72"/>
    <path d="M756 44h28v28"/>
    <path d="M44 456v28h28"/>
    <path d="M784 456v28h-28"/>
  </g>

  <!-- standby caption with accent record dot -->
  <circle cx="52" cy="104" r="5" fill="#5EEAD4"/>
  <text x="68" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#8B94A7">STANDBY</text>

  <!-- applet label -->
  <text x="400" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="600" letter-spacing="4" fill="#8B94A7">instance_scope</text>

  <!-- accent scan line -->
  <rect x="340" y="268" width="120" height="2" fill="#5EEAD4"/>

  <!-- sub label -->
  <text x="400" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#8B94A7" opacity="0.8">recording coming soon</text>
</svg>
