name: Interpretability
on:
  push:
    branches: [main]
    paths: ['python/**', 'tools/interp/**', 'tests/interp/**', 'pyproject.toml', '.github/workflows/interp.yml']
  pull_request:
    paths: ['python/**', 'tools/interp/**', 'tests/interp/**', 'pyproject.toml', '.github/workflows/interp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: Fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: python
      CALIPER_AGENT_OFFLINE: '1'
      CALIPER_TEST_RUN: '1'
      CALIPER_DATA_DIR: ${{ runner.temp }}/caliper-interp/data
      TMPDIR: ${{ runner.temp }}/caliper-interp/temp
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fixture Environment
        run: >-
          python -c "import os,pathlib; pathlib.Path(os.environ['TMPDIR']).mkdir(parents=True,exist_ok=True);
          pathlib.Path(os.environ['CALIPER_DATA_DIR']).mkdir(parents=True,exist_ok=True)"
      - name: Fixture Dependencies
        run: python -m pip install torch==2.15.0 transformers==5.24.0 safetensors numpy pytest websockets Pillow psutil datasets
      - name: CPU Fixture Checks
        run: python -m pytest -q tests/interp -m "not local_model" --strict-markers
