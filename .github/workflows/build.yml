# .github/workflows/build.yml
name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'design/**', 'roadmap/**', 'candidates/**', 'mkdocs.yml', '**.md',
                   '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', 'design/**', 'roadmap/**', 'candidates/**', 'mkdocs.yml', '**.md',
                   '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# libtorch is fetched by cmake/Dependencies.cmake at configure time when
# third_party/libtorch* is absent (PYTORCH_VERSION there); the cache key pins
# the same version so a bump in CMake misses the cache instead of reusing a
# stale archive.
#
# Compilers run through sccache (configure sets it as the compiler launcher),
# which stores each object in the GitHub Actions cache, so a run recompiles
# only the translation units whose preprocessed source, flags or compiler
# changed. Before this every run rebuilt DuckDB, curl, zlib, glslang and GLFW
# from scratch.
env:
  LIBTORCH_VERSION: 2.5.1
  # The Python torch of the acceptance tests. GPU programs import the script's MPS tensors through
  # DLPack and caliper.watch stages them in pinned memory, and torch 2.5.1 (the libtorch the build
  # fetches) does neither for MPS tensors, thus this torch is newer than that libtorch.
  ACCEPTANCE_TORCH_VERSION: 2.15.0
  SCCACHE_GHA_ENABLED: "true"

jobs:
  macos:
    # Apple Silicon: the libtorch archive CMake downloads is arm64 and the
    # Metal backend + MPS cases only mean anything there.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # Submodules come from the repo's own script, not checkout's recursion:
      # some pins are not fetchable from their remotes (init-submodules.sh
      # explains which and falls back to the default branch). It wipes
      # third_party/ first, so the libtorch cache is restored only after it
      # has run.
      - uses: actions/checkout@v7
      - run: brew install ninja
      - run: ./init-submodules.sh
      - uses: actions/cache@v5
        with:
          path: third_party/libtorch
          key: libtorch-macos-arm64-${{ env.LIBTORCH_VERSION }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # The instrument acceptance test (tests/instruments/driver.py) runs a training script with torch and the native
      # network sender, so a virtual environment holds a pinned torch, numpy and websockets, and
      # scripts/build_netio.py builds caliper._netio into the checkout with that Python. The pip
      # downloads are cached by the torch pin.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: pip-acceptance-macos-arm64-interp-agent-torch${{ env.ACCEPTANCE_TORCH_VERSION }}-tv0.29.2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-acceptance-macos-arm64-interp-agent-torch${{ env.ACCEPTANCE_TORCH_VERSION }}-
            pip-acceptance-macos-arm64-interp-
      - name: Make the test Python
        run: |
          python3 -m venv "$RUNNER_TEMP/acceptance-py"
          "$RUNNER_TEMP/acceptance-py/bin/pip" install \
            "torch==$ACCEPTANCE_TORCH_VERSION" \
            torchvision==0.29.2 \
            transformers==5.24.0 \
            transformer-lens==3.9.0 \
            sae-lens==6.56.3 \
            nnsight==0.8.4 \
            "circuit-tracer @ git+https://github.com/decoderesearch/circuit-tracer.git@82996f144b3371ae858ea5713590d004c218f0c2" \
            "pydantic-ai-slim[anthropic]>=2.68,<3" \
            "anthropic>=2.8,<3" \
            "openai>=3.51,<4" \
            "agent-client-protocol>=1.0,<2" \
            numpy pyarrow pyyaml anywidget Pillow websockets nanobind "pytest>=8" safetensors psutil datasets jsonschema
          "$RUNNER_TEMP/acceptance-py/bin/python" - <<'PY'
          import os, pathlib, sysconfig
          purelib = pathlib.Path(sysconfig.get_path("purelib"))
          (purelib / "caliper_repo.pth").write_text(
              f"{os.getcwd()}/python\n{os.getcwd()}/src/builder/agent\n",
              encoding="utf-8",
          )
          PY
          "$RUNNER_TEMP/acceptance-py/bin/python" scripts/build_netio.py
          PYTHONPATH=python "$RUNNER_TEMP/acceptance-py/bin/python" -c "import torch, torchvision, circuit_tracer, transformer_lens, sae_lens, pydantic_ai, anthropic, openai, acp.schema, pyarrow.parquet, anywidget, yaml, caliper, caliper._netio, caliper_agent; print('Test Python ready, torch', torch.__version__)"
      # The runtime WGSL compiler (tools/shaders/caliper-wgsl) is built from source in this job
      # (CALIPER_WGSL_FROM_SOURCE=ON below), so the programs of the GPU programs tests compile and run.
      # The hosted macOS image carries a Rust toolchain; nothing is installed or pinned here. Cargo's
      # registry and the crate's target folder are cached by the hash of the crate's lock file.
      - name: Check the Rust toolchain
        run: |
          if ! command -v rustc >/dev/null || ! command -v cargo >/dev/null; then
            echo "::error::The runner image has no Rust toolchain (rustc and cargo), which the WGSL compiler build needs"
            exit 1
          fi
          rustc --version
          cargo --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            cmake-build-release/caliper-wgsl/source/cargo-target
          key: caliper-wgsl-source-macos-arm64-${{ hashFiles('tools/shaders/caliper-wgsl/Cargo.lock') }}
      # slang (SystemVerilog) is vendored but linked by nothing; its submodule pin is not always
      # fetchable, and the fallback is a newer slang that needs C++20, so CI skips configuring it.
      # The Metal backend is Objective-C++, so the OBJC/OBJCXX launchers are set as well.
      # The core build compiles no applets. The caliper_sdk_install test installs
      # the SDK and builds a copy of examples/hello_world in CALIPER_SDK_PROBE_DIR,
      # outside the checkout. The caliper_embed_install test installs the embed
      # package and builds a copy of examples/embed_host against it in
      # CALIPER_EMBED_PROBE_DIR, outside the checkout, then runs the copy in its
      # offscreen mode (Skipped when the runner has no usable GPU).
      - run: >-
          cmake --preset release -DCALIPER_WITH_SLANG=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache
          -DCALIPER_SDK_PROBE_DIR="$RUNNER_TEMP/sdk-probe"
          -DCALIPER_EMBED_PROBE_DIR="$RUNNER_TEMP/embed-probe"
          -DCALIPER_ACCEPTANCE_PYTHON="$RUNNER_TEMP/acceptance-py/bin/python"
          -DCALIPER_BUILDER_TEST_PYTHON="$RUNNER_TEMP/acceptance-py/bin/python"
          -DCALIPER_WGSL_FROM_SOURCE=ON
      - run: cmake --build cmake-build-release --parallel
      # Build the Python extension modules (_producer, _native and _live) in a second folder because
      # CALIPER_BUILD_PYTHON=ON renames caliper_viewer to caliper-viewer for the wheel, whereas the
      # steps below check cmake-build-release binaries by their own names. That folder reuses the
      # WGSL compiler library from cmake-build-release, keeps CALIPER_WITH_BUILDER=ON for the
      # producer sandbox, and copies all three extensions into python/caliper beside caliper._netio.
      # _native and _live allow test_import.py, test_live_session.py (CPU tests) and test_routing.py
      # to run in CI alongside the GPU programs acceptance tests.
      - name: Build and place the Python modules
        run: |
          set -e
          cmake -S . -B cmake-build-python -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCALIPER_WITH_SLANG=OFF -DCALIPER_WITH_TORCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache \
            -DCALIPER_WGSL_LIBRARY="$PWD/cmake-build-release/caliper-wgsl/source/lib/libcaliper_wgsl.a" \
            -DCALIPER_BUILD_PYTHON=ON -DPython_EXECUTABLE="$RUNNER_TEMP/acceptance-py/bin/python"
          cmake --build cmake-build-python --target _producer _native _live --parallel
          for mod in _producer _native _live; do
            built=$(find cmake-build-python/python -maxdepth 2 -name "${mod}*.so" | head -n 1)
            if [ -z "$built" ]; then
              echo "::error::The build made no caliper.${mod} module"
              exit 1
            fi
            cp "$built" python/caliper/
          done
          PYTHONPATH=python "$RUNNER_TEMP/acceptance-py/bin/python" -c "import caliper._producer, caliper._native, caliper._live; print('Python modules ready')"
      # Every binary must say macOS 14.0 as its minimum (cmake/CaliperMacOSTarget.cmake).
      - run: >-
          python3 scripts/check_macos_min.py 14.0
          cmake-build-release/caliper cmake-build-release/caliper_viewer
          cmake-build-release/libcaliper_embed.dylib
      # Cache the torchvision MNIST dataset across runs before CTest and acceptance suites so CI does
      # not depend on a live mirror more than once.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/caliper/mnist
          key: mnist-dataset-v1
      # The GPU suites (gfx, export, embed, torch) skip without a device and
      # report that as Skipped, not Passed. A hosted runner's Metal
      # availability is not guaranteed, so skips are accepted here; a lane
      # that must have a GPU sets CALIPER_REQUIRE_GPU=1 to turn them into
      # failures. builder_agent_py runs in its own step right after with its
      # 900 s timeout so its result is visible and a skip fails the job.
      - run: ctest --test-dir cmake-build-release --output-on-failure --timeout 600 -E '^builder_agent_py$'
      # The caliper-agent pytest suite (src/builder/agent/tests/), including conformance and ACP
      # schema validation. A skip here means CALIPER_BUILDER_TEST_PYTHON was not wired correctly.
      - name: Builder agent Python tests
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/builder-agent-py.log"
          ctest --test-dir cmake-build-release -R '^builder_agent_py$' --output-on-failure -V --timeout 900 | tee "$log"
          if grep -q "builder_agent_py skipped" "$log"; then
            echo "::error::Builder agent Python tests: SKIPPED (CI setup error)"
            exit 1
          fi
      # The instrument acceptance test on its own, so that its result is visible. A skip because the runner has
      # no Metal device is accepted. A skip because torch or the native network sender is missing is a
      # setup error, and so is any other outcome that is neither a pass nor a Metal skip.
      - name: Instrument acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/instrument-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_instrument_acceptance --output-on-failure -V --timeout 300 | tee "$log"
          if grep -q "caliper_instrument_acceptance passed" "$log"; then
            echo "Instrument acceptance: RAN and passed"
          elif grep -q "caliper_instrument_acceptance skipped: .*Metal" "$log"; then
            echo "Instrument acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_instrument_acceptance skipped: torch or the native network sender is missing" "$log"; then
            echo "::error::Instrument acceptance: SKIPPED because torch or the native network sender is missing (CI setup error)"
            exit 1
          else
            echo "::error::Instrument acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # The hosted runs acceptance test on its own. A skip because the runner has no Metal device is
      # accepted. A skip because torch or the native network sender is missing is a setup error, and so
      # is any other outcome that is neither a pass nor a Metal skip.
      - name: Hosted runs acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/hosted-runs-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_hosted_runs_acceptance --output-on-failure -V --timeout 300 | tee "$log"
          if grep -q "caliper_hosted_runs_acceptance passed" "$log"; then
            echo "Hosted runs acceptance: RAN and passed"
          elif grep -q "caliper_hosted_runs_acceptance skipped: .*Metal" "$log"; then
            echo "Hosted runs acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_hosted_runs_acceptance skipped: torch or the native network sender is missing" "$log"; then
            echo "::error::Hosted runs acceptance: SKIPPED because torch or the native network sender is missing (CI setup error)"
            exit 1
          else
            echo "::error::Hosted runs acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # The GPU programs acceptance test on its own. It runs the agent's WGSL programs in a training
      # script, so it needs the compiler library, caliper._producer and caliper._netio, all built above.
      # A skip because the runner has no Metal device is accepted. Any other skip (a missing compiler
      # library, producer module, sender or torch, or a program that is not built) is a setup error,
      # and so is any outcome that is neither a pass nor a Metal skip.
      - name: GPU programs acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/gpu-programs-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_gpu_programs_acceptance --output-on-failure -V --timeout 300 | tee "$log"
          if grep -q "caliper_gpu_programs_acceptance passed" "$log"; then
            echo "GPU programs acceptance: RAN and passed"
          elif grep -qE "caliper_gpu_programs_acceptance skipped: (this machine has no Metal device|the renderer is .*, not Metal)" "$log"; then
            echo "GPU programs acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_gpu_programs_acceptance skipped" "$log"; then
            echo "::error::GPU programs acceptance: SKIPPED for a reason other than a missing Metal device (CI setup error)"
            exit 1
          else
            echo "::error::GPU programs acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # The instrument building acceptance test on its own. It uses both build folders of this job: the app
      # and caliper-mcp of cmake-build-release, and caliper._producer, which cmake-build-python builds with
      # the compiler library of cmake-build-release and the step above copies into python/caliper beside
      # caliper._netio, because the surface operator runs as a program in the training script. A skip
      # because the runner has no Metal device is accepted. Any other skip (a program that is not built,
      # or a missing torch, sender or producer module) is a setup error, and so is any outcome that is
      # neither a pass nor a Metal skip.
      - name: Instrument building acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/instrument-building-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_instrument_building_acceptance --output-on-failure -V --timeout 600 | tee "$log"
          if grep -q "caliper_instrument_building_acceptance passed" "$log"; then
            echo "Instrument building acceptance: RAN and passed"
          elif grep -qE "caliper_instrument_building_acceptance skipped: (this machine has no Metal device|the renderer is .*, not Metal)" "$log"; then
            echo "Instrument building acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_instrument_building_acceptance skipped" "$log"; then
            echo "::error::Instrument building acceptance: SKIPPED for a reason other than a missing Metal device (CI setup error)"
            exit 1
          else
            echo "::error::Instrument building acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # The programmable graphics acceptance test on its own. The agent builds the MNIST probe dashboard from
      # pieces through caliper-mcp on a managed run of examples/mnist/train.py, with the same two build
      # folders as the step above. It picks a digit column, ablates fc1, forks the run from an early step and warns on a
      # draw that is over its time. A skip because the runner has no Metal device is accepted. Any other skip,
      # and any outcome that is neither a pass nor a Metal skip, is a setup error.
      - name: Programmable graphics acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/programmable-graphics-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_programmable_graphics_acceptance --output-on-failure -V --timeout 900 | tee "$log"
          if grep -q "caliper_programmable_graphics_acceptance passed" "$log"; then
            echo "Programmable graphics acceptance: RAN and passed"
          elif grep -qE "caliper_programmable_graphics_acceptance skipped: (this machine has no Metal device|the renderer is .*, not Metal)" "$log"; then
            echo "Programmable graphics acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_programmable_graphics_acceptance skipped" "$log"; then
            echo "::error::Programmable graphics acceptance: SKIPPED for a reason other than a missing Metal device (CI setup error)"
            exit 1
          else
            echo "::error::Programmable graphics acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # The piece path acceptance test on its own: a workspace piece with both halves through the command layer,
      # with the same two build folders as the steps above. A skip because the runner has no Metal device is
      # accepted. Any other skip, and any outcome that is neither a pass nor a Metal skip, is a setup error.
      - name: Piece path acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/piece-path-acceptance.log"
          ctest --test-dir cmake-build-release -R caliper_piece_path_acceptance --output-on-failure -V --timeout 300 | tee "$log"
          if grep -q "caliper_piece_path_acceptance passed" "$log"; then
            echo "Piece path acceptance: RAN and passed"
          elif grep -qE "caliper_piece_path_acceptance skipped: (this machine has no Metal device|the renderer is .*, not Metal)" "$log"; then
            echo "Piece path acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_piece_path_acceptance skipped" "$log"; then
            echo "::error::Piece path acceptance: SKIPPED for a reason other than a missing Metal device (CI setup error)"
            exit 1
          else
            echo "::error::Piece path acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      # Set up Node before the Python tests so npm is on PATH for python/tests/test_assets.py
      # as well as the Playwright draw-parity step below.
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      # Run all python/tests/ suites (rather than an allowlist, so newly added suites run automatically).
      # Every marker excluded below names the suites/cases in python/tests/conftest.py that cannot run
      # on a GPU-less hosted macos-15 runner:
      #   - gpu: offscreen Metal canvas suites (test_image_rgba.py, test_kinds_offscreen.py,
      #     test_ramp_reference.py, test_show_cpu.py, test_show_mps.py, test_window_transport.py),
      #     hidden-app Metal scene suites (test_scene_app.py, test_scene_events.py,
      #     test_scene_pieces_app.py), and the 3 offscreen-canvas cases in test_watch.py. Caliper has
      #     no fallback renderer, so offscreen Metal and hidden-app drawing fail without a Metal device.
      #   - window: test_window_real.py (opens a real GLFW/AppKit window; needs window server + Metal).
      #   - notebook: test_widget.py::test_widget_draws_in_jupyterlab
      #     (requires JupyterLab, ipykernel, Python Playwright Chromium, and WebGPU Metal mode; browser
      #     views and WebAssembly rendering are covered on SwiftShader and Canvas 2D in web.yml).
      #   - timing: test_controls.py::test_a_flood_of_values_from_several_threads (holds 20,000 threaded
      #     requests to a 20 s wall-clock limit that a 3-core hosted runner does not reliably meet).
      # Within the remaining 35 suites, individual MPS device cases, the 2 Metal viewer cases of
      # test_live_session.py, test_assets.py::test_the_package_ships_the_wasm_views (enforced in web.yml),
      # and the CALIPER_WATCH_TIMING benchmark in test_watch.py skip with explicit reasons on a GPU-less runner.
      - name: Python tests of Caliper LIB
        env:
          PYTHONPATH: python
          CALIPER_AGENT_OFFLINE: '1'
          CALIPER_TEST_NO_WINDOW: '1'
          CALIPER_TEST_CALIPER_EXE: ${{ github.workspace }}/cmake-build-release/caliper
          CALIPER_VIEWER: ${{ github.workspace }}/cmake-build-release/caliper_viewer
        run: >-
          "$RUNNER_TEMP/acceptance-py/bin/python" -m pytest -q -rs -p no:cacheprovider
          python/tests -m "not gpu and not window and not notebook and not timing" --strict-markers
      # Canonical MNIST example check: run --mode none for 20 steps (fewer than the published 14 epochs
      # for CI speed on a GPU-less hosted runner) and check that the printed result is finite and
      # improves over 10-class uniform random chance (loss < ln(10), accuracy > 10%).
      - name: Canonical MNIST example
        env:
          PYTHONPATH: python
          CALIPER_DATA_DIR: ${{ runner.temp }}/mnist-example-data
        run: |
          set -euo pipefail
          mkdir -p "$CALIPER_DATA_DIR"
          log="$RUNNER_TEMP/mnist-example.log"
          CALIPER_MNIST_DATA_DIR="$HOME/.cache/caliper/mnist" \
            "$RUNNER_TEMP/acceptance-py/bin/python" examples/mnist/train.py --mode none --steps 20 | tee "$log"
          "$RUNNER_TEMP/acceptance-py/bin/python" - "$log" <<'PY'
          import math, re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          m = re.search(
              r"done\s+steps=(\d+)\s+elapsed=([0-9.]+)s\s+rate=([0-9.]+)\s+steps/s\s+"
              r"train_loss=([0-9.eE+-]+)\s+test_loss=([0-9.eE+-]+)\s+test_acc=([0-9.]+)%",
              text,
          )
          assert m is not None, f"missing summary line in output:\n{text}"
          steps = int(m.group(1))
          train_loss = float(m.group(4))
          test_loss = float(m.group(5))
          test_acc = float(m.group(6))
          chance_loss = math.log(10.0)
          assert steps == 20, f"expected 20 steps, got {steps}"
          assert math.isfinite(train_loss) and train_loss < chance_loss, f"bad train_loss {train_loss}"
          assert math.isfinite(test_loss) and test_loss < chance_loss, f"bad test_loss {test_loss}"
          assert math.isfinite(test_acc) and test_acc > 10.0, f"test_acc {test_acc}% did not beat 10% chance"
          print(f"MNIST CI check passed: steps={steps}, test_loss={test_loss:.4f}, test_acc={test_acc:.2f}%")
          PY
      # MNIST agent instrument and filter intervention acceptance test through caliper-mcp.
      # A skip because the runner has no Metal device is accepted. Any other skip, and any
      # outcome that is neither a pass nor a Metal skip, is a setup error.
      - name: MNIST agent instrument acceptance test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/mnist-agent-acceptance.log"
          CALIPER_MNIST_DATA_DIR="$HOME/.cache/caliper/mnist" \
            ctest --test-dir cmake-build-release -R caliper_mnist_agent_acceptance --output-on-failure -V --timeout 300 | tee "$log"
          if grep -q "caliper_mnist_agent_acceptance passed" "$log"; then
            echo "MNIST agent instrument acceptance: RAN and passed"
          elif grep -qE "caliper_mnist_agent_acceptance skipped: (this machine has no Metal device|the renderer is .*, not Metal)" "$log"; then
            echo "MNIST agent instrument acceptance: SKIPPED because the runner has no Metal device"
          elif grep -q "caliper_mnist_agent_acceptance skipped" "$log"; then
            echo "::error::MNIST agent instrument acceptance: SKIPPED for a reason other than a missing Metal device (CI setup error)"
            exit 1
          else
            echo "::error::MNIST agent instrument acceptance: neither passed nor skipped for lack of Metal"
            exit 1
          fi
      - name: Native Interpretation Capability
        env:
          CALIPER_AGENT_OFFLINE: '1'
          CALIPER_SESSION: '0'
          CALIPER_TEST_NO_WINDOW: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONPATH: python
        run: |
          "$RUNNER_TEMP/acceptance-py/bin/python" -c "import caliper._netio"
          "$RUNNER_TEMP/acceptance-py/bin/python" -m pytest -q -p no:cacheprovider tests/interp/test_native_capability.py
      - name: Interpretation Command Sidecar
        env:
          CALIPER_AGENT_OFFLINE: '1'
          CALIPER_TEST_RUN: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
          CALIPER_DATA_DIR: ${{ runner.temp }}/interpretation-sidecar/data
          TMPDIR: ${{ runner.temp }}/interpretation-sidecar/temp
          CALIPER_INTERPRET_HOST: ${{ github.workspace }}/cmake-build-release/caliper_interpret_command_host
          CALIPER_MCP_EXE: ${{ github.workspace }}/cmake-build-release/src/builder/mcp/caliper-mcp
          PYTHONPATH: python
          OMP_NUM_THREADS: '2'
          VECLIB_MAXIMUM_THREADS: '2'
        run: |
          mkdir -p "$TMPDIR" "$CALIPER_DATA_DIR"
          test -x "$CALIPER_INTERPRET_HOST"
          test -x "$CALIPER_MCP_EXE"
          "$RUNNER_TEMP/acceptance-py/bin/python" -m pytest -q -p no:cacheprovider tests/interp/test_command_sidecar.py
      # The pixel comparison of programmable graphics: the app's draw runtime on Metal and the browser
      # module's on WebGPU draw the same fixture of pieces (tests/draw_parity/), and
      # web/test/draw_parity.spec.ts compares the color and ID targets within the plan's tolerances.
      # The app's side writes the fixture and, with a Metal device, its pictures. A skip because the
      # runner has no Metal device is accepted: the browser then draws the fixture on its own and checks
      # its refusals, and the comparison reports that it was skipped for that reason. Any other outcome
      # of the app's side is an error. The browser also draws the fixture over a live connection from
      # tests/draw_parity/serve_fixture.py, with the acceptance Python. The module is built here with
      # the pinned Emscripten into a folder of its own; a failed module build fails the step before any
      # browser runs.
      - id: emscripten-pin
        run: echo "emscripten=$(cat web/wasm/emscripten-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.emscripten-pin.outputs.emscripten }}
      - name: Pixel comparison of the app and the browser module
        env:
          EMSCRIPTEN_VERSION: ${{ steps.emscripten-pin.outputs.emscripten }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/draw-parity"
          set +e
          cmake-build-release/caliper_draw_parity_app "$out" | tee "$RUNNER_TEMP/draw-parity-app.log"
          app=$?
          set -e
          if [ "$app" -eq 0 ]; then
            echo "Draw parity, app side: drew the fixture on Metal"
          elif [ "$app" -eq 77 ] && grep -q "skipped: no Metal device" "$RUNNER_TEMP/draw-parity-app.log"; then
            echo "Draw parity, app side: SKIPPED because the runner has no Metal device; the browser side runs alone"
          else
            echo "::error::Draw parity, app side: exit $app, neither drawn nor skipped for lack of Metal"
            exit 1
          fi
          test -s "$out/frames.bin" && test -s "$out/plan.json"
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
          rm -rf "$RUNNER_TEMP/draw-parity-views"
          EMSDK="$HOME/emsdk" python3 scripts/build_wasm.py --build-dir "$RUNNER_TEMP/draw-parity-wasm" \
            --out "$RUNNER_TEMP/draw-parity-views"
          cd web
          npm ci
          node build.mjs
          npx playwright install chromium-headless-shell
          log="$RUNNER_TEMP/draw-parity-browser.log"
          # CTest exports the interpretation fixtures before this browser step.
          if [ "$app" -eq 0 ]; then export CALIPER_REQUIRE_INTERP_PIECES=1; fi
          CALIPER_WASM_DIR="$RUNNER_TEMP/draw-parity-views" CALIPER_DRAW_PARITY_DIR="$out" \
          CALIPER_DRAW_PARITY_CAPTURES="$RUNNER_TEMP/draw-parity-captures" \
          CALIPER_PYTHON="$RUNNER_TEMP/acceptance-py/bin/python" \
            npx playwright test --project=swiftshader --reporter=list test/draw_parity.spec.ts test/interp_pieces.spec.ts | tee "$log"
          grep -q "draw parity: ok" "$log"
          grep -q "live tower:" "$log"
          if [ "$app" -eq 0 ]; then
            grep -q "head_pattern: interior" "$log"
            grep -q "tower_arcs: interior" "$log"
            echo "Draw parity: RAN, compared and passed"
          else
            grep -q "comparison skipped: no Metal device" "$log"
            echo "Draw parity: the browser side RAN and passed; the comparison SKIPPED because the runner has no Metal device"
          fi
          # The whole MNIST probe dashboard, app against the browser's spec page, on the recording in
          # tests/draw_parity/dashboard: the app's spec runtime on Metal, the page with the module just built.
          cd ..
          dash="$RUNNER_TEMP/dashboard-parity"
          set +e
          cmake-build-release/caliper_dashboard_parity_app tests/draw_parity/dashboard tests/draw_parity/pieces "$dash" \
            | tee "$RUNNER_TEMP/dashboard-parity-app.log"
          dapp=$?
          set -e
          if [ "$dapp" -eq 0 ]; then
            echo "Dashboard parity, app side: drew the recording on Metal"
          elif [ "$dapp" -eq 77 ] && grep -q "skipped: no Metal device" "$RUNNER_TEMP/dashboard-parity-app.log"; then
            echo "Dashboard parity, app side: SKIPPED because the runner has no Metal device; the browser side runs alone"
          else
            echo "::error::Dashboard parity, app side: exit $dapp, neither drawn nor skipped for lack of Metal"
            exit 1
          fi
          cd web
          dlog="$RUNNER_TEMP/dashboard-parity-browser.log"
          CALIPER_WASM_DIR="$RUNNER_TEMP/draw-parity-views" CALIPER_DASHBOARD_PARITY_DIR="$dash" \
          CALIPER_DRAW_PARITY_CAPTURES="$RUNNER_TEMP/draw-parity-captures" \
            npx playwright test --project=swiftshader --reporter=list test/draw_parity_dashboard.spec.ts | tee "$dlog"
          grep -q "1 passed" "$dlog"
          if [ "$dapp" -eq 0 ]; then
            grep -q "dashboard: interior" "$dlog"
            echo "Dashboard parity: RAN, compared and passed"
          else
            grep -q "dashboard: comparison skipped: no Metal device" "$dlog"
            echo "Dashboard parity: the browser side RAN and passed; the comparison SKIPPED because the runner has no Metal device"
          fi
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-draw-parity
          path: |
            ${{ runner.temp }}/draw-parity
            ${{ runner.temp }}/draw-parity-captures
            ${{ runner.temp }}/draw-parity-*.log
            ${{ runner.temp }}/dashboard-parity/app
            ${{ runner.temp }}/dashboard-parity-*.log
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-ctest-log
          path: cmake-build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      # Install the SDK and build hello_world and the MNIST applet against it
      # in their own build folders, as a developer outside this repository would.
      - run: scripts/build_applets_against_sdk.sh cmake-build-release "$RUNNER_TEMP/applets"
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # What was built against the installed packages carries their minimum
      # macOS too: the applets above, and the copies of examples/hello_world and
      # examples/embed_host that the install tests built.
      - run: >-
          python3 scripts/check_macos_min.py 14.0
          "$RUNNER_TEMP"/applets/build/*/applets/*.dylib
          "$RUNNER_TEMP/sdk-probe/hello_world-build/applets/libhello_world.dylib"
          "$RUNNER_TEMP/embed-probe/embed_host-build/embed_host"
      # The host must name no applet: no applet id, name or window title may
      # appear as a string literal in src/ or include/.
      - run: python3 scripts/check_host_names_no_applet.py
      # The theme reads its colours from the design tokens and holds no raw colour.
      - run: python3 scripts/check_theme_colors.py
      - if: always()
        run: sccache --show-stats

  windows:
    # CPU-only: USE_CUDA falls back when no toolkit is found (CMakeLists.txt
    # "USE_CUDA is ON but no CUDA toolkit found"), libtorch comes as the CPU
    # zip, and Vulkan through volk (no SDK) with glslang fetched and built
    # in-tree. DuckDB from source under MSVC is slow, hence the longer timeout.
    # A Windows failure fails the run, as a macOS one does.
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja -y --no-progress
      - run: ./init-submodules.sh
      - uses: actions/cache@v5
        with:
          path: third_party/libtorch-release
          key: libtorch-win-cpu-${{ env.LIBTORCH_VERSION }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      # slang (SystemVerilog) is vendored but linked by nothing; its submodule pin is not always
      # fetchable, and the fallback is a newer slang that needs C++20, so CI skips configuring it.
      # sccache cannot cache MSVC compiles that write a PDB (/Zi). Release builds have no /Zi
      # (CMP0141 is NEW, so debug info is only requested for Debug and RelWithDebInfo).
      # It cannot cache precompiled-header compiles (/Yc, /Yu /Fp) either; glslang's
      # MachineIndependent target is the only one using them, so PCH is switched off here.
      # The SDK and embed install tests work outside the checkout, as on macOS.
      - run: >-
          cmake --preset release -DCALIPER_WITH_SLANG=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          -DCALIPER_SDK_PROBE_DIR="$(cygpath -m "$RUNNER_TEMP")/sdk-probe"
          -DCALIPER_EMBED_PROBE_DIR="$(cygpath -m "$RUNNER_TEMP")/embed-probe"
      - run: cmake --build cmake-build-release --parallel
      - run: ctest --test-dir cmake-build-release --output-on-failure --timeout 600
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-ctest-log
          path: cmake-build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      # Build hello_world and the MNIST applet against the installed SDK, as on macOS.
      - run: >-
          scripts/build_applets_against_sdk.sh cmake-build-release
          "$(cygpath -m "$RUNNER_TEMP")/applets"
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # The host must name no applet, checked here as on macOS. The runner's
      # Python is `python`; `python3` is not on PATH in every Windows image.
      - run: python scripts/check_host_names_no_applet.py
      - run: python scripts/check_theme_colors.py
      - if: always()
        run: sccache --show-stats
