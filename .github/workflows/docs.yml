# .github/workflows/docs.yml
name: Docs
on:
  pull_request:
    # The docs site, the design pages, their theme and MkDocs configs
    # (design/mkdocs.yml is under design/), the sources the docs embed as
    # snippets, the docstrings and headers the API reference is built from,
    # and the command table, piece definitions, and root docs checked here.
    paths: ['docs/**', 'design/**', 'docs-theme/**', 'mkdocs.yml',
            'sdk/include/**', 'include/caliper/**', 'python/caliper/**', 'examples/**', 'roadmap/**',
            'candidates/**', 'pyproject.toml', 'CONTRIBUTING.md', 'README.md',
            'src/builder/commands/command_table.json',
            'src/builder/include/caliper_builder/spec/piece.h',
            'src/builder/include/caliper_builder/programs/pieces.h',
            'src/builder/programs/piece_checks.cpp',
            'src/builder/spec/schema/caliper-spec-v1.schema.json',
            'src/host/host_cli.h',
            'scripts/check_api_reference.py', 'scripts/test_check_api_reference.py',
            'scripts/generate_mcp_reference.py',
            'scripts/generate_piece_reference.py', 'scripts/check_doc_references.py',
            'scripts/test_doc_generators.py', 'scripts/test_check_doc_references.py',
            '.github/pull_request_template.md', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Builds the docs site and the design pages with --strict, so a broken link,
  # anchor or snippet fails the pull request. Nothing is published here; the
  # Deploy Pages workflow publishes the docs site from main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The versions are pinned in [project.optional-dependencies].docs in pyproject.toml, which a
      # local build reads too. The design build also depends on MkDocs accepting design/mkdocs.yml
      # inside its own docs folder when the file is named by a relative path, as here.
      - name: Install documentation dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["optional-dependencies"]["docs"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *deps])
          PY
      # Validates the roadmap registry, its coverage ledger and the candidates against their schemas
      # and rules.
      - run: sternbild-docs check-roadmap
      # Fails on docs headings that break the title rule (Title Case, no leading article or Your,
      # no colon, no question).
      - run: sternbild-docs check-headings
      # Fails when a name of caliper.__all__, caliper.live.__all__ or caliper.interp.__all__ has no
      # docstring or no ::: directive, or when a service table entry or an embed, live or live_views
      # function has no doc comment or no generated table.
      - run: python scripts/check_api_reference.py
      # Fails when any generated reference page drifts from its source definitions.
      - run: python scripts/generate_mcp_reference.py --check
      - run: python scripts/generate_piece_reference.py --check
      # Fails on broken links/anchors, stale repository paths, or unknown commands, CLI subcommands,
      # or Python symbols across docs, CONTRIBUTING.md and README.md.
      - run: python scripts/check_doc_references.py
      - run: python -m unittest scripts/test_check_api_reference.py scripts/test_doc_generators.py scripts/test_check_doc_references.py -v
      - run: mkdocs build --strict
      - run: mkdocs build --strict -f design/mkdocs.yml
