# .github/workflows/docs.yml
name: Docs
on:
  pull_request:
    # The docs site, the design pages, their theme and MkDocs configs
    # (design/mkdocs.yml is under design/), the sources the docs embed as
    # snippets, and the docstrings and headers the API reference is built from.
    paths: ['docs/**', 'design/**', 'docs-theme/**', 'mkdocs.yml',
            'sdk/include/**', 'include/caliper/**', 'python/caliper/**', 'examples/**', 'roadmap/**',
            'candidates/**', 'requirements-docs.txt',
            'scripts/check_api_reference.py', 'scripts/test_check_api_reference.py',
            '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Builds the docs site and the design pages with --strict, so a broken link,
  # anchor or snippet fails the pull request. Nothing is published here; the
  # Deploy Pages workflow publishes the docs site from main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The versions are pinned in requirements-docs.txt, which a local build reads too. The design
      # build also depends on MkDocs accepting design/mkdocs.yml inside its own docs folder when the
      # file is named by a relative path, as here.
      - run: pip install -r requirements-docs.txt
      # Validates the roadmap registry, its coverage ledger and the candidates against their schemas
      # and rules.
      - run: sternbild-docs check-roadmap
      # Fails on docs headings that break the title rule (Title Case, no leading article or Your,
      # no colon, no question).
      - run: sternbild-docs check-headings
      # Fails when a name of caliper.__all__ or caliper.live.__all__ has no
      # docstring or no ::: directive, or when a service table entry or an embed,
      # live or live_views function has no doc comment or no generated table,
      # and tests the check and the header parser of docs-theme/hooks/c_reference.py.
      - run: python scripts/check_api_reference.py
      - run: python -m unittest scripts/test_check_api_reference.py -v
      - run: mkdocs build --strict
      - run: mkdocs build --strict -f design/mkdocs.yml
