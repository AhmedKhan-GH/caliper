[instrument]
id      = "dev.caliper.mnist"
name    = "MNIST Example"
version = "0.1.0"
summary = "Canonical ML instrument: the PyTorch C++ MNIST CNN trained live with LibTorch."
tag     = "Demo"

[compat]
abi_epoch = 4
min_host  = "0.6.0"

[services]
required = ["caliper.ui.v1", "caliper.log.v1", "caliper.jobs.v1", "caliper.device.v1"]
optional = ["caliper.tensor_bridge.v1", "caliper.metrics.v1"]
