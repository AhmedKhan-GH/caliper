<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caliper web viewer spike</title>
<style>
  html, body { margin: 0; padding: 0; background: #101014; overflow: hidden; }
  canvas { display: block; width: 1280px; height: 800px; }
  #status { position: absolute; left: 8px; top: 808px; color: #ccc; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="canvas" width="1280" height="800" tabindex="-1"></canvas>
<div id="status">loading</div>
<script>
  // The module publishes its state to globalThis.caliperSpike (frames, timing,
  // the colormap check); this page only reports whether WebGPU exists.
  const status = document.getElementById('status');
  globalThis.caliperSpikeLog = [];
  if (!navigator.gpu) status.textContent = 'navigator.gpu is missing: this browser has no WebGPU';
  var Module = {
    canvas: document.getElementById('canvas'),
    print: (t) => { globalThis.caliperSpikeLog.push(t); console.log(t); },
    printErr: (t) => { globalThis.caliperSpikeLog.push(t); console.error(t); },
    onRuntimeInitialized: () => { status.textContent = 'runtime initialised'; },
  };
</script>
<script async src="caliper_web_spike.js"></script>
</body>
</html>
