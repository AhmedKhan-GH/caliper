    origin: field
    depends_on: [RUN-05]
  - key: seismic-gathers
    title: "Seismic Gathers"
    summary: "Shows seismic traces as wiggle or image displays with offset and time axes."
    serves: "Helps inspect data and outputs of learned seismic inversion."
    origin: field
    depends_on: []
  - key: seismic-volume-and-horizons
    title: "Seismic Volumes and Horizons"
    summary: "Shows seismic volumes with slices and interpreted horizons as surfaces."
    serves: "Helps inspect learned interpretation models."
    origin: field
    depends_on: [REN-26, REN-28]
  - key: satellite-band-composites
    title: "Satellite Band Composites"
    summary: "Builds true-colour and false-colour images and band indices from multispectral bands with stretches."
    serves: "Helps inspect inputs and outputs of remote-sensing models."
    origin: field
    depends_on: [REN-38]
  - key: sky-map-view
    title: "Sky Map View"
    summary: "Shows images and catalogues on the celestial sphere with coordinate grids and projections."
    serves: "Helps inspect detections and survey products."
    origin: field
    depends_on: []
  - key: healpix-maps
    title: "Spherical Pixel Maps"
    summary: "Shows maps stored on equal-area spherical pixelisations as full-sky projections."
    serves: "Helps inspect cosmic microwave and survey maps."
    origin: field
    depends_on: []
  - key: n-body-view
    title: "N-Body View"
    summary: "Plays particle simulations of galaxies and halos with density colouring, trails and energy monitors."
    serves: "Helps check learned gravity emulators."
