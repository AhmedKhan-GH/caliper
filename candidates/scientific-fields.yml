    origin: field
    depends_on: []
  - key: gravitational-wave-spectrogram
    title: "Strain Time-Frequency View"
    summary: "Shows detector strain as a spectrogram with template overlays."
    serves: "Helps inspect signals and learned detectors."
    origin: field
    depends_on: []
  - key: event-display
    title: "Collision Event Display"
    summary: "Draws tracks, calorimeter deposits and jets of a detector event in three dimensions."
