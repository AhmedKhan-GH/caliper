    origin: field
    depends_on: []
  - key: light-curves
    title: "Light Curves"
    summary: "Shows photometric time series with errors, phase folding and period search."
    serves: "Helps inspect classification of variable sources."
    origin: field
    depends_on: []
  - key: power-spectrum-view
    title: "Power Spectra"
    summary: "Computes and plots power spectra of series and fields with error bands and fits."
