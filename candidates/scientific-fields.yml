# yaml-language-server: $schema=schema.json
pillar: SCI
title: Scientific Fields
proposed: true
description: "This pillar holds views by field: fluids, operator learning, molecules, materials, climate, astronomy, particle and plasma physics, neuroscience, genomics, quantum, dynamics, control, signals, Bayesian inference, hardware design."
alternative: "Scientific fields could be kept out of the registry entirely as a catalogue of applets to build on the platform, since most entries are applets and not platform features."
candidates:
  - key: internals-beside-lab-data
    title: "Model Internals Beside Laboratory Data"
    summary: "A biological model's activations are shown beside the laboratory measurements they are meant to explain."
    serves: "A scientist checks whether what a model represents matches what an assay measured."
    origin: plan-idea
    depends_on: [INT-05]
  - key: fluid-streamlines
    title: "Streamline View"
    summary: "Traces curves tangent to a vector field from seed points and draws them as coloured ribbons or tubes."
    serves: "Helps researchers see flow structure in solver output and learned flow models."
    origin: field
    depends_on: [REN-71, REN-30]
  - key: fluid-pathlines-streaklines
    title: "Pathlines and Streaklines"
    summary: "Traces particles through time-varying fields to draw pathlines and streaklines."
    serves: "Helps study unsteady flow where streamlines mislead."
    origin: field
    depends_on: [REN-71, STR-13]
  - key: vorticity-q-criterion
    title: "Vorticity and Q-Criterion Fields"
    summary: "Computes vorticity, helicity, Q and lambda-2 from a velocity field on the GPU and shows them as fields or surfaces."
    serves: "Helps find vortices in solver output and in model predictions."
    origin: field
    depends_on: [REN-27, REN-71]
  - key: lic-view
    title: "Line Integral Convolution"
    summary: "Renders a texture that smears noise along a vector field to show direction densely on a plane or surface."
    serves: "Helps compare predicted and true flow patterns in two dimensions."
    origin: field
    depends_on: [REN-71, REN-38]
  - key: unstructured-mesh-fields
    title: "Unstructured Mesh Fields"
    summary: "Shows cell and vertex fields on triangle, tetrahedron and mixed meshes with clipped and cut views."
    serves: "Helps inspect results of finite-element and finite-volume solvers and mesh-based networks."
    origin: field
    depends_on: [REN-73, REN-26]
  - key: adaptive-mesh-refinement
    title: "Adaptive Mesh Refinement View"
    summary: "Shows nested refinement levels of block-structured grids with level outlines and per-level fields."
    serves: "Helps follow where a solver or a learned refiner spends resolution."
    origin: field
    depends_on: [REN-70]
  - key: point-line-probes
    title: "Probes Along Lines and at Points"
    summary: "Samples fields at chosen points and along lines and plots the values over time or distance."
    serves: "Helps compare solver, measurement and model at the same locations."
    origin: field
    depends_on: [REN-26, REN-70]
  - key: solver-residual-monitor
    title: "Solver Residual Monitor"
    summary: "Plots residuals of each equation and each iteration live, with convergence limits and stall warnings."
    serves: "Helps tell a converging solver from a stalled one during long runs."
    origin: field
    depends_on: [STR-04]
  - key: wall-quantities
    title: "Wall Quantities"
    summary: "Shows wall shear, pressure coefficient and y-plus on surfaces and as curves along them."
    serves: "Helps judge boundary-layer accuracy of solvers and learned surrogates."
    origin: field
    depends_on: [REN-73]
  - key: deforming-mesh-view
    title: "Deforming Meshes"
    summary: "Plays meshes whose vertices move each step, such as moving bodies and free surfaces, with quality metrics."
    serves: "Helps check mesh quality in fluid-structure and moving-boundary runs."
    origin: field
    depends_on: [REN-73, STR-13]
  - key: insitu-solver-adaptor
    title: "In-Situ Adaptor for Running Solvers"
    summary: "Lets a running solver hand its fields to the viewer through shared memory or a socket without writing files."
    serves: "Helps watch and steer large simulations live."
    origin: field
    depends_on: [STR-24, STR-03]
  - key: turbulence-statistics
    title: "Turbulence Statistics Panel"
    summary: "Computes energy spectra, structure functions and Reynolds stress profiles from fields."
    serves: "Helps check whether a learned model keeps the statistics of turbulence."
    origin: field
    depends_on: [REN-70]
  - key: particle-tracer-gpu
    title: "Lagrangian Particle Tracer"
    summary: "Advects millions of passive particles through a field on the GPU and colours them by age or origin."
    serves: "Helps visualise mixing and transport."
    origin: field
    depends_on: [REN-71, REN-32]
  - key: pde-residual-map
    title: "PDE Residual Map"
    summary: "Shows the residual of a governing equation evaluated on a predicted field as a map."
    serves: "Helps find where a physics-informed model violates its own equation."
    origin: field
    depends_on: [REN-70]
  - key: collocation-points-view
    title: "Collocation Points View"
    summary: "Shows training collocation points over the domain with residual colouring and resampling history."
    serves: "Helps tune adaptive sampling in physics-informed training."
    origin: field
    depends_on: [REN-32]
  - key: linked-reference-prediction-error
    title: "Reference, Prediction and Error Fields"
    summary: "Shows the true field, the prediction and the error as three views with one shared camera, scale and cursor."
    serves: "Helps judge surrogate models at a glance."
    origin: field
    depends_on: [RUN-07, RUN-08]
  - key: error-spectrum-view
    title: "Error Spectrum"
    summary: "Shows the error of a predicted field by spatial frequency band."
    serves: "Helps find that a model misses high frequencies."
    origin: field
    depends_on: [REN-70]
  - key: rollout-drift-view
    title: "Rollout Drift"
    summary: "Shows error against rollout step for autoregressive surrogates with the field at chosen steps."
    serves: "Helps see when a learned time stepper goes unstable."
    origin: field
    depends_on: [STR-13]
  - key: conservation-monitor
    title: "Conservation Monitor"
    summary: "Plots mass, momentum, energy and other invariants of a predicted run against the reference."
    serves: "Helps see whether a model respects the physics it should."
    origin: field
    depends_on: [STR-04]
  - key: boundary-condition-overlay
    title: "Boundary Condition Overlay"
    summary: "Draws boundary and initial conditions on the domain and the error of a prediction at them."
    serves: "Helps find where boundary handling fails."
    origin: field
    depends_on: [REN-70]
  - key: learned-mode-viewer
    title: "Learned Mode Viewer"
    summary: "Shows the basis functions or modes a neural operator learned and their weight for a given input."
    serves: "Helps explain what an operator uses to represent a solution."
    origin: field
    depends_on: [REN-70]
  - key: parametric-solution-explorer
    title: "Parametric Solution Explorer"
    summary: "Lets a reader change equation parameters with sliders and see the predicted solution update beside the solver result."
    serves: "Helps judge a surrogate across its parameter space."
    origin: field
    depends_on: [STR-03, REN-70]
  - key: ensemble-surrogate-bands
    title: "Surrogate Ensemble Bands"
    summary: "Shows the spread of an ensemble of surrogate models over a field or a curve."
    serves: "Helps see where a surrogate is unsure."
    origin: field
    depends_on: []
  - key: trajectory-player
    title: "Molecular Trajectory Player"
    summary: "Plays molecular dynamics frames with a scrubber, loops, smoothing and per-frame data."
    serves: "Helps inspect simulations and generated conformations."
    origin: field
    depends_on: [STR-13, REN-12]
  - key: cartoon-representation
    title: "Cartoon Representation"
    summary: "Draws protein backbones as ribbons, helices and sheets from secondary structure."
    serves: "Helps read a fold at a glance."
    origin: field
    depends_on: [REN-30]
  - key: surface-representation
    title: "Molecular Surfaces"
    summary: "Draws solvent-accessible and solvent-excluded surfaces with electrostatic or property colouring."
    serves: "Helps study binding sites and interfaces."
    origin: field
    depends_on: [REN-27]
  - key: confidence-colouring
    title: "Confidence Colouring"
    summary: "Colours a structure by per-residue confidence from a structure predictor and shows the predicted error between residue pairs."
    serves: "Helps judge which parts of a prediction to trust."
    origin: field
    depends_on: [REN-14]
  - key: pair-error-matrix
    title: "Pair-Error Matrix"
    summary: "Shows the predicted aligned error between all residue pairs as a matrix linked to the structure."
    serves: "Helps find domains and uncertain relative placements."
    origin: field
    depends_on: []
  - key: contact-map
    title: "Contact Map"
    summary: "Shows residue-residue distances or contacts as a matrix linked to the structure."
    serves: "Helps compare predicted and true folds and co-evolution signals."
    origin: field
    depends_on: []
  - key: superposition-rmsd
    title: "Superposition and RMSD"
    summary: "Aligns structures, draws them overlaid and plots per-residue and global deviation."
    serves: "Helps measure how well a model reproduces an experimental structure."
    origin: field
    depends_on: [REN-12]
  - key: docking-pose-browser
    title: "Docking Pose Browser"
    summary: "Lists ligand poses with scores and opens them in the pocket with interactions drawn."
    serves: "Helps compare poses from docking and generative models."
    origin: field
    depends_on: [REN-12]
  - key: orbital-density-isosurfaces
    title: "Orbital and Density Isosurfaces"
    summary: "Draws isosurfaces of orbitals, electron density and electrostatic potential on a molecule."
    serves: "Helps study outputs of quantum chemistry and learned densities."
    origin: field
    depends_on: [REN-27]
  - key: free-energy-landscape
    title: "Free-Energy Landscape"
    summary: "Shows free energy over one or two collective variables as a surface or contour map with sampled paths."
    serves: "Helps read results of enhanced-sampling runs and learned potentials."
    origin: field
    depends_on: []
  - key: collective-variables-view
    title: "Collective Variable Plots"
    summary: "Plots distances, angles, dihedrals and learned variables over a trajectory."
    serves: "Helps pick variables that separate states."
    origin: field
    depends_on: [STR-13]
  - key: ramachandran-plot
    title: "Ramachandran Plot"
    summary: "Plots backbone dihedral pairs with allowed regions and links points to residues in the structure."
    serves: "Helps check the plausibility of predicted and generated proteins."
    origin: field
    depends_on: []
  - key: radial-distribution-function
    title: "Radial Distribution Function"
    summary: "Computes and plots pair distribution functions from frames with live updating."
    serves: "Helps compare simulated and measured liquid structure."
    origin: field
    depends_on: []
  - key: force-error-display
    title: "Force Error Display"
    summary: "Draws predicted and reference forces as arrows on each atom with the error per atom."
    serves: "Helps find where a learned potential fails."
    origin: field
    depends_on: [REN-37]
  - key: md-stability-monitor
    title: "Simulation Stability Monitor"
    summary: "Plots temperature, energy drift and bond lengths live during a run of a learned potential."
    serves: "Helps stop unstable simulations early."
    origin: field
    depends_on: [STR-04]
  - key: sequence-alignment-viewer
    title: "Sequence Alignment Viewer"
    summary: "Shows aligned sequences with conservation and links columns to structure positions."
    serves: "Helps connect language-model embeddings and structure predictions to evolution."
    origin: field
    depends_on: []
  - key: molecule-gallery
    title: "Molecule Gallery"
    summary: "Shows many molecules as 2-D drawings or 3-D thumbnails with properties and filters."
    serves: "Helps review the outputs of generative chemistry models."
    origin: field
    depends_on: []
  - key: reaction-pathway-view
    title: "Reaction Pathway View"
    summary: "Shows reactant, transition state and product with the energy profile along the path."
    serves: "Helps check learned reaction-path models."
    origin: field
    depends_on: []
  - key: crystal-structure-view
    title: "Crystal Structure View"
    summary: "Draws unit cells, supercells, bonds and coordination polyhedra from structure files."
    serves: "Helps inspect materials proposed by generative models."
    origin: field
    depends_on: [REN-21]
  - key: band-structure-view
    title: "Band Structure"
    summary: "Plots electronic bands along a path of high-symmetry points with the gap marked."
    serves: "Helps compare predicted and computed electronic structure."
    origin: field
    depends_on: []
  - key: phonon-view
    title: "Phonon Dispersion and Modes"
    summary: "Plots phonon bands and animates the displacement pattern of a chosen mode on the crystal."
    serves: "Helps check learned force fields against vibrational data."
    origin: field
    depends_on: [STR-13]
  - key: brillouin-zone-view
    title: "Brillouin Zone View"
    summary: "Draws the first Brillouin zone with its special points and the sampled path."
    serves: "Helps relate band plots to reciprocal space."
    origin: field
    depends_on: [REN-12]
  - key: diffraction-pattern
    title: "Diffraction Pattern View"
    summary: "Simulates and shows powder and single-crystal diffraction patterns beside measured ones."
    serves: "Helps match generated structures to measurements."
    origin: field
    depends_on: []
  - key: microstructure-view
    title: "Microstructure View"
    summary: "Shows grains, phases and orientation maps of segmented or simulated microstructures."
    serves: "Helps study phase-field simulations and learned microstructure models."
    origin: field
    depends_on: [REN-70]
  - key: convex-hull-view
    title: "Convex Hull of Formation Energies"
    summary: "Plots formation energy against composition with the hull and the distance above it for each candidate."
    serves: "Helps judge stability of generated materials."
    origin: field
    depends_on: []
  - key: materials-property-map
    title: "Materials Property Map"
    summary: "Shows candidate materials in a map of properties with structure thumbnails and filters."
    serves: "Helps screen the output of materials models."
    origin: field
    depends_on: []
  - key: globe-view
    title: "Globe View"
    summary: "Shows fields and points on a rotating sphere with graticule and light."
    serves: "Helps view global weather and climate fields without distortion."
    origin: field
    depends_on: [REN-12]
  - key: map-projections
    title: "Map Projections"
    summary: "Offers common map projections for gridded fields and switches between them."
    serves: "Helps compare fields in the projection a paper or model uses."
    origin: field
    depends_on: []
  - key: coastlines-and-borders
    title: "Coastlines and Boundaries"
    summary: "Draws coastlines, rivers and boundaries as reference layers over maps and globes."
    serves: "Helps place fields geographically."
    origin: field
    depends_on: []
  - key: ensemble-spread-view
    title: "Ensemble Spread"
    summary: "Shows the mean, spread and members of a weather or climate ensemble as maps and spaghetti plots."
    serves: "Helps judge calibration of learned forecast ensembles."
    origin: field
    depends_on: []
  - key: anomaly-maps
    title: "Anomaly Maps"
    summary: "Shows fields minus a climatology on a diverging colour scale with the baseline chosen by the reader."
    serves: "Helps see what a forecast model gets right beyond the seasonal cycle."
    origin: field
    depends_on: [REN-14]
  - key: hovmoller-diagram
    title: "Hovmoller Diagram"
    summary: "Plots a field against longitude or latitude and time as an image."
    serves: "Helps see waves and propagation in forecasts."
    origin: field
    depends_on: []
  - key: vertical-cross-section
    title: "Cross-Sections"
    summary: "Cuts a three-dimensional field along a drawn path and shows the vertical section."
    serves: "Helps inspect atmosphere and ocean structure."
    origin: field
    depends_on: [REN-26]
  - key: forecast-skill-by-lead
    title: "Forecast Skill by Lead Time"
    summary: "Plots error and anomaly correlation against lead time per variable and region."
