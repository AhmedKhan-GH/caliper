    origin: field
    depends_on: [REN-12]
  - key: histograms-with-fits
    title: "Histograms with Fits and Ratio Panels"
    summary: "Shows binned counts with error bars, fitted curves, stacked samples and a ratio panel."
    serves: "Helps compare simulated and observed distributions."
    origin: field
    depends_on: []
  - key: tokamak-equilibrium
    title: "Tokamak Equilibrium View"
