  - key: cross-section-outline
    title: "Cross-Section Outline"
    summary: "Draws the outline where a plane cuts a mesh or cloud."
    serves: "Gives clean profiles for comparison and measurement."
    origin: field
    depends_on: [REN-26]
  - key: persistent-3d-annotations
    title: "Persistent 3-D Annotations"
    summary: "Notes, pins and sketches placed in a scene and stored with the recording."
    serves: "Keeps observations attached to the place they concern."
    origin: field
    depends_on: [REN-15, STR-12]
  - key: label-editing-3d
    title: "3-D Label Editing"
    summary: "Edits 3-D boxes and segment labels by dragging handles in the scene."
    serves: "Allows corrections of 3-D annotations in place."
    origin: field
    depends_on: [REN-62]
  - key: mesh-quality-overlays
    title: "Mesh Quality Overlays"
    summary: "Colours a mesh by triangle quality, normals flips, holes and non-manifold edges."
    serves: "Finds faults that break simulation and rendering."
    origin: field
    depends_on: [REN-18]
  - key: scalar-vector-fields-on-meshes
    title: "Scalar and Vector Fields on Meshes"
    summary: "Colours mesh surfaces by a scalar and draws vectors at vertices."
    serves: "Shows simulation and learning results on shapes."
    origin: field
    depends_on: [REN-18, REN-14]
  - key: point-cloud-registration-view
    title: "Point-Cloud Registration View"
    summary: "Shows two clouds aligned by an estimated transform, with correspondences and residual colouring."
    serves: "Helps debug registration methods."
    origin: field
    depends_on: [REN-32]
  - key: vr-ar-viewing
    title: "VR and AR Viewing"
    summary: "Views scenes in headsets with tracked controllers for navigation and picking."
    serves: "Gives a real sense of scale in 3-D data."
    origin: field
    depends_on: [REN-12]
  - key: stereo-view
    title: "Stereo View"
    summary: "Shows scenes as side-by-side or anaglyph stereo pairs."
    serves: "Helps judge depth in reconstructions."
    origin: field
    depends_on: [REN-12]
  - key: scene-diff
    title: "Scene Diff"
    summary: "Shows added, removed and moved entities between two scenes or times."
    serves: "Shows what changed between two reconstructions or frames."
    origin: field
    depends_on: [REN-12, RUN-08]
  - key: point-cloud-eye-dome-lighting
    title: "Eye-Dome Lighting"
    summary: "Shading for point clouds that emphasises depth edges without normals."
    serves: "Makes sparse clouds readable."
    origin: field
    depends_on: [REN-32]
  - key: point-cloud-splat-sizing
    title: "Adaptive Point Sizing"
    summary: "Point size follows distance, density or an attribute."
    serves: "Avoids holes and clutter in clouds of uneven density."
    origin: field
    depends_on: [REN-32]
  - key: point-cloud-segmentation-view
    title: "Point-Cloud Segmentation View"
    summary: "Colours points by predicted or labelled class and shows errors against labels."
    serves: "Debugs semantic segmentation of scans."
    origin: field
    depends_on: [REN-32, REN-41]
  - key: voxel-occupancy-comparison
    title: "Occupancy Prediction Comparison"
    summary: "Shows predicted and true occupancy grids side by side with errors marked."
    serves: "Debugs occupancy networks."
    origin: field
    depends_on: []
  - key: mesh-reconstruction-error
    title: "Reconstruction Error on Meshes"
    summary: "Colours a mesh by distance to a reference surface."
    serves: "Measures shape accuracy locally."
    origin: field
    depends_on: [REN-18]
  - key: normal-orientation-view
    title: "Normal Orientation View"
    summary: "Draws point or surface normals and flags inconsistent orientation."
    serves: "Finds normal estimation faults."
    origin: field
    depends_on: [REN-32]
  - key: depth-uncertainty-view
    title: "Depth Uncertainty in Scenes"
    summary: "Shows predicted depth with per-pixel uncertainty as colour or opacity in 3-D."
    serves: "Judges which parts of a reconstruction to trust."
    origin: field
    depends_on: [REN-38]
  - key: multi-view-consistency-view
    title: "Multi-View Consistency View"
    summary: "Shows where depth or points from different cameras disagree."
    serves: "Finds geometry errors in multi-view systems."
    origin: field
    depends_on: [REN-39]
  - key: epipolar-line-view
    title: "Epipolar Line View"
    summary: "Shows matches and epipolar lines between two images with their errors."
    serves: "Debugs feature matching and calibration."
    origin: field
    depends_on: [REN-39]
  - key: feature-track-view
    title: "Feature Track View"
    summary: "Shows tracked keypoints over frames and their reprojection error."
    serves: "Debugs tracking and structure from motion."
    origin: field
    depends_on: [REN-54]
  - key: camera-rig-view
    title: "Camera Rig View"
    summary: "Shows a set of rigidly mounted cameras and sensors with their extrinsics."
    serves: "Checks calibration of multi-sensor rigs."
    origin: field
    depends_on: [REN-39]
  - key: sensor-field-of-view
    title: "Sensor Field of View"
    summary: "Shows coverage volumes and blind zones of sensors in the scene."
    serves: "Helps design and check sensor layouts."
    origin: field
    depends_on: [REN-39]
  - key: occlusion-and-visibility-view
    title: "Visibility View"
    summary: "Shows which parts of a scene each camera sees."
    serves: "Finds poorly covered regions of a capture."
    origin: field
    depends_on: [REN-39]
  - key: terrain-height-field-view
    title: "Height-Field View"
    summary: "Shows a height map as terrain with colour and contours."
    serves: "Inspects elevation and depth data."
    origin: field
    depends_on: [REN-26]
  - key: scene-statistics-panel
    title: "Scene Statistics Panel"
    summary: "Counts of entities, points, triangles and memory, with a breakdown by type."
    serves: "Shows what makes a scene heavy."
    origin: field
    depends_on: [REN-31]
  - key: point-cloud-density-map
    title: "Point Density Map"
    summary: "Shows density of points per cell as a heat map on a plane."
    serves: "Finds gaps and over-sampled areas in captured data."
    origin: field
    depends_on: [REN-32]
  - key: change-detection-view
    title: "Change Detection View"
    summary: "Compares two scans of one place and colours what changed."
    serves: "Shows differences between captures over time."
    origin: field
    depends_on: [REN-32, RUN-08]
  - key: flow-in-3d-view
    title: "Scene Flow View"
    summary: "Draws 3-D motion vectors between two point clouds."
    serves: "Debugs scene flow and motion estimation."
    origin: field
    depends_on: [REN-32, REN-37]
