# yaml-language-server: $schema=schema.json
pillar: REN
title: Rendering and 3-D
proposed: false
candidates:
  - key: video-assets
    title: "Video Assets"
    summary: "A view plays a compressed video file frame by frame on a recording's timeline, decoded on the viewer's device."
    serves: "Vision and robot logs keep cameras as video, and a person checks a model's output against the footage at the same instant."
    origin: cut
    depends_on: [REN-38, STR-13]
  - key: encoded-depth
    title: "Encoded Depth Images"
    summary: "A scene accepts depth images compressed as RVL, PNG or TIFF and decodes them before back-projection."
    serves: "Depth cameras log compressed depth, and decoding it in the viewer keeps recordings small."
    origin: cut
    depends_on: [REN-38, REN-39]
  - key: map-view
    title: "Map View"
    summary: "A view draws geographic points, lines and regions over map tiles or a plain graticule."
    serves: "Field robotics, driving and geoscience data are located by latitude and longitude."
    origin: cut
    depends_on: [REN-12]
  - key: audio-view
    title: "Audio View"
    summary: "A view plays an audio signal and draws its waveform against the timeline."
    serves: "Speech and audio model work needs to hear a sample while reading its features."
    origin: cut
    depends_on: [STR-13]
  - key: state-timeline-view
    title: "State Timeline View"
    summary: "A view draws discrete states as coloured spans along a timeline, one lane per signal."
    serves: "Robot modes, training phases and agent states are read as when each began and ended."
    origin: cut
    depends_on: [STR-23]
  - key: graph-layout-view
    title: "Graph View with Layout"
    summary: "A view lays out nodes and edges by a force or layered layout when the data gives no positions."
    serves: "Computation graphs, knowledge graphs and circuits arrive as edges only."
    origin: cut
    depends_on: [REN-42]
  - key: raw-data-view
    title: "Raw Data View"
    summary: "A view lists the raw values behind any selected entity or view as a table."
    serves: "A person confirms what was actually sent when a picture looks wrong."
    origin: cut
    depends_on: [STR-08]
  - key: lens-distortion
    title: "Lens Distortion for Cameras"
    summary: "A pinhole camera carries distortion coefficients, and its image and frustum are drawn undistorted."
    serves: "Real camera calibration is checked against the 3-D reconstruction it produced."
    origin: cut
    depends_on: [REN-39]
  - key: positions-64-bit
    title: "64-Bit Positions"
    summary: "A scene keeps positions in 64-bit floats and draws them relative to the camera."
    serves: "Geospatial, orbital and city-scale data lose precision in 32-bit floats."
    origin: cut
    depends_on: [REN-11]
  - key: gaussian-splats
    title: "Gaussian Splats"
    summary: "A scene draws 3-D Gaussian splats with sorted alpha blending."
    serves: "Radiance-field and reconstruction research inspects a trained splat scene and its training progress."
    origin: cut
    depends_on: [REN-11]
  - key: voxel-grids
    title: "Voxel Grids"
    summary: "A scene draws a dense or sparse grid of voxels coloured by value or class."
    serves: "Occupancy prediction and 3-D segmentation are read cell by cell."
    origin: cut
    depends_on: [REN-11]
  - key: grid-maps
    title: "Grid Maps"
    summary: "A scene draws a 2-D grid, such as an occupancy or elevation map, placed in 3-D."
    serves: "Navigation stacks are checked against the map they plan on."
    origin: cut
    depends_on: [REN-38]
  - key: named-frames
    title: "Named Coordinate Frames"
    summary: "Transforms may be given between named frames that are independent of entity paths."
    serves: "Robot data whose frames do not form one tree is shown without remapping."
    origin: cut
    depends_on: [REN-40]
  - key: axis-angle-transforms
    title: "Axis-Angle Rotations"
    summary: "An entity transform accepts an axis and angle, and states which way the relation points."
    serves: "Kinematics code logs joints in the form it already holds."
    origin: cut
    depends_on: [REN-40]
  - key: entity-overrides
    title: "Per-Entity Display Overrides"
    summary: "A viewer changes how one entity is drawn, such as its colour, size or visibility, without changing the data."
    serves: "A person isolates or restyles one object in a crowded scene."
    origin: cut
    depends_on: [REN-12]
  - key: markdown-document-view
    title: "Markdown Document View"
    summary: "A live view shows a Markdown document that a script sends and updates."
    serves: "A run explains itself, with notes and results beside its views."
    origin: cut
    depends_on: [STR-01]
  - key: series-styles
    title: "Series Line and Point Styles"
    summary: "A series chooses line, step, point or area drawing, with marker shapes and line widths."
    serves: "Sparse evaluations, step-wise schedules and dense losses read differently on one chart."
    origin: cut
    depends_on: [STR-01]
  - key: human-skeleton-demo
    title: "Human Skeleton Demo"
    summary: "A demo draws a tracked human skeleton from keypoints as moving bones and joints."
    serves: "A person checks a pose-estimation model against its keypoints."
    origin: cut
    depends_on: [REN-48, REN-42]
  - key: unlit-and-strip-draws
    title: "Unlit Triangles, Triangle Strips and per-Draw State"
    summary: "A scene primitive may state its own unlit shading, triangle-strip topology, depth test and blend mode."
    serves: "An instrument that draws a field-specific picture can choose how each draw is shaded and blended."
    origin: cut
    depends_on: [REN-34, REN-35]
  - key: render-to-tensor-path
    title: "Render-to-Tensor Path"
    summary: "A rendered frame, or its depth and ids, is handed back to the script as a tensor on the GPU."
    serves: "Differentiable rendering, synthetic data and vision models in the loop use the picture Caliper draws."
    origin: cut
    depends_on: [REN-09, REN-64]
  - key: dlpack-into-scenes
    title: "DLPack Path into Scenes"
    summary: "A Python script hands GPU tensors to a scene through DLPack with no copy."
    serves: "Simulation and model outputs already on the GPU are drawn in 3-D at full rate."
    origin: plan-idea
    depends_on: [REN-08, STR-10]
  - key: cone-arrow-heads
    title: "Cone Arrow Heads"
    summary: "Arrows in a 3-D scene may end in a lit cone sized in scene units, in place of a flat triangle of fixed pixel size."
    serves: "A person reads the direction of forces and flow vectors in 3-D from any angle."
    origin: plan-idea
    depends_on: [REN-37]
  - key: sorted-transparency
    title: "Sorted Transparency"
    summary: "Translucent draws in a scene are sorted by depth so that overlapping translucent surfaces blend correctly."
    serves: "Density shells and overlapping translucent meshes read correctly in a field or reconstruction."
    origin: plan-idea
    depends_on: [REN-12, REN-63]
  - key: camera-motion-decimation
    title: "Decimation During Camera Motion"
    summary: "A second, coarser level of detail is drawn while the camera moves, so that orbiting stays smooth over the budget."
    serves: "A person orbits a very large point cloud in a browser without stalls."
    origin: plan-idea
    depends_on: [REN-24]
  - key: measured-versus-interpolated
    title: "Measured and Interpolated Marks"
    summary: "A view marks which values were measured and which are interpolated or nearest."
    serves: "A person never mistakes a smooth transition for data."
    origin: adjacent-work
    depends_on: [STR-08]
  - key: labelled-matrix-grid
    title: "Labelled Matrix Grid"
    summary: "A small matrix is drawn as a grid with row and column labels and the value written in every cell."
    serves: "Small score and weight matrices are read exactly."
    origin: adjacent-work
    depends_on: [STR-08]
  - key: projection-disclosure
    title: "Projection Disclosure"
    summary: "Every projected view states its projection method and how much variance it keeps."
    serves: "A person knows how far to trust distances in a picture."
