# caliper-agent: the widget agent of Caliper. It is an ACP agent on stdio whose
# loop runs on Pydantic AI, against the Claude API with the user's key or any
# OpenAI-compatible server, and acts on Caliper through Caliper API on loopback.
# Design: design/byok-agent.md.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-agent"
version = "0.1.0"
description = "The widget agent of Caliper: an ACP agent on stdio that drives Caliper through the Claude API or an OpenAI-compatible server."
readme = { text = "See design/byok-agent.md in the Caliper repository.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # The agent loop and the provider layer: the slim distribution with the
    # anthropic extra (the official Claude API SDK underneath). The full
    # `pydantic-ai` package would pull every provider's SDK. Tested with 2.68.
    "pydantic-ai-slim[anthropic]>=2.68,<3",
    # The official Claude API SDK. 2.x sends API version 2026-10-21.
    "anthropic>=2.8,<3",
    # The OpenAI SDK, for OpenAI-compatible servers, installed directly rather
    # than through Pydantic AI's openai extra, which also pulls tiktoken (and
    # with it requests, certifi, regex and more) for features the sidecar does
    # not use. Tested with 3.51.
    "openai>=3.51,<4",
]

[project.optional-dependencies]
# agent-client-protocol: the official ACP Python SDK, used by the tests only, to
# validate every message the sidecar sends against the protocol's models.
test = ["pytest>=8", "agent-client-protocol>=1.0,<2"]

[project.scripts]
caliper-agent = "caliper_agent.cli:main"

[tool.setuptools.packages.find]
include = ["caliper_agent*"]

[tool.setuptools.package-data]
# The provider presets, which the key store embeds at build time too.
caliper_agent = ["presets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
