# Library piece arrows@1: arrows from origins along vectors, drawn as the built-in arrows primitive draws them.
name = "arrows"
version = 1
description = "Arrows from origins along vectors, a shaft of a width in pixels and a flat head, colored by one color, by a value through a colormap, or by a packed RGBA"
imports = ["pick@1", "camera@1"]

[[inputs]]
name = "origins"
kind = "tensor"
rank_min = 2
rank_max = 2
title = "Origins (N, 3), or (N, 2) with z 0"

[[inputs]]
name = "vectors"
kind = "tensor"
rank_min = 2
rank_max = 2
title = "Vectors (N, 3), or (N, 2) with z 0: each arrow's tip is its origin plus its vector"

[[inputs]]
name = "values"
kind = "tensor"
rank_min = 1
rank_max = 1
title = "Values of the arrows, or one for all: a value for the colormap, or a packed RGBA in its bits"

[[params]]
name = "width"
default = 2.0
min = 0.0
max = 128.0
title = "Width in Pixels"

[[params]]
name = "color_mode"
type = "u32"
default = 0
min = 0
max = 2
title = "Color (0 one color, 1 colormap, 2 packed RGBA)"

[[params]]
name = "color"
type = "u32"
default = 4292664550
title = "One Color as Packed RGBA"

[[params]]
name = "colormap"
type = "u32"
default = 0
min = 0
max = 3
title = "Colormap (0 viridis, 1 magma, 2 rdbu, 3 greys)"

[[params]]
name = "range"
type = "u32"
default = 3
min = 0
max = 3
title = "Ends From the Values (0 none, 1 start, 2 end, 3 both)"

[[params]]
name = "vmin"
default = 0.0
title = "Value at the Colormap's Start"

[[params]]
name = "vmax"
default = 1.0
title = "Value at the Colormap's End"

[[params]]
name = "depth_offset"
type = "i32"
default = 0
min = -8
max = 8
title = "Depth Offset Toward the Camera"

# One element for each arrow, in the order of the rows. An arrow past the rows of `vectors` has
# `index` 0xffffffff and is not drawn. 32 bytes, thus 262,143 fit beside `info` in the 8 MiB of
# published resources.
[[resources]]
id = "arrows"
kind = "buffer"
struct = "Arrow"
fields = ["ox: f32", "oy: f32", "oz: f32", "color: u32", "vx: f32", "vy: f32", "vz: f32", "index: u32"]
count = 262143
counted = true

# The finite range of the values and two flags: bit 0 a NaN or no value, bit 1 a packed RGBA with
# an alpha below 255.
[[resources]]
id = "info"
kind = "buffer"
struct = "Info"
fields = ["lo: f32", "hi: f32", "flags: u32"]
count = 1

# The greatest key, the greatest inverted key and the flags of the values that each of 4,096
# invocations saw.
[[resources]]
id = "scratch"
kind = "buffer"
element = "u32"
count = 12288
publish = false

[derive]
time_ms = 50
memory_mb = 128

[[derive.passes]]
entry = "build_arrows"
workgroups = [1024, 1, 1]
writes = ["arrows"]

[[derive.passes]]
entry = "scan_values"
workgroups = [16, 1, 1]
writes = ["scratch"]

[[derive.passes]]
entry = "finish_info"
writes = ["info"]

[draw]
camera = "orbit"
pick = { resource = "arrows", fields = ["index"] }

# Opaque arrows write depth; arrows of a color with an alpha below 255 only test it, as the
# built-in draws translucent batches. Each pass hides the arrows of the other.
[[draw.passes]]
kind = "render"
vertex = "opaque_vs"
fragment = "arrow_fs"
instances = "arrows"
vertices = 9
topology = "triangle_list"
blend = "alpha"
depth = "write"
pick = true

[[draw.passes]]
kind = "render"
vertex = "translucent_vs"
fragment = "arrow_fs"
instances = "arrows"
vertices = 9
topology = "triangle_list"
blend = "alpha"
depth = "test"
pick = true
