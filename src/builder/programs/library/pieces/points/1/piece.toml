# Library piece points@1: a cloud of points, drawn as the built-in points primitive draws it.
name = "points"
version = 1
description = "A cloud of round or square points of a size in pixels or of radii in scene units, colored by one color, by a value through a colormap, or by a packed RGBA"
imports = ["pick@1", "camera@1"]

[[inputs]]
name = "positions"
kind = "tensor"
rank_min = 2
rank_max = 2
title = "Positions (N, 3), or (N, 2) with z 0"

[[inputs]]
name = "values"
kind = "tensor"
rank_min = 1
rank_max = 1
title = "Values (N): a value for the colormap, or a packed RGBA in its bits"

[[inputs]]
name = "radii"
kind = "tensor"
rank_min = 1
rank_max = 1
optional = true
title = "Radii (N) in scene units, or one for all, read when radius_mode is 1; unbound, a radius of 1"

[[params]]
name = "size"
default = 4.0
min = 1.0
max = 64.0
title = "Size in Pixels"

[[params]]
name = "shape"
type = "u32"
default = 1
min = 0
max = 1
title = "Shape (0 square, 1 disc)"

[[params]]
name = "color_mode"
type = "u32"
default = 1
min = 0
max = 2
title = "Color (0 one color, 1 colormap, 2 packed RGBA)"

[[params]]
name = "color"
type = "u32"
default = 4294967295
title = "One Color as Packed RGBA"

[[params]]
name = "colormap"
type = "u32"
default = 0
min = 0
max = 3
title = "Colormap (0 viridis, 1 magma, 2 rdbu, 3 greys)"

[[params]]
name = "vmin"
default = 0.0
title = "Value at the Colormap's Start"

[[params]]
name = "vmax"
default = 1.0
title = "Value at the Colormap's End"

[[params]]
name = "radius_mode"
type = "u32"
default = 0
min = 0
max = 1
title = "Size (0 size in pixels, 1 radius in scene units)"

# A radius r in scene units is r * radius_scale * (proj_x, proj_y) in clip units, at least half a
# pixel, as the built-in computes it: radius_scale is the longest column of the model-view's
# rotation part, and proj_x and proj_y are the projection's scales |proj[0][0]| and |proj[1][1]|.
[[params]]
name = "radius_scale"
default = 1.0
title = "Scene Units to View Units"

[[params]]
name = "proj_x"
default = 1.0
title = "Projection's Horizontal Scale"

[[params]]
name = "proj_y"
default = 1.0
title = "Projection's Vertical Scale"

[[resources]]
id = "points"
kind = "buffer"
struct = "Point"
fields = ["position: vec4<f32>", "bits: u32", "index: u32"]
# 4,194,304 points of 32 bytes: 128 MiB, the most that a published resource holds.
count = 4194304
counted = true

# The derive half holds the 128 MiB buffer and the positions (48 MiB) and values (16 MiB) of the most points.
[derive]
memory_mb = 256

[[derive.passes]]
entry = "copy_points"
workgroups = [16384, 1, 1]
writes = ["points"]

[draw]
memory_mb = 160
camera = "orbit"
pick = { resource = "points", fields = ["index"] }

[[draw.passes]]
kind = "render"
vertex = "point_vs"
fragment = "point_fs"
instances = "points"
vertices = 6
topology = "triangle_list"
blend = "alpha"
depth = "write"
pick = true
